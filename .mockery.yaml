# Mockery configuration (v3)
# NOTE: with-expecter is enabled by default in v3
#
# Rule: every production interface that is stubbed in tests should be
# listed here. Hand-written test doubles drift as interfaces evolve
# (see backlog 5.9 and the PR #234 / stubStore incident). Regenerate
# with `mockery` after editing this file and commit the result.
all: false
dir: internal/database/mocks
filename: mock_store.go
pkgname: mocks

packages:
  github.com/falkcorp/audiobook-organizer/internal/database:
    interfaces:
      Store:
      ImportPathStore:
      OperationStore:
      OpsV2Store:
  github.com/falkcorp/audiobook-organizer/internal/operations:
    config:
      dir: internal/operations/mocks
    interfaces:
      ProgressReporter:
        config:
          filename: mock_progress_reporter.go
  github.com/falkcorp/audiobook-organizer/internal/scanner:
    config:
      dir: internal/scanner/mocks
      filename: mock_scanner.go
    interfaces:
      Scanner:
  github.com/falkcorp/audiobook-organizer/internal/metadata:
    interfaces:
      MetadataExtractor:
        configs:
          # Exported mock in metadata/mocks for external users
          # (internal/server tests, etc.).
          - dir: internal/metadata/mocks
            filename: mock_metadata_extractor.go
          # Unexported test-only mock in the metadata package itself,
          # so metadata's own tests (assemble_test.go, ...) can use a
          # mockery-generated double without creating an import cycle
          # through metadata/mocks.
          - dir: internal/metadata
            pkgname: metadata
            filename: mock_metadata_extractor_test.go
            structname: mockMetadataExtractorInternal
      MetadataSource:
        config:
          dir: internal/metadata/mocks
          filename: mock_metadata_source.go
      ContextualSearch:
        config:
          dir: internal/metadata/mocks
          filename: mock_contextual_search.go
  github.com/falkcorp/audiobook-organizer/internal/ai:
    interfaces:
      MetadataCandidateScorer:
        config:
          dir: internal/ai/mocks
          filename: mock_metadata_candidate_scorer.go
      # metadataLLMBackend is unexported, so its mock must live in the
      # ai package itself (can't import an unexported type from a mocks
      # subpackage). Using a _test.go filename keeps the mock out of
      # the production build.
      metadataLLMBackend:
        config:
          dir: internal/ai
          pkgname: ai
          filename: mock_metadata_llm_backend_test.go
          structname: mockMetadataLLMBackend
  # The capability interfaces below are unexported, so each mock must live in
  # its own package (an unexported type cannot be imported from a mocks
  # subpackage) with a _test.go filename that keeps it out of the production
  # build -- same arrangement as metadataLLMBackend above.
  #
  # fingerprintResetter is deliberately NOT here. Its only call site,
  # runResetAll, also drops dedup candidates, wipes the LSH index and
  # re-enqueues a rescan, so exercising it needs an sdk.Reporter and several
  # more stubs -- a large fixture for one batch-size assertion. A mock that is
  # only ever called by the test that sets it up asserts nothing.
  #
  # lshCandidateStore is deliberately NOT here either. Its only call site sits
  # ~4,000 lines into dedup/engine.go's unified-scoring pass, inside a nested
  # per-book/per-file loop reached only after fingerprint and boilerplate
  # filtering, so a mock cannot be driven without standing up that whole pass.
  # It also feeds the Tier-0 collector path, which is BLOCKED pending a decision
  # about running it against the production library -- so a test pinning its
  # behaviour would be pinning behaviour that may yet be deleted.
  #
  # chapterStore is deliberately NOT here, and this one was added and then
  # removed. Both behaviours a mock would pin -- the idempotency guard and the
  # absent-capability warning -- are already covered in
  # internal/scanner/chapter_persistence_test.go against a REAL Pebble store,
  # which is stronger evidence than a mock: the idempotency test writes a
  # sentinel chapter list and asserts it comes back untouched through the actual
  # persistence layer.
  #
  # What that coverage was missing was not a mock. The idempotency test carried
  # requireChapterTestFFprobe/requireChapterTestFixture guards it did not need --
  # it returns at the `len(existingChapters) > 0` check, before any probe or file
  # access -- and no workflow installs ffmpeg, so it SKIPPED on every CI run. The
  # fix was deleting two lines from the test, not generating a mock.
  #
  # The lesson generalises: check whether a behaviour is already covered, and
  # whether the covering test actually RUNS, before adding a double for it.
  #
  # internal/plugins/dedup's ISBNIndexStore is deliberately NOT here, for a
  # different reason than the three above: a mock would be actively misleading.
  # What resolveISBNIndexStore has to get right is walking the decorator chain,
  # and a generated mock satisfies the interface by construction -- it resolves
  # on the FIRST assertion whether or not the resolver ever unwraps, so the
  # mutation that reverts AsCapability to a bare assertion would still pass.
  # internal/plugins/dedup/isbn_index_store_capability_test.go uses hand-written
  # fixtures instead: a decorator embedding the database.Store interface over a
  # capable store. That mutation was run and it goes red.
  #
  # This applies to every resolveX in the sweep: never mock the interface a
  # capability resolver resolves.
  #
  # These exclusions are judgement calls about test value, not claims that the
  # code is untestable. If either call site is ever extracted into a function
  # taking its store as a parameter -- the way spawnContributorWarm was -- the
  # mock becomes cheap and should be added.
  #
  # keyCounter and chapterStore are NOT declared here: their packages already
  # have blocks further up, and mockery rejects a duplicate package key outright
  # (it does not silently merge or last-write-win). Their entries live in those
  # blocks, each overriding the package-level mocks-subpackage config with an
  # in-package _test.go file, because both interfaces are unexported.
  #
  # These mocks are for CALL-SITE BEHAVIOUR tests only. They must never be used
  # to test resolveX: a mock satisfies its interface by construction, so it
  # would pass in precisely the case those tests exist to catch (the real store
  # failing to satisfy the capability through the indexedStore decorator). The
  # resolution tests deliberately use real structs embedding database.Store.
  github.com/falkcorp/audiobook-organizer/internal/server:
    interfaces:
      prefixWiper:
        config:
          dir: internal/server
          pkgname: server
          filename: mock_prefix_wiper_test.go
          structname: mockPrefixWiper
      # warmupWaiter pins ORDER, not resolution: the contributor cache must not
      # be built until WaitForWarmup returns, or it caches the author set of a
      # half-published memdb and serves it for the whole TTL. Testable only
      # because spawnContributorWarm takes the store as a parameter.
      warmupWaiter:
        config:
          dir: internal/server
          pkgname: server
          filename: mock_warmup_waiter_test.go
          structname: mockWarmupWaiter
  github.com/falkcorp/audiobook-organizer/internal/maintenance/jobs:
    interfaces:
      aggregatesBackfillMarker:
        config:
          dir: internal/maintenance/jobs
          pkgname: jobs
          filename: mock_aggregates_backfill_marker_test.go
          structname: mockAggregatesBackfillMarker
  github.com/falkcorp/audiobook-organizer/internal/logger:
    config:
      dir: internal/logger/mocks
    interfaces:
      OperationStore:
        config:
          filename: mock_operation_store.go
      RealtimeHub:
        config:
          filename: mock_realtime_hub.go
      ActivityLogWriter:
        config:
          filename: mock_activity_log_writer.go
      RetentionStore:
        config:
          filename: mock_retention_store.go
  github.com/falkcorp/audiobook-organizer/internal/server/handlers:
    config:
      dir: internal/server/handlers/mocks
      filename: "mock_{{.InterfaceName | snakecase}}.go"
      pkgname: handlersmocks
    interfaces:
      # keyCounter is unexported, so it overrides the mocks-subpackage config
      # above with an in-package _test.go file. It gates the Pebble section of
      # the db-health payload: absent the capability the section is OMITTED and
      # db-health still reports healthy. Note the asymmetry the mock makes
      # visible -- a KeyCount() ERROR does not omit the section, it reports zeros.
      keyCounter:
        config:
          dir: internal/server/handlers
          pkgname: handlers
          filename: mock_key_counter_test.go
          structname: mockKeyCounter
      AuthStore:
      APIKeyHandlerStore:
      PluginRegistrar:
      CacheMetricsStore:
      CacheMetadataStore:
      ReadingStore:
      ActivityService:
      ActivityOpsStore:
      UserStore:
      SplitBookOpEnqueuer:
      SplitBookCandidateStore:
      MetadataCacheBookStore:
      MetadataCacheFetchService:
      WriteBackEnqueuer:
      FileIOPool:
      EventPublisher:
      RenameServicer:
      OrganizePreviewServicer:
      OrganizeServicer:
      FilesystemBrowser:
      ImportPathCreator:
      FileImporter:
      FilesystemStore:
      PlaylistStore:
      VersionsStore:
      OperationsRegistry:
      OperationsEventHub:
      ITunesService:
