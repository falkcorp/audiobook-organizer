# file: docker-compose.yml
# version: 1.3.0
# guid: 08a9b7c6-d5e4-4f3a-b2c1-0d9e8f7a6b5c
# last-edited: 2026-11-18

services:
  audiobook-organizer:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: audiobook-organizer:latest
    ports:
      - "${AO_PORT:-8484}:8484"
    volumes:
      - ao-data:/data
      # The host's library folder, mounted read-only at /audiobooks. Set the
      # library root to /audiobooks in Settings (the core.library.roots key).
      - ${LIBRARY_HOST_DIR:-./audiobooks}:/audiobooks:ro
    environment:
      # Basic-gate variables: a bare name passes the host's value through only
      # when it is set on the host. Nothing here defaults the gate off, so a
      # gate enabled in Settings stays on.
      - ABO_CORE_HTTP_BASIC_GATE_ENABLED
      - ABO_CORE_HTTP_BASIC_GATE_USERNAME
      - ABO_CORE_HTTP_BASIC_GATE_PASSWORD
      - ABO_CORE_SHUTDOWN_BUDGET=25s
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8484/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  ao-data:
