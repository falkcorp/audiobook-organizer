# file: deploy/prometheus/alert-rules.yml
# version: 1.4.0
# guid: d2e3f4a5-b6c7-4d8e-9f0a-1b2c3d4e5f6a
# last-edited: 2026-10-10
#
# TEMPLATE / SNIPPET — Prometheus alerting rules for audiobook-organizer
# (OPS-4/OPS-5). This is NOT installed or evaluated by this repo; it must be
# loaded as a rule file by an operator's own Prometheus + Alertmanager
# install (see docs/system/runbooks.md, "Monitoring & Alerting Runbook",
# for the load + wiring procedure).
#
# Design goals covered by these rules: op failure rate, AI-backend
# availability, memory pressure vs the real cgroup limit, service
# down/unreachable, and disk space (prerequisite: node_exporter — NOT
# installed by this repo, called out explicitly below rather than assumed).

groups:
  - name: audiobook-organizer
    rules:
      # OPS-5: operation wedges/failures were previously only noticed by a
      # human. audiobook_organizer_operations_failed_total already exists
      # (internal/metrics/metrics.go, IncOperationFailed) — alert on its
      # rate rather than duplicating the counter. Threshold of 0.1/s
      # sustained for 10m is conservative: on a single-instance deployment
      # doing periodic imports/scans/dedup, transient failures are common,
      # but a sustained ~6/min failure rate across a 10m window indicates a
      # real regression (e.g. a bad importer run, a wedged op type) rather
      # than isolated noise. Tune down as real-world false-positive/negative
      # rates are observed.
      # Soak until 2026-11-09; then delete in a follow-up PR (the V2 rule
      # below reads the OTel family audiobook_organizer_ops_runs_total).
      - alert: AudiobookOrganizerOpFailuresHigh
        expr: rate(audiobook_organizer_operations_failed_total[15m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "audiobook-organizer operation failure rate is high"
          description: >-
            Operation failure rate has exceeded 0.1/s (sustained over 15m)
            for at least 10 minutes. Check `journalctl -u
            audiobook-organizer` and the Operations tab for the failing op
            type(s).

      # OTel twin of AudiobookOrganizerOpFailuresHigh (11-PR4). Counts runs in
      # audiobook_organizer_ops_runs_total (plural "ops"). outcome=timed_out is
      # listed so the rule stays correct once 05-PR2 produces it; until then a
      # deadline hit is recorded as outcome=canceled, which this rule does not
      # count (the old operations_failed_total did not count timeouts either).
      # Summed by def_id so it keeps the old rule's per-operation threshold
      # (the old rule fires per op_type series) and def_id lands on the alert.
      # Soak until 2026-11-09 beside the old rule, then keep only this one.
      - alert: AudiobookOrganizerOpFailuresHighV2
        expr: sum by (def_id) (rate(audiobook_organizer_ops_runs_total{outcome=~"failed|timed_out"}[15m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "audiobook-organizer operation failure rate is high"
          description: >-
            Operation {{ $labels.def_id }} has had more than 0.1/s failed
            or timed-out runs over 15m for at least 10 minutes. Check
            `journalctl -u audiobook-organizer` and the Operations tab for
            that operation's recent failures.

      # OPS-4: covers "AI backend (OpenAI/local Ollama) down" — the case
      # that was previously only discovered via OpenAI quota exhaustion
      # symptoms. audiobook_organizer_ai_backend_available{backend} is set
      # once at server-init time (internal/server/server.go, alongside
      # EmbeddingClient.SetOllamaAvailable) — it reflects reachability at
      # startup, not a continuous health-check loop, so this alert mainly
      # catches "backend was down when the service last started/restarted"
      # rather than a backend that fails mid-session. That's the same
      # limitation the underlying signal has today; extending it to a
      # polling loop is out of scope for this task.
      - alert: AudiobookOrganizerBackendUnavailable
        expr: audiobook_organizer_ai_backend_available == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "audiobook-organizer AI backend unavailable"
          description: >-
            The {{ $labels.backend }} AI backend has been reported
            unavailable for at least 5 minutes. Embedding/LLM-dependent
            features (dedup, transcription matching) will degrade or fail.

      # Memory bloat (69GB cache-warmup incident) was discovered by a human
      # noticing symptoms, not an alert. deploy/audiobook-organizer.service
      # sets MemoryMax=12G (and GOMEMLIMIT=9GiB); 1.1e10 bytes is ~90% of
      # 12G (12 * 1024^3 ~= 1.288e10; 90% ~= 1.16e10 — 1.1e10 is a slightly
      # more conservative ~85% trigger point to leave headroom before the
      # cgroup OOM-kills the process).
      - alert: AudiobookOrganizerMemoryHigh
        expr: process_resident_memory_bytes{job="audiobook-organizer"} > 1.1e10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "audiobook-organizer memory usage approaching cgroup limit"
          description: >-
            RSS has exceeded ~1.1e10 bytes (~90% of the 12G MemoryMax in
            deploy/audiobook-organizer.service) for at least 10 minutes.
            Risk of cgroup OOM-kill; check for a warmup/cache regression.

      # Standard "service is down/unreachable" proxy. There is no explicit
      # restart-count metric today, so a scrape gap on the `up` series
      # (Prometheus's own synthetic per-target metric) is the practical
      # signal for both crashes and restarts.
      - alert: AudiobookOrganizerDown
        expr: up{job="audiobook-organizer"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "audiobook-organizer is down or unreachable"
          description: >-
            Prometheus has been unable to scrape the audiobook-organizer
            target for at least 2 minutes.

      # Disk space. PREREQUISITE: this rule requires node_exporter to also
      # be scraped (not installed or configured by this repo/task — install
      # separately, e.g. `apt install prometheus-node-exporter`, and add a
      # matching scrape job). Without node_exporter this rule will simply
      # never fire (no data), not silently succeed — do not assume it is
      # active just because this rule file is loaded.
      - alert: AudiobookOrganizerDiskLow
        expr: >-
          node_filesystem_avail_bytes{mountpoint="/var/lib/audiobook-organizer"}
          / node_filesystem_size_bytes{mountpoint="/var/lib/audiobook-organizer"}
          < 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "audiobook-organizer data volume is low on disk space"
          description: >-
            Less than 10% free space remains on
            /var/lib/audiobook-organizer for at least 10 minutes. Requires
            node_exporter scraping the host (see prerequisite note above).

      # OP-STALL (2026-07-17 devops follow-up, T12 item 2; finalized TODO #36):
      # "op active but making no progress" — the class of incident behind the
      # 3+ hour dedup.full-scan hang (docs/audits/2026-07-05-concurrency-
      # single-threaded-hotspots.md) and the 9hr Pebble write-stall freeze
      # (project_concurrency_followups_jul5). Both were only noticed by a
      # human watching the UI, not by an alert.
      #
      # The exporter now exists: internal/metrics/metrics.go's
      # audiobook_organizer_op_items_processed{op_id,op_type} gauge is set on
      # every ProgressReporter.UpdateProgress call (internal/operations/
      # registry/reporter_db.go, dbReporter.UpdateProgress ->
      # metrics.SetOpProgress) and deleted the instant the op reaches a
      # terminal state (registry.publishOpTerminal -> metrics.ClearOpProgress
      # — the single choke point every terminal transition already routes
      # through). Because the series only exists while an op is in flight, no
      # separate "op_active" gauge is needed: the expr below implicitly
      # requires the op to still be running simply by referencing a series
      # that stops existing the moment it isn't. A companion
      # audiobook_organizer_op_items_total{op_id,op_type} gauge is also
      # exported (same lifecycle) so percent-complete is computable
      # (op_items_processed / op_items_total) even though it isn't needed by
      # this rule.
      #
      # rate() over a gauge is valid here because, within one op_id's
      # lifetime, "current" is monotonically non-decreasing (a real progress
      # counter) and the series is deleted rather than reset to 0 on
      # completion — so there is never an in-series counter-reset for rate()
      # to misinterpret.
      # Soak until 2026-11-09; then delete in a follow-up PR (see
      # AudiobookOrganizerOpStalledV2 below, which reads per-def series
      # instead of this per-run gauge).
      - alert: AudiobookOrganizerOpStalled
        expr: rate(audiobook_organizer_op_items_processed[30m]) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "audiobook-organizer operation appears stalled"
          description: >-
            An operation ({{ $labels.op_type }}, {{ $labels.op_id }}) has
            been active for at least 30 minutes with zero items processed
            in that window — likely wedged rather than merely slow. Check
            `journalctl -u audiobook-organizer` and GET
            /api/v1/operations/v2/{{ $labels.op_id }} for the last log line.

      # OTel replacement for AudiobookOrganizerOpStalled (11-PR4). Fires per
      # def_id when the most idle executing run of that def has been silent
      # for longer than that def's own silence budget, with a 30-minute floor.
      # audiobook_organizer_ops_progress_age_seconds is read from the
      # registry's in-memory runHandle.lastProgressAt, the clock the stuck-op
      # watchdog uses, at scrape time. Every UpdateProgress stamps it,
      # including a heartbeat that repeats the same value. So a phase that
      # reports a constant current is alive while it keeps reporting: a
      # database backup at 0/0, or a hash pass pinned at total/total. Item
      # throughput (rate of ops_items_total) cannot see those phases and
      # would fire on them. (That counter is audiobook_organizer_ops_items_total,
      # plural "ops", NOT the legacy per-run gauge
      # audiobook_organizer_op_items_total.)
      # A run that has not reported yet in this attempt is aged from the
      # attempt's start. A run claimed by the dispatcher but not yet picked
      # up by a worker has no age and cannot fire this rule.
      # audiobook_organizer_ops_progress_timeout_seconds is the def's
      # effective ProgressTimeout, the budget after which the watchdog cancels
      # a silent run: 5m by default, and 45m to 2h for the LivenessNone defs
      # that declare long silences (scheduler.dedup-llm-review is 2h). Judging
      # every def against a flat 30m paged on healthy runs of those defs inside
      # their own budgets. With the budget as the threshold the rule asks "did
      # the watchdog fail to stop this run?"; clamp_min keeps the 30m floor for
      # the short-budget defs, so a 5m-budget def still needs 30m of silence.
      # Both sides are aggregated by def_id, so they match one-to-one, and
      # both gauges come from one callback, so neither is ever present alone.
      # Both read 0 once a def has no run in flight, so a finished run clears
      # the alert at the next scrape.
      # for: 5m, not 30m. The budget is already in the threshold, so `for`
      # only rides out a missed scrape or a restart, and the alert fires about
      # 5 minutes after the budget (or the 30m floor) is exceeded.
      # Unit tests: alert-rules.test.yml (promtool test rules), run by
      # internal/opsmetrics TestPromRules_Promtool when promtool is on PATH.
      # Soak until 2026-11-09 beside the old rule.
      - alert: AudiobookOrganizerOpStalledV2
        expr: >-
          max by (def_id) (audiobook_organizer_ops_progress_age_seconds)
          > clamp_min(max by (def_id) (audiobook_organizer_ops_progress_timeout_seconds), 1800)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "audiobook-organizer operation appears stalled"
          description: >-
            Operation {{ $labels.def_id }} has a run in flight that has
            not reported progress for {{ $value | humanizeDuration }},
            longer than the silence budget its watchdog allows (and at
            least 30 minutes), so it is likely wedged and the watchdog
            did not stop it. Check
            `journalctl -u audiobook-organizer` and the Operations tab for
            that operation's last log line.
