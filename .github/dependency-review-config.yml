# file: .github/dependency-review-config.yml
# version: 1.4.0
# guid: dep-review-cfg-2025-12-07
# last-edited: 2026-10-10

# Dependency Review Configuration
# This file configures the dependency-review-action for automated security scanning

# Fail the build if vulnerabilities of moderate or higher severity are found
fail-on-severity: moderate

# Allow these licenses (cannot be combined with deny-licenses)
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - 0BSD
  - CC0-1.0
  - Unlicense
  - MPL-2.0
  - LGPL-2.1
  - LGPL-3.0

# Allow specific packages even if they have denied licenses.
#
# The golang.org/x/* modules are BSD-3-Clause — which IS in allow-licenses above — plus
# Go's standard PATENTS file, an ADDITIONAL grant of patent rights that makes them
# strictly more permissive than BSD-3-Clause alone. ScanCode reports the pair as the
# compound expression:
#
#   BSD-3-Clause AND LicenseRef-scancode-google-patent-license-golang
#
# allow-licenses matches the WHOLE SPDX expression, not each term, so the compound
# string fails the policy even though both halves are acceptable. Adding
# LicenseRef-scancode-google-patent-license-golang to allow-licenses would not fix it
# either — the expression still would not equal any single allowed entry — and it would
# quietly widen the policy for every ecosystem. Naming the packages is the narrow fix.
#
# Listed WITHOUT versions so the entry matches any version. Dependency Review only
# reviews CHANGED dependencies, so this failure appears the moment any one of these is
# bumped and not before: it first blocked #2305, where bytedance/sonic 1.15.1 → 1.15.2
# pulled golang.org/x/arch. All nine are listed rather than just that one, because the
# other eight are the same license under the same policy and would each have produced an
# identical surprise on their next bump.
allow-dependencies-licenses:
  - pkg:golang/golang.org/x/arch
  - pkg:golang/golang.org/x/crypto
  - pkg:golang/golang.org/x/exp
  - pkg:golang/golang.org/x/net
  - pkg:golang/golang.org/x/oauth2
  - pkg:golang/golang.org/x/sync
  - pkg:golang/golang.org/x/sys
  - pkg:golang/golang.org/x/text
  - pkg:golang/golang.org/x/time
  # OpenTelemetry Go. Each module's LICENSE is Apache-2.0 followed by a
  # BSD-3-Clause section ("Copyright 2009 The Go Authors") for code copied from
  # the Go standard library. Both licenses are in allow-licenses, but ScanCode
  # reports the pair as LicenseRef-bad-apache-2.0-bsd-3-clause, which matches
  # no entry: the same whole-expression trap as golang.org/x above. It first
  # failed on 2026-10-10 when otlpmetricgrpc v1.47.0 arrived (#3916).
  # Listed: every go.opentelemetry.io module in the build whose LICENSE has
  # that section (auto/sdk and proto/otlp are plain Apache-2.0 and pass).
  - pkg:golang/go.opentelemetry.io/otel
  - pkg:golang/go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetricgrpc
  - pkg:golang/go.opentelemetry.io/otel/exporters/otlp/otlptrace
  - pkg:golang/go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc
  - pkg:golang/go.opentelemetry.io/otel/exporters/prometheus
  - pkg:golang/go.opentelemetry.io/otel/exporters/stdout/stdouttrace
  - pkg:golang/go.opentelemetry.io/otel/log
  - pkg:golang/go.opentelemetry.io/otel/metric
  - pkg:golang/go.opentelemetry.io/otel/metric/x
  - pkg:golang/go.opentelemetry.io/otel/sdk
  - pkg:golang/go.opentelemetry.io/otel/sdk/metric
  - pkg:golang/go.opentelemetry.io/otel/trace
  - pkg:golang/go.opentelemetry.io/contrib/instrumentation/github.com/gin-gonic/gin/otelgin
  - pkg:golang/go.opentelemetry.io/contrib/propagators/b3
  # Two npm packages, both surfaced by the MUI 9 / React 19 toolchain upgrade.
  # Same narrow-fix reasoning as the golang.org/x block above: each carries a
  # permissive license that simply is not in allow-licenses, and adding either
  # license to that list would widen the policy for EVERY ecosystem to buy one
  # package. Listed without versions so the entry survives routine bumps.
  #
  #   caniuse-lite  CC-BY-4.0      Browser-support DATA, not code -- the tables
  #                                browserslist compiles against. CC-BY-4.0
  #                                requires attribution and nothing else; there
  #                                is no copyleft obligation to propagate.
  #   lru-cache     BlueOak-1.0.0  A modern permissive license (Blue Oak Council
  #                                model, OSI-approved), functionally MIT-like
  #                                with an explicit patent grant. Pulled in
  #                                transitively; not a direct dependency.
  - pkg:npm/caniuse-lite
  - pkg:npm/lru-cache

# Deny specific packages
# deny-packages:
#   - pkg:npm/vulnerable-package

# Allow certain vulnerabilities (use sparingly and only temporarily)
# allow-ghsas:
#   - GHSA-xxxx-xxxx-xxxx

# Comment on pull requests with summary
comment-summary-in-pr: always

# Fail on scopes (dependencies vs devDependencies)
fail-on-scopes:
  - runtime
  - development

# Vulnerability database
vulnerability-check: true

# License compliance
license-check: true

# Retry configuration
retry-on-snapshot-warnings: true
retry-on-snapshot-warnings-timeout: 120
