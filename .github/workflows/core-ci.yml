# file: .github/workflows/core-ci.yml
# version: 1.1.0
# guid: 86d3ec85-7629-46f7-9682-c011fb888337
# last-edited: 2026-11-12

# core's merge gate (09 §9.2.1 core-ci row; 12 SC4). `./...` from the root
# never reaches the nested core/ module, so core's own `make -C core ci` runs
# here, plus the root-side checks registered with job core-job in
# ci/gates.txt: the module-skew check, the genproto exclude root probe, and a
# root `go build ./...` whenever core/go.mod or core/go.sum changes (tidy
# coupling, 03 §3.2 item 4: a core-only tidy can leave the root red).
#
# Required check (D15, 14 Q-I), so it also runs on the merge queue's
# merge_group event.

name: Core CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/core-ci.yml'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-ci:
    name: core-ci
    runs-on: ubuntu-latest
    # A cold runner spends ~7 min downloading modules and ~7 min vetting before
    # the tests start, and a green warm run already takes ~25 min, so 30 cancelled
    # about 1 run in 4. A cancelled run never saves the Go cache, so the next run
    # is cold too; the headroom (and the restore-keys below) break that loop.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The literal is a guarded copy: scripts/check_toolchain_versions.py
      # (tier 1) and core/scripts/ci/check_core_toolchain.py compare it with
      # the pin; core/Makefile's GOTOOLCHAIN export selects the toolchain for
      # every make -C core target either way.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          # Manual cache below: setup-go's built-in cache restores on an exact
          # key only, so every go.sum change (core/go.sum changes often) was a
          # full cold start with no fallback.
          cache: false

      # Prefix fallback (restore-keys): a go.sum change restores the previous
      # module and build cache and re-downloads only the difference. Key
      # prefix is core-specific so ci.yml's cache is not shared or evicted.
      - name: Restore Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-core-ci-go-1.27-${{ hashFiles('go.sum', 'core/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-core-ci-go-1.27-

      - name: Pin
        run: echo "GOTOOLCHAIN=$(make -s -C core print-toolchain)" >> "$GITHUB_ENV"

      # core's errcheck and interface-width ratchets (core/scripts/ci) drive
      # golangci-lint. Same pin as ci.yml's ratchet jobs: a version bump can
      # change the finding count on its own and trip a ratchet as if code had
      # changed.
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make -C core ci
        run: make -C core ci

      - name: Module skew (root-side, blocking)
        run: make module-skew

      - name: Did core/go.mod or core/go.sum change?
        id: coremod
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" HEAD -- core/go.mod core/go.sum; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Root go build (tidy coupling)
        if: steps.coremod.outputs.changed == 'true'
        run: go build ./...

      - name: genproto exclude, root mode
        run: make genproto-exclude-root
