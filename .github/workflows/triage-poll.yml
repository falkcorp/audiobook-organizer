# file: .github/workflows/triage-poll.yml
# version: 1.0.3
name: Triage poll

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run | draft-only | full"
        required: false
        default: draft-only
        type: choice
        options:
          - dry-run
          - draft-only
          - full

jobs:
  triage-poll:
    uses: falkcorp/github-common/.github/workflows/reusable-triage-poll.yml@b3f278f1b6fe7b08f428ce6335a1f24a961f1718 # image pin fix + auto-updater fix
    with:
      mode: ${{ inputs.mode || 'draft-only' }}
      triage_model: o3
    secrets: inherit
