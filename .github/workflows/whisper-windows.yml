# file: .github/workflows/whisper-windows.yml
# version: 1.1.0
# guid: c4d81f27-3a95-4b60-8e1d-7f2a95b3c610
# last-edited: 2026-11-17

# TRIAL, NOT REQUIRED. Runs the non-Mac Whisper worker's Python tests on a real
# Windows runner (windows-latest) with a fake backend: the path-pipeline Windows
# rules, the worker's HTTP surface, and the killable decode child, whose
# `spawn`/exit-code behaviour is the part that differs on Windows and that the
# Linux job in ci.yml cannot show. No model is loaded and no GPU is needed.
#
# Same shape as lint-trial.yml, for the same reason: auto-revert.yml fires on the
# CONCLUSION OF THE WHOLE `Continuous Integration` RUN, so a Windows job inside
# ci.yml could revert main on a Windows-only failure. This workflow is named
# differently, so its result never reaches auto-revert.yml. It has NO `push`
# trigger (a trial must not produce a red run on main), no job `needs` it, and it
# must not be added to .github/branch-protection.json or the branch ruleset.
#
# NOT run here: test_whisper_mlx_server.py and test_whisper_mlx_pins.py. They test
# the Mac worker (whisper_mlx_server.py), which is darwin-only by construction: its
# InferenceChild uses POSIX pass_fds, select() and process groups, and a Windows
# machine never runs it. The first run of this job showed 24 and 25 failures there
# ("pass_fds not supported on Windows"), none of them a defect in code that runs on
# Windows. They stay in ci.yml's Linux step.
#
# Beyond the unit tests: test_whisper_supervisor.py runs whisper-supervisor.ps1 (under
# powershell.exe, the real Windows PowerShell 5.1) against a fake uv to prove the
# crash-loop breaker; test_manage_whisper_server.py PARSES the PowerShell that
# manage-whisper-server.py --restart sends over WinRM with powershell.exe; and the
# `uv run` smoke runs the production launch path (uv's own Python 3.14, the spawn
# child, the real build_engine and factory) with a fake model class. The pytest steps
# use the runner's Python 3.12; the smoke is what runs on the Python production runs.
#
# Each test file is its own step with `if: always()`, so one red file does not
# hide the others and the job log reads pass/fail per file.
name: Whisper Windows

on:
  pull_request:
    branches: [main, master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && format('merge-group-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  whisper-windows:
    name: Whisper worker tests (Windows, trial)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # A guard test fails if ffmpeg is missing, so the real-ffmpeg tests cannot
      # skip their way to green.
      WHISPER_TESTS_REQUIRE_FFMPEG: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --quiet fastapi httpx pytest python-multipart

      - name: Install ffmpeg
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          ffmpeg -version | Select-Object -First 1

      - name: test_whisper_path_pipeline
        if: always()
        run: python -m pytest -v -rs scripts/tests/test_whisper_path_pipeline.py

      - name: test_whisper_server_cpu
        if: always()
        run: python -m pytest -v -rs scripts/tests/test_whisper_server_cpu.py

      - name: test_whisper_decode_child
        if: always()
        run: python -m pytest -v -rs scripts/tests/test_whisper_decode_child.py

      - name: test_manage_whisper_server
        if: always()
        run: python -m pytest -v -rs scripts/tests/test_manage_whisper_server.py

      - name: test_whisper_supervisor
        if: always()
        run: python -m pytest -v -rs scripts/tests/test_whisper_supervisor.py

      - name: uv run smoke (production launch path, Python 3.14, fake model)
        if: always()
        run: |
          python -m pip install --quiet uv
          uv run scripts/tests/whisper_uv_smoke.py
