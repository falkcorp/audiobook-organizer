# file: .github/workflows/hard-burndown.yml
# version: 1.2.2
# guid: 5354d3d2-6721-49eb-a4e3-3a8d1befe764
# last-edited: 2026-11-07
name: Hard burndown (failed-batch retry)


# Least privilege for the GITHUB_TOKEN handed to the reusable workflow below.
#
# contents: read is not a guess and not a copy from a sibling workflow: it is
# exactly what reusable-burndown.yml already declares for itself, and a called
# workflow's token is the INTERSECTION of its own permissions with the
# caller's. That workflow's ceiling is therefore already contents:read, so
# naming the same set here cannot reduce what it can do -- it only stops this
# caller from silently handing over the repository default.
#
# Nothing here needs more. Every GitHub write the burndown performs
# (gh pr edit / gh pr comment) authenticates with a GitHub App token minted
# from BURNDOWN_BOT_APP_ID + BURNDOWN_BOT_PRIVATE_KEY, which is independent of
# workflow permissions entirely. The only GITHUB_TOKEN use is as the fallback
# arm of `secrets.JF_CI_GH_PAT || secrets.GITHUB_TOKEN` for a ghcr.io docker
# login; if that fallback is ever actually taken it needs packages:read, but
# it cannot get it today either, because the reusable workflow already caps
# itself at contents:read. Granting packages:read here would not change that
# and would overstate what this caller needs.
permissions:
  contents: read

on:
  schedule:
    - cron: "0 10 * * 0"  # Sundays 10:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run | draft-only | full"
        required: false
        default: draft-only
        type: choice
        options:
          - dry-run
          - draft-only
          - full
      max_tasks:
        description: "Cap dispatched tasks (0 = unlimited)"
        required: false
        default: "0"
        type: string

jobs:
  burndown:
    uses: falkcorp/github-common/.github/workflows/reusable-burndown.yml@016cd02a4afbc2fdd84d2f08e012eff1573d7ea9 # main 2026-11-07; every github-common pin uses this SHA, move them with .github/ghcommon-ref.txt
    with:
      mode: ${{ inputs.mode || 'draft-only' }}
      hub_repo: falkcorp/burndown-tasks
      task_filter: failed-batch
      powerful_only: true
      # powerful_only runs the priciest model tier; cap scheduled runs to avoid
      # an uncapped weekly batch burning OpenAI quota the way nightly-burndown
      # did before max_tasks was added there (see MEMORY: burndown-open-process-issues).
      max_tasks: ${{ github.event_name == 'schedule' && 8 || fromJSON(inputs.max_tasks || '0') }}
    secrets: inherit
