# file: .github/workflows/release-prod.yml
# version: 4.12.4
# guid: f1a2b3c4-d5e6-7f8a-9b0c-1d2e3f4a5b6c
# last-edited: 2026-11-07

name: Production Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: 'auto'
      create-draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      previous-version:
        description: 'Override previous version for changelog (e.g. v0.205.0). Leave empty for auto-detect.'
        required: false
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Create Production Release
    uses: falkcorp/github-common/.github/workflows/reusable-release.yml@016cd02a4afbc2fdd84d2f08e012eff1573d7ea9 # main 2026-11-07; every github-common pin uses this SHA, move them with .github/ghcommon-ref.txt
    with:
      release-type: ${{ github.event.inputs.release-type }}
      prerelease: false
      draft: ${{ github.event.inputs.create-draft == 'true' }}
      stable: true
      go-enabled: true
      # No frontend-enabled, and `frontend` in disabled-languages below: a false
      # (or absent) *-enabled resolves to "auto", so detection would still run
      # reusable-release's build-frontend job, which runs its own `npm ci` in web/
      # (no entry point, so it breaks once web/ needs core/web) and uploads a build
      # whose files create-release strips from the release assets: the binary embeds
      # web/dist, built by pre-build-script. disabled-languages is the only "never".
      docker-enabled: true
      # Not a Python distributable: pyproject.toml holds only Black's config.
      # Docker stays ON here, unlike prerelease.yml.
      disabled-languages: 'python,frontend'
      system-packages: 'libtag1-dev'
      # The one web-dependency entry point (R1-05), then the plain build, which
      # stamps the UI build ID itself. Node is the runner image's: gha-release-go
      # (the step that runs this) installs none, exactly as before.
      pre-build-script: 'sh scripts/ci/build_web.sh deps && cd web && npm run build'
      # Changelog collection pushes as the CI bot app from this repo's main-only
      # `ci-bot` environment, which holds the app key (github-common #391).
      bot-environment: ci-bot
      # Linters stayed off because gha-release-go's lint step did not see
      # GOEXPERIMENT=jsonv2 and go vet failed on json/v2 imports. That reason
      # is gone with Go 1.27 (json/v2 is GA and default); re-enabling is a
      # separate decision because it can only be verified by a real release run.
      go-run-linters: false
      previous-version: ${{ github.event.inputs.previous-version }}
    secrets: inherit
