# file: .github/workflows/release-prod.yml
# version: 4.12.0
# guid: f1a2b3c4-d5e6-7f8a-9b0c-1d2e3f4a5b6c
# last-edited: 2026-10-16

name: Production Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: 'auto'
      create-draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      previous-version:
        description: 'Override previous version for changelog (e.g. v0.205.0). Leave empty for auto-detect.'
        required: false
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Create Production Release
    uses: falkcorp/github-common/.github/workflows/reusable-release.yml@1f0d70e877c89a21a597db5a24e2775d3015ddda # main 2026-10-16: release notes by file, capped under GitHub's body limit (github-common#374); move with .github/ghcommon-ref.txt
    with:
      release-type: ${{ github.event.inputs.release-type }}
      prerelease: false
      draft: ${{ github.event.inputs.create-draft == 'true' }}
      stable: true
      go-enabled: true
      frontend-enabled: true
      docker-enabled: true
      # Not a Python distributable: pyproject.toml holds only Black's config.
      # Docker stays ON here, unlike prerelease.yml.
      disabled-languages: 'python'
      system-packages: 'libtag1-dev'
      pre-build-script: 'cd web && npm ci && npm run build'
      # Linters stayed off because gha-release-go's lint step did not see
      # GOEXPERIMENT=jsonv2 and go vet failed on json/v2 imports. That reason
      # is gone with Go 1.27 (json/v2 is GA and default); re-enabling is a
      # separate decision because it can only be verified by a real release run.
      go-run-linters: false
      previous-version: ${{ github.event.inputs.previous-version }}
    secrets: inherit
