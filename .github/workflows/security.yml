# file: .github/workflows/security.yml
# version: 2.4.1
# guid: 7f2a3c1d-4e5f-6g7h-8i9j-0k1l2m3n4o5p
# last-edited: 2026-07-08
#
# Security scanning: advanced CodeQL, dependency review, language audits, and
# Go/NPM dependency submission for supply chain security. Third-party filesystem
# SARIF scanners are intentionally disabled.

name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * 0' # Weekly Sunday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

jobs:
  advanced-security:
    name: Advanced CodeQL Security
    uses: falkcorp/github-common/.github/workflows/reusable-security.yml@d0c3326b96557c8ea9117c1c196b628e5e028186 # main 2026-07-05 (fixes jdfalk/ghcommon -> falkcorp/github-common stale-ref 400 error)
    with:
      languages: '["go", "javascript", "actions"]'
      skip-codeql: false
      skip-dependency-review: false
      skip-security-audit: false
    secrets: inherit

  dependencies-go:
    name: Dependency Submission (go, setup-go)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Submit Go Dependencies
        uses: actions/go-dependency-submission@f35d5c9af13ce9cc32f7930b171e315e878f6921 # v2.0.3

  dependencies-npm:
    name: Dependency Submission (npm, setup-node)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.x'

      - name: Install NPM dependencies
        working-directory: web
        run: npm ci
