# file: .github/workflows/security.yml
# version: 2.9.4
# guid: 7f2a3c1d-4e5f-6g7h-8i9j-0k1l2m3n4o5p
# last-edited: 2026-11-07
#
# Security scanning: advanced CodeQL, dependency review, language audits, and
# Go/NPM dependency submission for supply chain security. Third-party filesystem
# SARIF scanners are intentionally disabled.

name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * 0' # Weekly Sunday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

jobs:
  advanced-security:
    name: Advanced CodeQL Security
    uses: falkcorp/github-common/.github/workflows/reusable-security.yml@016cd02a4afbc2fdd84d2f08e012eff1573d7ea9 # main 2026-11-07; every github-common pin uses this SHA, move them with .github/ghcommon-ref.txt
    with:
      languages: '["go", "javascript", "actions"]'
      skip-codeql: false
      skip-dependency-review: false
      skip-security-audit: false
    secrets: inherit

  dependencies-go:
    name: Dependency Submission (go, setup-go)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'

      - name: Submit Go Dependencies
        uses: actions/go-dependency-submission@f35d5c9af13ce9cc32f7930b171e315e878f6921 # v2.0.3

  dependencies-npm:
    name: Dependency Submission (npm, setup-node)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Must equal repository-config.yml versions.node so the submitted npm
          # graph resolves under the same engine CI builds with (CI-03);
          # scripts/check_toolchain_versions.py fails the build otherwise.
          node-version: '26'

      # The one web-dependency entry point (R1-05). The script directly, not `make
      # web-deps`: this job has no setup-go, and the Makefile's go-env lines would
      # fetch the pinned Go toolchain just to install npm packages.
      - name: Install NPM dependencies
        run: sh scripts/ci/build_web.sh deps
