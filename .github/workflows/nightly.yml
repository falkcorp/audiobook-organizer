# guid: b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7e
# last-edited: 2026-07-03

# Nightly full CI: property tests, coverage check, E2E, staticcheck.
# Runs the complete reusable-ci.yml suite on a schedule.
# Does NOT run on PRs — use ci.yml (minimal/fast) for PR feedback.
name: Nightly Full CI

on:
  schedule:
    - cron: '0 4 * * *' # 4 AM UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  checks: write
  packages: write
  id-token: write
  attestations: write

jobs:
  full-ci:
    name: Full CI Suite
    uses: falkcorp/github-common/.github/workflows/reusable-ci.yml@b3f278f1b6fe7b08f428ce6335a1f24a961f1718 # main 2026-07-03 (go test -timeout 30m fix)
    with:
      go-version: '1.26'
      go-experiment: 'jsonv2'
      node-version: '22'
      python-version: '3.13'
      rust-version: '1.76'
      coverage-threshold: '30'
      skip-protobuf: false
      system-packages: 'libtag1-dev'
    secrets: inherit
