# last-edited: 2026-10-16

# Nightly full CI: property tests, coverage check, E2E, staticcheck.
# Runs the complete reusable-ci.yml suite on a schedule.
# Does NOT run on PRs — use ci.yml (minimal/fast) for PR feedback.
name: Nightly Full CI

on:
  schedule:
    - cron: '0 4 * * *' # 4 AM UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  checks: write
  packages: write
  id-token: write
  attestations: write

jobs:
  full-ci:
    name: Full CI Suite
    uses: falkcorp/github-common/.github/workflows/reusable-ci.yml@98a9b653a9e5c2fff6b0b4d59880dbb57956467d # github-common#376: go-test-timeout input
    with:
      go-version: '1.27.2'
      node-version: '26'
      python-version: '3.13'
      rust-version: '1.76'
      coverage-threshold: '30'
      skip-protobuf: false
      system-packages: 'libtag1-dev'
      # Without this the run diffs the commit against itself (a schedule has no
      # "before"), finds nothing changed and skips every job -- Go CI skipped on
      # every scheduled run until 2026-10-05. 'true' states the intent even
      # though reusable-ci's 'auto' default would also force on these events.
      force-all: 'true'
      # Same per-test-binary timeout as frontend-ci.yml; see the comment there.
      go-test-timeout: '25m'
    secrets: inherit
