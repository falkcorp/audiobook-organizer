# file: .github/workflows/nightly.yml
# version: 1.6.3
# guid: b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7e
# last-edited: 2026-11-07

# Nightly full CI: property tests, coverage check, E2E, staticcheck.
# Runs the complete reusable-ci.yml suite on a schedule.
# Does NOT run on PRs — use ci.yml (minimal/fast) for PR feedback.
name: Nightly Full CI

on:
  schedule:
    - cron: '0 4 * * *' # 4 AM UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  checks: write
  packages: write
  id-token: write
  attestations: write

jobs:
  full-ci:
    name: Full CI Suite
    uses: falkcorp/github-common/.github/workflows/reusable-ci.yml@016cd02a4afbc2fdd84d2f08e012eff1573d7ea9 # main 2026-11-07; every github-common pin uses this SHA, move them with .github/ghcommon-ref.txt
    with:
      go-version: '1.27.3'
      node-version: '26'
      python-version: '3.13'
      rust-version: '1.76'
      coverage-threshold: '30'
      skip-protobuf: false
      system-packages: 'libtag1-dev'
      # Without this the run diffs the commit against itself (a schedule has no
      # "before"), finds nothing changed and skips every job -- Go CI skipped on
      # every scheduled run until 2026-10-05. 'true' states the intent even
      # though reusable-ci's 'auto' default would also force on these events.
      force-all: 'true'
      # Same per-test-binary timeout as frontend-ci.yml; see the comment there.
      go-test-timeout: '25m'
      # Off, as in frontend-ci.yml: e2e.yml is this repo's E2E run (it starts
      # the server; chromium+webkit nightly). reusable-ci's E2E step starts no
      # server, so all 710 tests failed at once while its frontend-run helper
      # exited 0; once github-common fixed that exit code (and the Playwright
      # browser path), the step spent its whole 30-minute budget on
      # ERR_CONNECTION_REFUSED (run 42233931710, 2026-11-06).
      skip-e2e-tests: true
    secrets: inherit
