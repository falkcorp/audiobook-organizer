# Nightly full CI: property tests, coverage check, E2E, staticcheck.
# Runs the complete reusable-ci.yml suite on a schedule.
# Does NOT run on PRs — use ci.yml (minimal/fast) for PR feedback.
name: Nightly Full CI

on:
  schedule:
    - cron: '0 4 * * *' # 4 AM UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  checks: write
  packages: write
  id-token: write
  attestations: write

jobs:
  full-ci:
    name: Full CI Suite
    uses: falkcorp/github-common/.github/workflows/reusable-ci.yml@d0c3326b96557c8ea9117c1c196b628e5e028186 # main 2026-07-05 (fixes jdfalk/ghcommon -> falkcorp/github-common stale-ref 400 error)
    with:
      go-version: '1.26'
      go-experiment: 'jsonv2'
      node-version: '22'
      python-version: '3.13'
      rust-version: '1.76'
      coverage-threshold: '30'
      skip-protobuf: false
      system-packages: 'libtag1-dev'
    secrets: inherit
