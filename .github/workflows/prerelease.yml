# file: .github/workflows/prerelease.yml
# version: 2.13.0
# guid: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
# last-edited: 2026-08-25

name: Prerelease on Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  GHCOMMON_SCRIPTS_DIR: ${{ github.workspace }}/.github/workflows/scripts

jobs:
  prerelease:
    name: Create Prerelease Build
    uses: falkcorp/github-common/.github/workflows/reusable-release.yml@375d3b9e3aae2db19678edba325c2081c54a2aff # main: pin GORELEASER_CURRENT_TAG so a stable cut builds the stable tag
    with:
      release-type: 'auto'
      prerelease: true
      draft: false
      go-enabled: true
      frontend-enabled: true
      # docker-enabled/python-enabled are "force ON" switches: false means
      # "auto-detect", not "never". That made "never build this" unexpressible,
      # so prereleases built Docker anyway and ran a Python release pipeline
      # off a pyproject.toml that only holds Black's line-length config
      # (no [project] table, no pytest) -- `pytest: command not found`, exit
      # 127, which failed the whole run and skipped Create GitHub Release.
      # disabled-languages is the explicit opt-out (ghcommon #350).
      docker-enabled: false
      disabled-languages: 'python,docker'
      system-packages: 'libtag1-dev'
      pre-build-script: 'cd web && npm ci && npm run build'
      go-experiment: 'jsonv2'
      # gha-release-go's lint step doesn't set GOEXPERIMENT from go-experiment,
      # so go vet fails on jsonv2 imports even though ci.yml already vetted
      # this commit correctly. Skip until fixed upstream in gha-release-go.
      go-run-linters: false
    secrets: inherit

  check-rc-ordinal:
    name: Fail when RC count for this version hits 10
    needs: prerelease
    # Only inspect actual -rc.N tags, and only when the reusable workflow
    # actually created a release this run (e.g. skip on a failed/no-op run
    # where release-tag is only the *intended* tag, never minted).
    if: >-
      needs.prerelease.outputs.release-created == 'true' &&
      contains(needs.prerelease.outputs.release-tag, '-rc.')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Count RCs for this base version and fail at 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prerelease.outputs.release-tag }}
        run: |
          set -euo pipefail
          # Strip the -rc.N suffix to get the base version (e.g. v0.217.9),
          # same convention as .github/workflows/cleanup-rc-releases.yml.
          BASE="${TAG%%-rc.*}"
          echo "Just-minted tag: $TAG  →  base version: $BASE"

          RELEASES_JSON="$(mktemp)"
          gh release list --repo "$REPO" --limit 200 \
            --json tagName,isPrerelease > "$RELEASES_JSON"

          .github/scripts/check-rc-ordinal.sh "$RELEASES_JSON" "$BASE"
