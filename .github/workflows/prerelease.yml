# file: .github/workflows/prerelease.yml
# version: 2.10.2
# guid: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
# last-edited: 2026-07-05

name: Prerelease on Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  GHCOMMON_SCRIPTS_DIR: ${{ github.workspace }}/.github/workflows/scripts

jobs:
  prerelease:
    name: Create Prerelease Build
    uses: falkcorp/github-common/.github/workflows/reusable-release.yml@c4ea62e7ca3794f13bb6e7a2546a04a90fcd3d1f # v2.14.2 (ghcommon ref-pin fix)
    with:
      release-type: 'auto'
      prerelease: true
      draft: false
      go-enabled: true
      frontend-enabled: true
      # NOTE: docker-enabled: false does not actually skip Docker --
      # reusable-release.yml treats false as "auto" (auto-detects the
      # Dockerfile and builds anyway), so prerelease builds have always
      # built Docker images despite this flag. Pre-existing, not fixed here.
      docker-enabled: false
      system-packages: 'libtag1-dev'
      pre-build-script: 'cd web && npm ci && npm run build'
      go-experiment: 'jsonv2'
      # gha-release-go's lint step doesn't set GOEXPERIMENT from go-experiment,
      # so go vet fails on jsonv2 imports even though ci.yml already vetted
      # this commit correctly. Skip until fixed upstream in gha-release-go.
      go-run-linters: false
    secrets: inherit
