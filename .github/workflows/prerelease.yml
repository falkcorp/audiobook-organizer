# file: .github/workflows/prerelease.yml
# version: 3.0.1
# guid: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
# last-edited: 2026-08-30

name: Prerelease on Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  # For the promote step below, which dispatches release-prod.yml once a
  # version accumulates MAX_RCS release candidates.
  actions: write

env:
  GHCOMMON_SCRIPTS_DIR: ${{ github.workspace }}/.github/workflows/scripts

jobs:
  prerelease:
    name: Create Prerelease Build
    uses: falkcorp/github-common/.github/workflows/reusable-release.yml@66924760e0c0eeee3212789dd77f0a337e675f26 # main 2026-08-30: EPIPE-under-pipefail guard fixes (github-common#353, #355) — collection was silently skipping
    with:
      release-type: 'auto'
      prerelease: true
      draft: false
      go-enabled: true
      frontend-enabled: true
      # docker-enabled/python-enabled are "force ON" switches: false means
      # "auto-detect", not "never". That made "never build this" unexpressible,
      # so prereleases built Docker anyway and ran a Python release pipeline
      # off a pyproject.toml that only holds Black's line-length config
      # (no [project] table, no pytest) -- `pytest: command not found`, exit
      # 127, which failed the whole run and skipped Create GitHub Release.
      # disabled-languages is the explicit opt-out (ghcommon #350).
      docker-enabled: false
      disabled-languages: 'python,docker'
      system-packages: 'libtag1-dev'
      pre-build-script: 'cd web && npm ci && npm run build'
      go-experiment: 'jsonv2'
      # gha-release-go's lint step doesn't set GOEXPERIMENT from go-experiment,
      # so go vet fails on jsonv2 imports even though ci.yml already vetted
      # this commit correctly. Skip until fixed upstream in gha-release-go.
      go-run-linters: false
    secrets: inherit

  check-rc-ordinal:
    name: Promote to a minor release when RC count hits 10
    needs: prerelease
    # Only inspect actual -rc.N tags, and only when the reusable workflow
    # actually created a release this run (e.g. skip on a failed/no-op run
    # where release-tag is only the *intended* tag, never minted).
    if: >-
      needs.prerelease.outputs.release-created == 'true' &&
      contains(needs.prerelease.outputs.release-tag, '-rc.')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          submodules: recursive

      - name: Count RCs for this base version
        id: rc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prerelease.outputs.release-tag }}
        run: |
          set -euo pipefail
          # Strip the -rc.N suffix to get the base version (e.g. v0.217.9),
          # same convention as .github/workflows/cleanup-rc-releases.yml.
          BASE="${TAG%%-rc.*}"
          echo "Just-minted tag: $TAG  →  base version: $BASE"

          RELEASES_JSON="$(mktemp)"
          gh release list --repo "$REPO" --limit 200 \
            --json tagName,isPrerelease > "$RELEASES_JSON"

          .github/scripts/check-rc-ordinal.sh "$RELEASES_JSON" "$BASE"

      # Owner directive 2026-08-29: "We don't want it to fail, just have it push
      # a new minor release." Failing was never a remedy -- v0.219.3 reached
      # rc.33 with this job red on every merge and nothing stopping the pile-up,
      # because the guard runs AFTER the RC tag has already been minted.
      # Dispatching the minor cut is what actually resets the ordinal.
      #
      # This MUST use JF_CI_GH_PAT. A workflow_dispatch authenticated with the
      # default GITHUB_TOKEN is silently ignored by GitHub -- a GITHUB_TOKEN run
      # cannot trigger another workflow run. Falling back to GITHUB_TOKEN would
      # produce a green step that promotes nothing, so a missing PAT is a hard
      # failure here rather than a silent no-op.
      - name: Promote to the next minor release
        if: steps.rc.outputs.at_threshold == 'true'
        env:
          GH_TOKEN: ${{ secrets.JF_CI_GH_PAT }}
          REPO: ${{ github.repository }}
          RC_COUNT: ${{ steps.rc.outputs.rc_count }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::JF_CI_GH_PAT is unavailable, so the minor-release dispatch would be silently dropped by GitHub. Cut the minor release manually via the Production Release workflow."
            exit 1
          fi

          # Do not stack dispatches. Between this run and the release landing,
          # every further merge to main mints another RC and re-enters this job;
          # a blind dispatch would queue a duplicate minor cut for each one.
          RUNNING="$(gh run list --repo "$REPO" \
            --workflow release-prod.yml \
            --json status \
            --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [[ "$RUNNING" -gt 0 ]]; then
            echo "::notice::A Production Release run is already queued or in progress (${RUNNING}); not dispatching another."
            exit 0
          fi

          echo "RC count is ${RC_COUNT}; dispatching a minor Production Release."
          gh workflow run release-prod.yml --repo "$REPO" \
            --ref main \
            -f release-type=minor \
            -f create-draft=false
          echo "::notice::Dispatched a minor Production Release to reset the RC ordinal."
