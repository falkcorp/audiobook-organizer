# file: .github/workflows/auto-revert.yml
# version: 1.5.1
# guid: 2f7c4e19-6b83-4a05-9d21-8e5b0a3f7c64
# last-edited: 2026-11-06

# Restore main to its last known-good commit when the CI gate goes red.
#
# This repository does not gate merges on CI. Anything can land; the gate runs
# afterwards; if it fails, this workflow puts main back and files a bug naming the
# culprits. That trade is deliberate — waiting on a pre-merge gate wastes a rebase
# and a full CI cycle every time an unrelated commit lands first, and a PR that was
# red at review time is often green by the time it merges.
#
# The decision of *what* to revert lives in scripts/auto_revert.py, which is unit
# tested and mutation tested. This file is only plumbing: gather evidence, call the
# script, act on its verdict.
#
# The revert is pushed by the CI bot GitHub App. The main-branch ruleset routes
# every change through the merge queue and lists only that app as a bypass actor,
# so a direct push of the revert from any other identity is rejected (GH013).
name: Auto-Revert Red Main

on:
  workflow_run:
    workflows: ['Continuous Integration']
    types: [completed]
  workflow_dispatch:
    inputs:
      failing_sha:
        description: 'Commit to treat as the failure (defaults to origin/main tip)'
        required: false
        type: string
      dry_run:
        description: 'Decide and print, but do not push or file anything'
        required: false
        default: true
        type: boolean
      max_span:
        description: 'Refuse to revert more than this many commits'
        required: false
        default: '3'
        type: string

# Never let two reverts race. Queue rather than cancel: a cancelled revert leaves
# main red with nothing watching it.
concurrency:
  group: auto-revert-main
  cancel-in-progress: false

# contents: read, not write. The revert is pushed with the CI bot app token
# minted below; this token only reads, files the bug (issues) and re-runs the
# gate once (actions).
permissions:
  contents: read
  issues: write
  actions: write

jobs:
  revert:
    name: Restore last green
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the CI bot app key as an environment secret (limited to the default
    # branch), so a workflow on any other branch cannot mint the app token, which
    # bypasses the main-branch ruleset. Declared on the job because environment
    # secrets reach only jobs that name the environment.
    environment: ci-bot
    # Only pushes to main. PR runs and other branches are none of this workflow's
    # business, and a red PR is supposed to merge anyway.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    steps:
      - name: Classify the gate result
        id: triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "act=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — proceeding to triage."
            exit 0
          fi

          case "$CONCLUSION" in
            failure|timed_out|action_required) ;;
            *)
              echo "act=false" >> "$GITHUB_OUTPUT"
              echo "Gate concluded '$CONCLUSION' — nothing to do."
              exit 0
              ;;
          esac

          # Flake defense. Re-running bumps run_attempt on the same run and fires
          # this workflow again on completion, so no state has to be carried.
          # A revert is expensive and public; one free re-run is not.
          if [ "$ATTEMPT" = "1" ]; then
            echo "act=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Gate red on attempt 1 — re-running failed jobs before blaming anyone."
            gh run rerun --failed "$RUN_ID" --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          echo "act=true" >> "$GITHUB_OUTPUT"
          echo "::warning::Gate red on attempt $ATTEMPT — this is not a flake."

      # Minted before checkout because checkout takes the token. It also runs on
      # a dry run, so a dispatch with dry_run=true proves the credentials, the
      # mint and the checkout; only the push itself waits for a real red main.
      - name: Require CI bot app credentials
        if: steps.triage.outputs.act == 'true'
        env:
          CLIENT_ID: ${{ vars.CI_BOT_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.CI_BOT_APP_PRIVATE_KEY != '' }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Mistake guard, not the security boundary (the environment is): fail
          # clearly when run from a branch other than the default.
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::This workflow mints the CI bot app token and must run from ${DEFAULT_BRANCH}, not ${REF_NAME}."
            exit 1
          fi
          # No fallback to GITHUB_TOKEN or a personal token: neither can push to
          # main, and a revert that fails late leaves main red with nothing
          # watching it.
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::Variable CI_BOT_APP_CLIENT_ID and the ci-bot environment secret CI_BOT_APP_PRIVATE_KEY must both be visible to this job; one or both are empty (is the ci-bot environment created, and does it allow this branch?). main cannot be auto-reverted without them."
            exit 1
          fi

      - name: Mint CI bot app token
        if: steps.triage.outputs.act == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          # A revert can undo a change to .github/workflows/, and a push that
          # touches workflow files is refused without this permission.
          permission-workflows: write

      - name: Checkout full history
        if: steps.triage.outputs.act == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          submodules: recursive
          # The app token on purpose: checkout persists it as http.extraheader,
          # so the `git push origin main` below authenticates as the app. Passing
          # nothing would persist GITHUB_TOKEN instead and push as
          # github-actions[bot], which cannot bypass the merge queue.
          token: ${{ steps.app-token.outputs.token }}

      - name: Gather commits and gate verdicts
        if: steps.triage.outputs.act == 'true'
        id: evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SHA: ${{ inputs.failing_sha }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          # Empty on workflow_dispatch — there is no gate run to read jobs from.
          GATE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet

          FAILING="${INPUT_SHA:-$EVENT_SHA}"
          [ -n "$FAILING" ] || FAILING=$(git rev-parse origin/main)
          echo "failing=$FAILING" >> "$GITHUB_OUTPUT"
          echo "Treating $FAILING as the failing commit."

          # Newest first, starting at the failure. 12 is comfortably wider than
          # any span we would act on, so the script can still see a green anchor
          # when it decides the span is too wide to touch.
          # The format string comes from the script so the parser and the commit
          # message it later writes cannot drift apart.
          FORMAT=$(python3 -c 'import sys; sys.path.insert(0, ".github/workflows/scripts"); import auto_revert; print(auto_revert.LOG_FORMAT, end="")')
          git log --format="$FORMAT" -n 12 "$FAILING" > /tmp/commits.raw

          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, ".github/workflows/scripts")
          from auto_revert import parse_log
          repo = os.environ["GITHUB_REPOSITORY"]
          out = []
          for commit in parse_log(open("/tmp/commits.raw").read()):
              sha, subject, trailers = commit.sha, commit.subject, commit.trailers
              pr = None
              try:
                  res = subprocess.run(
                      ["gh", "api", f"repos/{repo}/commits/{sha}/pulls",
                       "--jq", ".[0].number // empty"],
                      capture_output=True, text=True, timeout=30)
                  # `gh api` prints the HTTP error body on stdout, so stdout is
                  # only trustworthy when the call succeeded. int() would reject
                  # a JSON error object anyway, but checking the status makes
                  # the intent explicit rather than accidental.
                  text = res.stdout.strip() if res.returncode == 0 else ""
                  pr = int(text) if text.isdigit() else None
              except Exception:
                  pr = None
              out.append({"sha": sha, "subject": subject, "trailers": trailers, "pr": pr})
          json.dump(out, open("/tmp/commits.json", "w"), indent=2)
          print(f"collected {len(out)} commits")
          PY

          # Every gate run on main, so the script can map SHA -> conclusion. This
          # is the only workflow that counts: codeql/e2e/binary-smoke are either
          # path-filtered or flaky, and folding them in would invent failures.
          gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml --branch main --limit 60 \
            --json headSha,conclusion,event \
            --jq '[.[] | select(.event == "push")]' > /tmp/runs.json

          # Failing job names are decoration on the bug report, so a lookup
          # failure must degrade to "no names", never to garbage. `gh api`
          # prints the HTTP error body on STDOUT, so a naive redirect captures
          # it and `|| true` hides that it happened: dry run 32443758633 filed
          # a body whose "Failing jobs" list was the four lines of a 404 error
          # object. Only accept the output when the call actually succeeded.
          : > /tmp/failed-jobs.txt
          if [ -z "$GATE_RUN_ID" ]; then
            echo "::notice::no gate run id (manual dispatch) — skipping job lookup"
          elif gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GATE_RUN_ID/jobs" \
                 --paginate \
                 --jq '.jobs[] | select(.conclusion == "failure") | .name' \
                 > /tmp/jobs.raw 2>/dev/null; then
            mv /tmp/jobs.raw /tmp/failed-jobs.txt
          else
            echo "::warning::could not read failing jobs for run $GATE_RUN_ID"
          fi
          echo "failed jobs:"; cat /tmp/failed-jobs.txt

      - name: Decide what to revert
        if: steps.triage.outputs.act == 'true'
        id: decide
        # max_span is the one value here a dispatcher controls, so it goes through
        # env and is validated as digits before reaching a command line.
        env:
          MAX_SPAN: ${{ inputs.max_span }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          case "${MAX_SPAN:-3}" in
            ''|*[!0-9]*) echo "::error::max_span must be digits, got '$MAX_SPAN'"; exit 1 ;;
          esac
          python3 .github/workflows/scripts/auto_revert.py decide \
            --commits /tmp/commits.json \
            --runs /tmp/runs.json \
            --max-span "${MAX_SPAN:-3}" \
            --run-url "$RUN_URL" \
            --failed-jobs "$(cat /tmp/failed-jobs.txt 2>/dev/null || true)"

      - name: Revert to the last green commit
        if: >-
          steps.triage.outputs.act == 'true' &&
          steps.decide.outputs.action == 'revert' &&
          inputs.dry_run != true
        id: apply
        env:
          ANCHOR: ${{ steps.decide.outputs.anchor }}
          FAILING: ${{ steps.decide.outputs.failing }}
          SPAN: ${{ steps.decide.outputs.span }}
          COUNT: ${{ steps.decide.outputs.span_count }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          # Only for the identity lookup below; the push uses the credential
          # checkout persisted.
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # Someone may have landed a commit while we were deciding. Reverting a
          # stale span would take out an innocent change, so re-check and bail.
          git fetch origin main --quiet
          TIP=$(git rev-parse origin/main)
          if [ "$TIP" != "$FAILING" ]; then
            echo "::warning::main moved from $FAILING to $TIP while triaging — not reverting a stale span."
            echo "moved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bash scripts/ci/set_bot_git_identity.sh "$APP_SLUG"
          git checkout -q main
          git reset -q --hard "$FAILING"

          if ! git revert --no-commit "$ANCHOR..$FAILING"; then
            git revert --abort || true
            echo "::error::Revert of $ANCHOR..$FAILING does not apply cleanly."
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Generated by the script, not inline here: the Auto-Revert-Of trailer
          # this writes is the only thing stopping a revert loop, and a message
          # built in YAML is a contract no test can reach.
          python3 .github/workflows/scripts/auto_revert.py commit-message \
            --anchor "$ANCHOR" \
            --failing "$FAILING" \
            --span "$SPAN" \
            --run-url "$RUN_URL" > /tmp/msg.txt

          git commit -q --file /tmp/msg.txt
          REVERT_SHA=$(git rev-parse HEAD)
          echo "revert_sha=$REVERT_SHA" >> "$GITHUB_OUTPUT"

          # Pushed as the CI bot app (the credential checkout persisted), which
          # is the ruleset's bypass actor. An app-token push triggers workflows,
          # which is wanted here: an unverified revert is exactly what we must
          # not create. So the commit message must NEVER carry [skip ci].
          git push origin main
          echo "::notice::Reverted $COUNT commit(s); main is now $REVERT_SHA."

      - name: File the bug
        if: >-
          steps.triage.outputs.act == 'true' &&
          steps.decide.outputs.action != 'none' &&
          inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.decide.outputs.issue_body }}
          EXTRA_LABEL: ${{ steps.decide.outputs.label }}
          REVERT_SHA: ${{ steps.apply.outputs.revert_sha }}
          MOVED: ${{ steps.apply.outputs.moved }}
          CONFLICT: ${{ steps.apply.outputs.conflict }}
          FAILING: ${{ steps.decide.outputs.failing }}
        run: |
          set -euo pipefail

          # The backticks below are literal Markdown, not command substitution,
          # which is exactly why these format strings are single-quoted.
          # shellcheck disable=SC2016
          {
            printf '%s\n' "$BODY"
            [ -n "$REVERT_SHA" ] && printf '\n**Revert commit:** `%s`\n' "${REVERT_SHA:0:8}"
            [ "$MOVED" = "true" ] && printf '\n> main moved while triaging, so nothing was reverted.\n'
            [ "$CONFLICT" = "true" ] && printf '\n> The revert did not apply cleanly and needs hands.\n'
          } > /tmp/issue.md || true

          # Build argv as an array. `${VAR:+--label "$VAR"}` looks like it quotes
          # the label but the quotes are consumed by the expansion, so a label
          # with a space would split into two arguments.
          args=(--repo "$GITHUB_REPOSITORY"
                --title "CI red on main at ${FAILING:0:8}"
                --body-file /tmp/issue.md
                --label bug --label ci --label automation)

          if [ -n "$EXTRA_LABEL" ]; then
            gh label create "$EXTRA_LABEL" --color D93F0B \
              --description "CI went red on main and could not be auto-reverted" \
              --force --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            args+=(--label "$EXTRA_LABEL")
          fi

          # Dedupe: workflow_run can fire more than once for one commit, and a
          # revert that does not fix the build re-triggers this job. If an OPEN
          # issue already covers this SHA, add this run's details to it as a
          # comment instead of filing a second issue. --state open is
          # load-bearing: a CLOSED incident with the same SHA prefix must not
          # suppress a genuinely new one. Same search as auto-revert-backstop.yml.
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label ci --label automation --state open \
            --search "CI red on main at ${FAILING:0:8} in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "::notice::open issue #${EXISTING} already covers ${FAILING:0:8}; commenting instead of filing a duplicate."
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue.md
            exit 0
          fi

          gh issue create "${args[@]}"

      - name: Summary
        if: always() && steps.triage.outputs.act == 'true'
        # Values go through env, never inline interpolation: `reason` is built
        # from commit data and must not be spliced into the shell.
        env:
          ACTION: ${{ steps.decide.outputs.action }}
          REASON: ${{ steps.decide.outputs.reason }}
          FAILING: ${{ steps.decide.outputs.failing }}
          ANCHOR: ${{ steps.decide.outputs.anchor }}
          COUNT: ${{ steps.decide.outputs.span_count }}
          DRY: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Auto-revert"
            echo
            echo "- action: \`${ACTION:-n/a}\`"
            echo "- reason: ${REASON:-n/a}"
            echo "- failing: \`${FAILING:-n/a}\`"
            echo "- anchor: \`${ANCHOR:-n/a}\`"
            echo "- span: \`${COUNT:-0}\` commit(s)"
            echo "- dry run: \`${DRY:-false}\`"
          } >> "$GITHUB_STEP_SUMMARY"
