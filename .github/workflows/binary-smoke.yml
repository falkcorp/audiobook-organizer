# last-edited: 2026-07-17

name: Binary Smoke

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Build And Run Binary Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libtag1-dev

      - name: Build CLI Binary
        run: go build -o audiobook-organizer .
        env:
          GOEXPERIMENT: jsonv2

      - name: Verify CLI Help Output
        run: |
          ./audiobook-organizer --help >/dev/null
          ./audiobook-organizer serve --help >/dev/null
          ./audiobook-organizer inspect-metadata --help >/dev/null

      - name: Build Frontend
        run: cd web && npm ci && npm run build

      - name: Build Embedded Binary (embed_frontend)
        run: go build -tags embed_frontend -o audiobook-organizer-embedded .
        env:
          GOEXPERIMENT: jsonv2

      - name: Start Embedded Server And Probe Health + SPA
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          mkdir -p "${tmpdir}/library" "${tmpdir}/playlists"
          ./audiobook-organizer-embedded \
            --dir "${tmpdir}/library" \
            --db "${tmpdir}/audiobooks.pebble" \
            --playlists "${tmpdir}/playlists" \
            serve \
            --host 127.0.0.1 \
            --port 18080 \
            --tls-cert '' \
            --tls-key '' \
            >"${tmpdir}/server.log" 2>&1 &
          pid=$!
          trap 'kill "${pid}" >/dev/null 2>&1 || true; echo "--- server log ---"; cat "${tmpdir}/server.log" || true' EXIT

          healthy=false
          for i in $(seq 1 20); do
            if ! kill -0 "${pid}" 2>/dev/null; then
              echo "Server process died (attempt ${i})"
              cat "${tmpdir}/server.log"
              exit 1
            fi
            if curl -fsS "http://127.0.0.1:18080/api/v1/health" >/dev/null 2>&1; then
              healthy=true
              break
            fi
            sleep 1
          done

          if [ "${healthy}" != "true" ]; then
            echo "Server never became healthy after 20 seconds"
            cat "${tmpdir}/server.log"
            exit 1
          fi

          echo "Health check passed"

          # Verify the embedded SPA is actually served at / (catches builds
          # where web/dist was stale or missing at embed time).
          if ! curl -fsS "http://127.0.0.1:18080/" | grep -qi "<html"; then
            echo "Embedded SPA probe failed: / did not serve HTML"
            cat "${tmpdir}/server.log"
            exit 1
          fi
          echo "Embedded SPA probe passed"

          kill "${pid}" >/dev/null 2>&1 || true
          wait "${pid}" >/dev/null 2>&1 || true
