# file: .github/workflows/e2e.yml
# version: 1.3.0
# guid: 6a2f47c9-1e83-4d05-b7f6-92c4a0d81b3e
# last-edited: 2026-08-10

# Runs the Playwright end-to-end suite.
#
# Until now NOTHING ran this suite automatically. That is how six spec files,
# silently broken by a bad fixture parameter in April 2026, stayed dead until
# August — four months during which the suite existed, was maintained, and
# caught nothing.
#
# Split by cost. A full run builds the frontend AND the Go binary and then
# drives two browser engines; that is far too slow to sit in the fast PR gate
# next to Minimal CI. So:
#   - pull_request -> chromium only, which catches essentially all content
#     drift and logic regressions
#   - nightly      -> chromium + webkit, catching the engine-specific failures
#     a single-engine PR run would miss
#
# Note on the stale-server trap: playwright.config.ts sets
# `reuseExistingServer: !process.env.CI`. GitHub Actions sets CI=true, so CI
# always builds its own server and can never attach to a stale one. The hazard
# is purely local runs — see the todo entry; a local run silently reused a
# server that was hours old on 2026-08-08 and produced a fully green suite
# against a bundle predating the fixes under test.

name: E2E

# The `pull_request` trigger is live as of 2026-08-09, and on that path the job
# BLOCKS. It was withheld while the suite was ~50% red, because a
# permanently-failing check on every PR is worse than no check: people learn to
# ignore it, which is the same failure that let six specs rot for four months,
# only louder.
#
# Measured on the real runner before enabling it:
#   chromium (the PR path)   272 passed /  0 failed /  8 skipped   <- blocking
#   chromium + webkit        543 passed /  1 failed / 16 skipped   <- not blocking
#
# Both configurations are now green on the real runner, so the job blocks on
# every trigger. The webkit tail was closed by giving webkit its own 60s
# per-test budget (chromium keeps 30s): webkit had a POPULATION of tests
# sitting close to the shared limit, and roughly one lost per run — two
# consecutive runs scored an identical 543/1/16 while failing DIFFERENT tests
# in different spec files.
#
on:
  pull_request:
    branches: [main, master]
    paths: ['web/**', '**.go', 'go.mod', 'go.sum', '.github/workflows/e2e.yml']
  schedule:
    - cron: '17 5 * * *' # 05:17 UTC nightly, off the :00 stampede
  workflow_dispatch:
    inputs:
      projects:
        description: 'Playwright projects to run'
        required: false
        type: choice
        options:
          - chromium
          - chromium+webkit
        default: chromium

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ github.event_name == 'pull_request' && 'chromium' || 'chromium + webkit' }})
    runs-on: ubuntu-latest
    # NON-BLOCKING, deliberately and temporarily. Kept even though the job
    # is nightly-only, so a red nightly does not read as "the pipeline is
    # broken" while the backlog is known and tracked.
    #
    # The first clean-environment run of this suite scored 146 failed / 138
    # passed of 288 chromium tests. The suite is roughly half red, and that was
    # not known when this job was written: the local run that appeared to show
    # it green (130 passed / 0 failed) had silently reused a server that was
    # hours stale, AND collected far fewer tests than CI does. Both facts were
    # wrong in the same direction.
    #
    # Making this required right now would block every PR touching web/** or Go
    # on a backlog nobody has triaged. So it reports and does not block. The
    # value is still real — the failures are now VISIBLE on every PR instead of
    # invisible for four months, which is the problem this job exists to solve.
    #
    # BLOCKING, on every trigger.
    #
    # Measured on the real runner before this was made unconditional:
    #   chromium (PR path)   272 passed / 0 failed /  8 skipped
    #   chromium + webkit    544 passed / 0 failed / 16 skipped
    #
    # This was `true` while the suite was ~50% red, then
    # `${{ github.event_name != 'pull_request' }}` while chromium was green and
    # webkit still had one failure per run. Both configurations are now green,
    # so the exception is gone.
    #
    # Do not set this back to `true` to quiet a red run, and do not delete this
    # job. A red result here means the browser suite is broken; that is the
    # signal, not the problem. If the suite becomes unreliable rather than
    # wrong, fix the reliability — the 2026-08-09 causes were worker
    # contention, per-engine timeout budgets, and goldens stored as Git LFS
    # pointers, none of which were product defects.
    continue-on-error: false
    # A full two-engine run measured ~20 minutes locally; allow generous
    # headroom for a cold CI runner that must also build the Go binary.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libtag1-dev

      - name: Install npm dependencies
        run: cd web && npm ci

      # --with-deps is load-bearing, not boilerplate. Browser binaries are
      # tied to the installed Playwright version, and a mismatch fails at
      # LAUNCH ("Executable doesn't exist at .../webkit-NNNN") rather than as
      # a test failure — which reads like a broken suite when it is a broken
      # environment. Installing them explicitly here keeps that distinction
      # obvious in the logs.
      # Pre-build so playwright.config.ts's webServer only has to START the
      # binary, not compile it. Without this the first CI run died on
      # "Timed out waiting 120000ms from config.webServer" — the webServer
      # command builds the frontend AND the Go binary, which does not fit in
      # the old window on a cold runner with an empty Go build cache. The
      # config timeout was raised too, but warming the caches here is what
      # keeps the wait short rather than merely survivable.
      - name: Pre-build frontend and Go binary
        env:
          GOEXPERIMENT: jsonv2
        run: |
          cd web && npm run build
          cd .. && go build -tags embed_frontend -o audiobook-organizer .

      - name: Install Playwright browsers
        env:
          # Passed via env rather than interpolated into the script body.
          # Neither value is attacker-controlled (event_name is a fixed enum,
          # projects is a constrained choice input), but interpolating GitHub
          # context straight into a shell command is the habit that produces
          # workflow injections, so it is avoided uniformly.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROJECTS: ${{ inputs.projects }}
        run: |
          cd web
          if [ "$EVENT_NAME" = "pull_request" ] || \
             { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_PROJECTS" != "chromium+webkit" ]; }; then
            npx playwright install --with-deps chromium
          else
            npx playwright install --with-deps chromium webkit
          fi

      # Runs BEFORE the suite, as its own step, so the failure reads
      # "spec discovery" rather than being buried in Playwright output.
      #
      # A green suite is not a coverage claim unless something asserts what
      # should have run. Six spec files were disabled by accident and went
      # unnoticed for four months precisely because nothing here was red: a
      # file that stops being discovered shrinks the suite, it does not fail
      # it, and this job gates on an exit code that stays 0.
      - name: Check every spec file is still discovered
        run: cd web && node tests/e2e/check-spec-discovery.mjs

      - name: Run E2E suite
        env:
          GOEXPERIMENT: jsonv2
          CI: 'true'
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROJECTS: ${{ inputs.projects }}
        run: |
          cd web
          # Array, not a string. A plain string would have to be left unquoted
          # to split into separate arguments, which is exactly what shellcheck
          # SC2086 flags — and quoting it would pass "--project=chromium
          # --project=webkit" as ONE argument, which Playwright rejects. An
          # array expands correctly AND lints clean.
          case "$EVENT_NAME" in
            pull_request) PROJECTS=(--project=chromium) ;;
            workflow_dispatch)
              if [ "$INPUT_PROJECTS" = "chromium+webkit" ]; then
                PROJECTS=(--project=chromium --project=webkit)
              else
                PROJECTS=(--project=chromium)
              fi
              ;;
            *) PROJECTS=(--project=chromium --project=webkit) ;;
          esac
          echo "Running with: ${PROJECTS[*]}"
          npx playwright test -c tests/e2e/playwright.config.ts "${PROJECTS[@]}" --reporter=line
