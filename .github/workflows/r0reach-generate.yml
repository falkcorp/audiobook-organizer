# file: .github/workflows/r0reach-generate.yml
# version: 0.1.0
# guid: 61f3a9d2-5e84-4c07-b2a1-9d4e7c0f3b58
# last-edited: 2026-11-13
#
# TEMPORARY (F4-07): records the R0 linux/amd64 release binary's reach (allow or
# deny per route and principal) on a GitHub-hosted runner and uploads it as an
# artifact. The runner probes a throwaway copy of the overlay corpus, so the
# destructive routes the probe reaches are harmless there. The builder commits the
# artifact and deletes this workflow in the same PR, before it is ready for review.

name: R0 reach record (temporary)

on:
  push:
    branches: [agent/platform-core-f4-07]
    paths: [.github/workflows/r0reach-generate.yml, scripts/r2corpus/**]

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Runtime libraries for the R0 binary
        run: sudo apt-get update -q && sudo apt-get install -y -q libtag1v5 || sudo apt-get install -y -q libtag2
      - name: Record R0's reach
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/r2corpus/record_r0_reach.py --regenerate
      - name: Show the result
        run: |
          du -sh internal/books/rbacreach
          ls -l internal/books/rbacreach
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: r0reach
          path: internal/books/rbacreach
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: r0reach-serve-log
          path: /tmp/r2corpus-logs
          include-hidden-files: true
          if-no-files-found: ignore
