# file: .github/workflows/memory-leak-scan.yml
# version: 2.5.2
# guid: 9f3a1b2c-4d5e-6f7a-8b9c-0d1e2f3a4b5c
# last-edited: 2026-11-07
# Classification (09 §9.4 R1): this scan reads web/src only, so it is the root
# npm workspace's gate. core/web does not exist yet (R1-30 creates it) and
# scripts/check-memory-leaks.py takes no second source tree, so there is no core
# leg here; the one that creates core/web adds it with the path trigger.
name: Memory Leak Detection

on:
  schedule:
    - cron: "0 4 * * 0" # Sunday 04:00 UTC (clear of nightly burndown slots)
  pull_request:
    paths:
      - "web/src/**"
      - "scripts/check-memory-leaks.py"
      - ".github/workflows/memory-leak-scan.yml"
  push:
    branches:
      - main
    paths:
      - "web/src/**"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Scan for memory leaks
    outputs:
      has_leaks: ${{ steps.scan.outputs.has_leaks }}
      leak_count: ${{ steps.scan.outputs.leak_count }}
      scan_failed: ${{ steps.scan.outputs.scan_failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Run memory leak detection
        id: scan
        # On scheduled runs: capture findings for the report job; don't fail the job.
        # On PR/push: fail normally so the check gate blocks the merge.
        continue-on-error: ${{ github.event_name == 'schedule' }}
        run: |
          set +e
          python3 scripts/check-memory-leaks.py 2>&1 | tee /tmp/leak-output.txt
          exit_code=${PIPESTATUS[0]}
          set -e

          # `grep -c` PRINTS "0" and EXITS 1 when nothing matches, so the old
          # `$(grep -c ... || echo "0")` captured grep's "0" AND the fallback's
          # "0" and wrote a two-line value:
          #     leak_count=0
          #     0
          # -- a malformed second line in $GITHUB_OUTPUT. Piping through head
          # takes grep's own count and makes the pipeline's status head's.
          count=$(grep -c "Line " /tmp/leak-output.txt 2>/dev/null | head -n1)
          count=${count:-0}

          if [ "$exit_code" -eq 0 ]; then
            {
              echo "has_leaks=false"
              echo "leak_count=0"
              echo "scan_failed=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A non-zero exit is NOT the same as "leaks found". check-memory-leaks.py
          # returns 1 for findings, but an uncaught Python exception also exits 1,
          # so the exit code alone cannot tell a crash from a result. Findings
          # always print "Line N:" entries; a crash prints none. Without this the
          # report job below opened and AUTO-MERGED a TODO.md entry claiming
          # leaks that were never detected -- a broken scanner filed bugs against
          # the codebase.
          if [ "$count" -eq 0 ]; then
            echo "::error::check-memory-leaks.py exited ${exit_code} without reporting a single finding. Treating this as a scanner failure, not as leaks; no TODO entry will be filed."
            echo "----- scanner output -----"
            tail -n 40 /tmp/leak-output.txt || true
            {
              echo "has_leaks=false"
              echo "leak_count=0"
              echo "scan_failed=true"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          {
            echo "has_leaks=true"
            echo "leak_count=$count"
            echo "scan_failed=false"
          } >> "$GITHUB_OUTPUT"

          exit "$exit_code"

  # ---------------------------------------------------------------------------
  # Report — scheduled runs only. When leaks are found, inserts a TODO.md
  # entry on a throwaway branch, opens a PR as the CI bot GitHub App and queues
  # it for auto-merge. The PR must run the repository's required checks to
  # enter the merge queue: PRs opened with GITHUB_TOKEN start no workflows, and
  # a [skip ci] marker on the head commit would suppress them too, so neither
  # is used here.
  # ---------------------------------------------------------------------------
  report:
    name: Report findings to TODO.md
    needs: scan
    if: >-
      always() &&
      needs.scan.outputs.has_leaks == 'true' &&
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # Holds the CI bot app key as an environment secret (limited to the default
    # branch), so a workflow on any other branch cannot mint the app token, which
    # bypasses the main-branch ruleset. Declared on the job because environment
    # secrets reach only jobs that name the environment.
    environment: ci-bot
    # contents: read (the workflow default). The branch push and the PR are made
    # with the CI bot app token minted below.
    steps:
      - name: Require CI bot app credentials
        env:
          CLIENT_ID: ${{ vars.CI_BOT_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.CI_BOT_APP_PRIVATE_KEY != '' }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Mistake guard, not the security boundary (the environment is): fail
          # clearly when run from a branch other than the default.
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::This workflow mints the CI bot app token and must run from ${DEFAULT_BRANCH}, not ${REF_NAME}."
            exit 1
          fi
          # No fallback to GITHUB_TOKEN: its PR would run no CI and could never
          # pass the merge queue.
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::Variable CI_BOT_APP_CLIENT_ID and the ci-bot environment secret CI_BOT_APP_PRIVATE_KEY must both be visible to this job; one or both are empty (is the ci-bot environment created, and does it allow this branch?)."
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1
          # Do not persist GITHUB_TOKEN: git would send it as http.extraheader in
          # preference to the app token in the push URL below, and the branch
          # would be pushed as github-actions[bot].
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Mint CI bot app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Insert findings into TODO.md and open PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LEAK_COUNT: ${{ needs.scan.outputs.leak_count }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="auto/memory-leak-findings-${DATE}"

          bash scripts/ci/set_bot_git_identity.sh "$APP_SLUG"
          git checkout -b "$BRANCH"

          # Run the scanner to insert findings into TODO.md under
          # "## ⚠️ Automated Findings" (section created if absent).
          python3 scripts/check-memory-leaks.py \
            --todo-insert "$DATE" \
            --run-url "$RUN_URL"

          if git diff --quiet TODO.md; then
            echo "TODO.md unchanged — skipping PR."
            exit 0
          fi

          git add TODO.md

          # Write commit body to a file so multi-line text never bleeds to
          # column 0 inside the YAML block scalar.
          printf '%s\n' \
            "chore(todo): add memory leak findings ${DATE}" \
            "" \
            "${LEAK_COUNT} potential memory leak(s) detected in scheduled static scan." \
            "Run: ${RUN_URL}" \
            "" \
            "These [memory-leak] TODO items are intentionally NOT [failed-batch-hard] so" \
            "the burndown decompose job will not auto-dispatch them." \
            "Convert to burndown-tasks issues manually when ready to fix." \
            > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt

          # Push to an explicit URL carrying the app token (checkout persisted
          # no credentials, so nothing overrides it).
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"

          # gh pr create returns the PR URL; extract the number from it.
          # (gh pr create has no --json flag)
          printf '%s\n' \
            "## Memory Leak Findings — ${DATE}" \
            "" \
            "**${LEAK_COUNT}** potential leak(s) detected in weekly scheduled static scan." \
            "Run: ${RUN_URL}" \
            "" \
            "### What this PR does" \
            "Inserts a \`[memory-leak]\` entry under \`## ⚠️ Automated Findings\` in \`TODO.md\`." \
            "" \
            "### What to do next" \
            "1. Review the findings in \`TODO.md\`" \
            "2. For each genuine leak, open a \`burndown-tasks\` issue with \`status:ready\`" \
            "3. The burndown bot will pick it up on the next nightly run" \
            "" \
            "> \`[memory-leak]\` is intentionally **not** \`[failed-batch-hard]\` — the decompose job" \
            "> will not auto-dispatch these. Human review first." \
            > /tmp/pr-body.md
          PR_URL=$(gh pr create \
            --repo "$REPO" \
            --head "$BRANCH" \
            --title "chore(todo): memory leak findings ${DATE} [skip changelog]" \
            --body-file /tmp/pr-body.md \
            --label "automation")
          PR_NUMBER="${PR_URL##*/}"

          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --rebase \
            --auto

          echo "Findings queued for merge to main via PR #${PR_NUMBER}"
