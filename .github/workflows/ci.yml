# file: .github/workflows/ci.yml
# version: 3.4.0
# guid: f1a2b3c4-d5e6-f7a8-b9c0-d1e2f3a4b5c6
# last-edited: 2026-08-12

# Fast parallel CI for PRs and pushes.
# Runs go vet/build, short tests, frontend lint/build, and frontend unit tests
# in parallel — all with manual actions/cache (no setup-go built-in cache).
# Full suite (property tests, coverage, E2E) runs via nightly.yml.
name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  # Parallel fast jobs via reusable minimal workflow
  ci:
    name: Minimal CI
    # Pin bumped 2026-08-12 to pick up falkcorp/github-common#346, which raises
    # the `Go Tests (short, race)` job cap from 20 to 35 minutes. That job runs
    # `go test -short -race -timeout 30m ./...`, so at a cap of 20 the runner
    # killed it ten minutes before Go's own timeout could print the goroutine
    # dump naming the stuck test — every slow run surfaced as a bare
    # `conclusion=cancelled` that reads on the PR as a test failure (#2311,
    # #2315, #2319 at exactly 20m16s). The cap is only settable upstream: this
    # workflow exposes no timeout input.
    #
    # Pin bumped again 2026-08-18 to pick up falkcorp/github-common#347, which
    # adds the `go-lint` and `super-linter` jobs enabled below. Before it,
    # golangci-lint ran in ZERO workflows in this repo -- .golangci.yml existed
    # and had never once executed in CI (`make ci` runs staticcheck, not
    # golangci-lint).
    uses: falkcorp/github-common/.github/workflows/reusable-ci-minimal.yml@828afb50d0d18c426c72a6ed1060123677bee674 # main 2026-08-18 (adds go-lint + advisory super-linter jobs)
    with:
      go-version: '1.26'
      go-experiment: 'jsonv2'
      node-version: '22'
      system-packages: 'libtag1-dev'
      frontend-working-dir: 'web'
      run-frontend: true
      go-lint: true
      # --enable-only OVERRIDES .golangci.yml's enable list, and it is load-bearing,
      # not a tidiness flag. That config also enables errcheck, which currently has
      # 927 open findings held as Wave 0's backlog (see the header in .golangci.yml
      # and docs/audits/2026-08-11-silent-failure-error-discards.md). A bare
      # `golangci-lint run ./...` would exit non-zero on those 927 -- this job would
      # be red on day one and switched off by whoever saw it next.
      #
      # interfacebloat is deliberately NOT in this selector even though it is the
      # linter this whole effort is about. golangci-lint exits non-zero on ANY
      # finding, and the tree legitimately holds 5 (see .interface-width-baseline),
      # so listing it here reproduces the exact errcheck failure described above:
      # permanently red, for findings that are known and accepted. It runs in the
      # interface-width job below instead, which compares against the baseline and
      # is what actually enforces the ratchet. Measured 2026-08-18 on this tree:
      # nolintlint 0 issues (exit 0), interfacebloat 5 (exit 1).
      #
      # When Wave 0 closes, add errcheck here rather than removing the selector.
      golangci-lint-args: '--enable-only nolintlint'
      # Advisory only: reports, never blocks. See super-linter-pr.env.
      super-linter: true
    secrets: inherit

  # Project-specific: the interface-width ratchet.
  #
  # This is a separate job rather than a golangci-lint selector because the two
  # answer different questions. golangci-lint asks "are there any findings"; the
  # ratchet asks "did the number change". The tree holds 5 accepted findings, so
  # only the second question can be a gate. See .interface-width-baseline for why
  # the baseline is a count rather than a per-file list, and
  # docs/audits/2026-08-18-interface-width-shapes.md for what the 5 are.
  #
  # Fails in BOTH directions: up (a new wide interface) and down (the count
  # dropped and nobody lowered the baseline, which would silently re-open room
  # for a wide interface later). Mutation-verified 3/3 on 2026-08-18 against a
  # fresh clone of main.
  #
  # ⚠️ THIS JOB REPORTS BUT DOES NOT BLOCK. Read 2026-08-18, main's required
  # checks are exactly: "Minimal CI / Minimal CI Summary", "Require changelog
  # fragment", "TODO Fragment Headers". This job is none of them, and unlike
  # go-lint -- which reaches the required summary because reusable-ci-minimal
  # aggregates it -- a repo-level job has nothing to roll up into. Until someone
  # adds "Interface Width Ratchet" to the required-checks list, a PR that widens
  # an interface goes red here and merges anyway. That is a branch-protection
  # change, i.e. a human action, not something to work around by moving this
  # check into an unrelated job that happens to be required.
  interface-width:
    name: Interface Width Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.26-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26-
            ${{ runner.os }}-go-

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libtag1-dev

      # Installed with `go install` rather than golangci-lint-action, matching
      # the mockery pin in the job below: the action wraps `golangci-lint run`
      # and this job needs the binary on PATH for the ratchet script to invoke,
      # not another runner of it. Pinned to the version the baseline was measured
      # with -- a version bump can change the finding count on its own, which
      # would trip the ratchet and look like a code change.
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check interface width against baseline
        run: bash scripts/check-interface-width.sh

  # Project-specific: verify mockery mocks are not stale
  mocks-check:
    name: Mock Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.26-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26-
            ${{ runner.os }}-go-

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libtag1-dev

      # Pinned mockery version: v3.7.1 (module github.com/vektra/mockery/v3).
      # Must match scripts/setup-mockery.sh. The committed mocks (including
      # the merged internal/database/mocks/mock_store.go) were generated
      # with mockery v3, which supports package-based config and merging
      # multiple interfaces into one output file — mockery v2.53.6 does NOT
      # support merging into a shared filename (each interface's generation
      # overwrites the previous one), so v2 cannot regenerate this repo's
      # mocks at all. Do not downgrade this pin to v2.
      - name: Install mockery
        run: go install github.com/vektra/mockery/v3@v3.7.1

      - name: Check mockery mocks are fresh
        run: |
          set -e
          mockery
          if ! git diff --quiet -- ':(glob)internal/**/mocks/**' internal/ai/mock_*_test.go internal/metadata/mock_*_test.go 2>/dev/null; then
            echo "❌ Committed mocks are stale. Run 'make mocks' and commit."
            git diff --stat -- ':(glob)internal/**/mocks/**' internal/ai/mock_*_test.go internal/metadata/mock_*_test.go
            exit 1
          fi
          echo "✅ Mocks are up to date"

      - name: Check go generate mocks (database)
        run: |
          go generate ./internal/database/...
          if ! git diff --exit-code internal/database/mocks/; then
            echo "❌ MockStore is stale. Run 'make mocks' and commit."
            exit 1
          fi
          echo "✅ Database mocks are fresh"

  # Project-specific: TODO.md must not contain leaked todo.d fragment headers.
  #
  # Fragment bodies are folded into TODO.md verbatim, so a fragment carrying the
  # org-mandated file/version/guid header puts four lines of comment noise into
  # the assembled task list. todo.d/README.md has always said not to add one,
  # but a rule that lives only in prose loses to the global CLAUDE.md rule that
  # says every Markdown file needs a header — 74 blocks leaked in before anyone
  # looked. assemble_todo.py now strips them on collect; this job is the second
  # layer, catching a leak that arrives some other way (a hand edit, a different
  # assembler, a revert). Seconds to run, and it needs no toolchain.
  todo-header-lint:
    name: TODO Fragment Headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint TODO.md for leaked fragment headers
        run: python3 scripts/assemble_todo.py --lint

  # Project-specific: coverage floor gate on every PR (T12 follow-up).
  # Previously this gate (`make ci`'s coverage-check-short, floor read from
  # .ci/coverage-floor.txt) only ran nightly via reusable-ci.yml's separate
  # go-test-coverage/.testcoverage.yml mechanism — never on PRs. This job
  # mirrors `make ci`'s local gate exactly (same two targets a contributor
  # runs locally) so a coverage regression is caught before merge, not the
  # next morning.
  coverage-gate:
    name: Coverage Floor (PR gate)
    runs-on: ubuntu-latest
    # 35, not 20. `make test-short` runs go test with `-timeout 25m`, so a cap
    # of 20 would let the runner kill this job BEFORE Go's own timeout could
    # fire — and Go's timeout is the only thing that prints a goroutine dump
    # naming the stuck test.
    #
    # INVARIANT: the job cap must stay strictly greater than the longest
    # `-timeout` passed to any go test invocation in the steps below, plus
    # setup. If you raise the test timeout, raise this too.
    #
    # CORRECTION (2026-08-12): an earlier version of this comment credited the
    # #2311/#2315 `conclusion=cancelled` failures to this job. That was wrong.
    # Those cancellations were on `Minimal CI / Go Tests (short, race)`, which
    # is NOT defined in this file — the `Minimal CI /` prefix means it comes
    # from the reusable workflow referenced by the `ci` job above
    # (falkcorp/github-common/.github/workflows/reusable-ci-minimal.yml), where
    # the cap was 20 against its own `go test -timeout 30m`. This job is a
    # different job that has never been the one cancelled; it completed in
    # 13m21s on the run where Go Tests was killed at 20m16s. Fixed upstream in
    # falkcorp/github-common#346; that workflow exposes no timeout input, so it
    # could not have been fixed from this repo.
    #
    # This is a diagnosis fix, not a performance fix: internal/server alone is a
    # ~500s package (TODO-SRVTIMEOUT) and sharding it is still open.
    timeout-minutes: 35
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.26-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26-
            ${{ runner.os }}-go-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libtag1-dev bc

      - name: Run short tests with coverage profile
        run: make test-short

      - name: Check coverage floor (.ci/coverage-floor.txt)
        run: make coverage-check-short
