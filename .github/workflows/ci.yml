# file: .github/workflows/ci.yml
# version: 3.46.0
# guid: f1a2b3c4-d5e6-f7a8-b9c0-d1e2f3a4b5c6
# last-edited: 2026-11-18

# Fast parallel CI for PRs and pushes.
# Runs go vet/build, short tests, frontend lint/build, and frontend unit tests
# in parallel — all with manual actions/cache (no setup-go built-in cache).
# Full suite (property tests, coverage, E2E) runs via nightly.yml.
name: Continuous Integration

# No `paths-ignore` here, on purpose (07-C2, 2026-10-09). The `changes` job
# below decides which jobs run; a docs-only event still produces a run in
# which everything but `changes` is skipped. That run concludes `success`,
# which matters on main: auto-revert.yml's span selector
# (.github/workflows/scripts/auto_revert.py, select_span) walks back from a
# red commit to the newest commit whose gate run is GREEN, and a commit with
# NO run is "unverified" -- it stays inside the revert span and cannot
# anchor it. A trigger-level filter would give every docs-only push no run,
# so each one would widen the next revert span, be reverted though
# innocent, and three in a row would exceed max_span and downgrade the
# revert to a report. auto-revert-backstop.yml's `--limit 1` lookup has the
# same blind spot. A ~15 s `changes` job per docs push buys a green anchor.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # The merge queue (repo ruleset "main merge queue", owner 2026-11-05) tests a
  # gh-readonly-queue/main/* commit. Changes has no diff range for this event
  # and fails open, so every job runs on the queued commit. Its checks become
  # required in the ruleset once a queue run has reported them.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      race:
        # false runs this workflow the way the merge queue does (no race
        # detector in the short shards, no fixture shards): the one way to
        # rehearse the merge_group path on a branch before it reaches the
        # queue. See the `race` step of the changes job.
        description: Run the race detector (false = merge-queue flavour)
        type: boolean
        default: true

# A merge-queue run must never be cancelled by a sibling run. The queue reuses
# one gh-readonly-queue/main/pr-<n>-<base> ref for an entry, so a second run or
# a re-run attempt on that ref used to cancel the in-progress one ("Canceling
# since a higher priority waiting request ... exists"). A cancelled required
# check reads as failed, and the queue dropped the PR (#4394, 2026-11-06).
# merge_group runs therefore get a group of their own (run_id) and are never
# cancelled in progress; PR and push runs keep the per-ref cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && format('merge-group-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read
  checks: write

jobs:
  # What changed, so the jobs below can skip what cannot be affected.
  #   go=true   any changed path outside web/ and outside the docs globs
  #             (docs/, *.md, changelog.d/, todo.d/, .claude/, agents/, skills/)
  #   web=true  any changed path under web/, core/web/, .github/workflows/, or
  #             scripts/ci/build_web.sh (the one web-dependency entry point)
  # A workflow-file change sets both. Any error reading the diff fails OPEN
  # (both true): a missed skip costs minutes, a wrong skip hides a failure.
  # No Go test reads a file under a docs glob as an input (07-C2 Step 6,
  # verified 2026-10-09: the two grep hits only assert on literal path
  # strings), so docs-only really cannot change a Go verdict.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.classify.outputs.go }}
      web: ${{ steps.classify.outputs.web }}
      race: ${{ steps.race.outputs.race }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          go=true; web=true; range=''
          case "$EVENT" in
            pull_request) range="origin/${BASE_REF}...HEAD" ;;
            push) [[ "$BEFORE" =~ ^0+$ ]] || range="${BEFORE}...${AFTER}" ;;
          esac
          if [ -n "$range" ] && files=$(git diff --name-only "$range") && [ -n "$files" ]; then
            go=false; web=false
            while IFS= read -r f; do
              case "$f" in web/*|core/web/*|scripts/ci/build_web.sh|scripts/ci/ensure_core_web.sh|.github/workflows/*) web=true ;; esac
              case "$f" in
                # Generated from Go (tools/cmd/opsgen); the Go job's ops-check
                # must run when only the generated file changed.
                web/src/generated/*) go=true ;;
                # Generated from Go by tygo (tygo.yaml); the Go job's types-check
                # must run when only a generated type file changed.
                web/src/types/generated/*) go=true ;;
                # The contract goldens are marshalled from Go (internal/wirecontract),
                # whose test must run when only a golden or the TS test changed.
                web/src/types/contract/*) go=true ;;
                # A Markdown file (or any docs-glob file) that a Go test or a
                # //go:embed reads as an input goes HERE, before the docs line
                # below, as `path/to/file.md) go=true ;;` -- the docs line would
                # otherwise hide it and a docs-only PR would skip the Go jobs
                # that read it (09 §9.2.1; OPS5-4). None today.
                # scripts/tests/test_ci_classifier.py scans the Go sources for
                # every such file and fails when one has no case here.
                web/*|docs/*|*.md|changelog.d/*|todo.d/*|.claude/*|agents/*|skills/*) ;;
                *) go=true ;;
              esac
            done <<<"$files"
          fi
          echo "go=$go web=$web (${range:-no range: fail open})"
          { echo "go=$go"; echo "web=$web"; } >> "$GITHUB_OUTPUT"

      # race=false in the merge queue (owner decision 2026-11-20). The queue
      # spent most of its hour on the race detector: the short shards took
      # 15-24 min each and the fixture shards 14-25 min under -race (run
      # 44770780353), and every job also waited half an hour for a runner. In
      # the queue the short shards therefore run without -race and the fixture
      # shards are skipped. Those run whole packages without -short; the
      # packages' other tests already run in the short shards, so what the
      # queue gives up is only the tests that skip under -short (it keeps the
      # fixture shards' -short half, not their unique half). The race detector
      # still runs on every
      # pull request and every push to main (auto-revert.yml watches the push
      # run), and the whole -race suite, short and fixture, runs nightly on a
      # Mac Woodpecker agent (.woodpecker/race-nightly.yaml). None of the
      # affected jobs is a required check; Coverage Floor (PR gate) is, and it
      # still gets all four shard profiles (same -covermode=atomic).
      # workflow_dispatch with race=false rehearses the queue's flavour.
      # Its own step, not part of Classify changed paths:
      # scripts/tests/test_ci_classifier.py requires that step to stay
      # identical to extraction-gates.yml's copy.
      - name: Race detector for this event
        id: race
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_RACE: ${{ inputs.race }}
        run: |
          set -euo pipefail
          race=true
          case "$EVENT" in
            merge_group) race=false ;;
            workflow_dispatch) if [ "$DISPATCH_RACE" = false ]; then race=false; fi ;;
          esac
          echo "race=$race (event $EVENT)"
          echo "race=$race" >> "$GITHUB_OUTPUT"

  # Parallel fast jobs via reusable minimal workflow
  ci:
    name: Minimal CI
    needs: changes
    # Its Go Tests job is off for good (run-go-tests below); its Go Vet & Build
    # and Go Lint jobs have no skip input, so a web-only change still runs
    # them. Its frontend half is off (run-frontend below): its install is an
    # `npm ci` in web/ that cannot call scripts/ci/build_web.sh, so once web/
    # depends on core/web it would fail. The frontend-lint-build and
    # frontend-test jobs below run those checks after the one entry point.
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true' }}
    # Pin bumped 2026-08-12 to pick up falkcorp/github-common#346, which raises
    # the `Go Tests (short, race)` job cap from 20 to 35 minutes. That job runs
    # `go test -short -race -timeout 30m ./...`, so at a cap of 20 the runner
    # killed it ten minutes before Go's own timeout could print the goroutine
    # dump naming the stuck test — every slow run surfaced as a bare
    # `conclusion=cancelled` that reads on the PR as a test failure (#2311,
    # #2315, #2319 at exactly 20m16s). The cap is only settable upstream: this
    # workflow exposes no timeout input.
    #
    # Pin bumped again 2026-08-18 to pick up falkcorp/github-common#347, which
    # adds the `go-lint` and `super-linter` jobs enabled below. Before it,
    # golangci-lint ran in ZERO workflows in this repo -- .golangci.yml existed
    # and had never once executed in CI (`make ci` runs staticcheck, not
    # golangci-lint).
    #
    # Pin bumped again 2026-10-09 to pick up falkcorp/github-common#371, which
    # adds the `run-go-tests` input set to false below (07-C3). The same range
    # also moves that workflow's own action pins (checkout v7.0.1, setup-go
    # v7.0.0, cache v6.1.0, super-linter v8.7.0).
    uses: falkcorp/github-common/.github/workflows/reusable-ci-minimal.yml@bd20b40305cb645129af0f498f46b506264d3aac # main 2026-11-07; every github-common pin uses this SHA, move them with .github/ghcommon-ref.txt
    with:
      go-version: '1.27.3'
      system-packages: 'libtag1-dev'
      run-frontend: false
      # go-test-short-shards below runs the same suite in four shards and replaces the built-in Go Tests (short, race) job.
      run-go-tests: false
      go-lint: true
      # --enable-only OVERRIDES .golangci.yml's enable list, and it is load-bearing,
      # not a tidiness flag. That config also enables errcheck, which currently has
      # 838 open findings held as Wave 0's backlog (see the header in .golangci.yml,
      # .errcheck-baseline, and docs/audits/2026-08-11-silent-failure-error-discards.md).
      # A bare `golangci-lint run ./...` would exit non-zero on those 838 -- this
      # job would be red on day one and switched off by whoever saw it next.
      #
      # interfacebloat is deliberately NOT in this selector even though it is the
      # linter this whole effort is about. golangci-lint exits non-zero on ANY
      # finding, and the tree legitimately holds 0 accepted-with-//nolint cases
      # today (see .interface-width-baseline), so listing it here would still
      # reproduce the errcheck failure above the moment a new wide interface
      # needed a //nolint. It runs in the interface-width job below instead,
      # which compares against the baseline and is what actually enforces the
      # ratchet. Measured 2026-08-18 on this tree: nolintlint 0 issues (exit 0),
      # interfacebloat 5 (exit 1, pre-#2564 baseline); the current baseline is 0.
      #
      # errcheck is also NOT in this selector, for the identical reason: 838
      # open findings measured 2026-09-25 (see .errcheck-baseline). It now runs
      # in its own ratchet job below (Errcheck Ratchet), added alongside
      # Interface Width Ratchet rather than in this selector, for the same
      # reason interfacebloat isn't here even at a 0 baseline: a ratchet answers
      # "did the count change", a selector answers "are there any findings", and
      # only the first can gate while a backlog exists.
      #
      # When Wave 0's errcheck backlog closes, add errcheck here rather than
      # removing the selector -- that was the original plan for this line, and
      # closing the backlog to 0 doesn't retire the ratchet job on its own
      # (interfacebloat's is still live at a 0 baseline); it's a separate call.
      golangci-lint-args: '--enable-only nolintlint'
      # Advisory only: reports, never blocks. See super-linter-pr.env.
      super-linter: true
    secrets: inherit

  # Project-specific: the interface-width ratchet.
  #
  # This is a separate job rather than a golangci-lint selector because the two
  # answer different questions. golangci-lint asks "are there any findings"; the
  # ratchet asks "did the number change". The tree holds 5 accepted findings, so
  # only the second question can be a gate. See .interface-width-baseline for why
  # the baseline is a count rather than a per-file list, and
  # docs/audits/2026-08-18-interface-width-shapes.md for what the 5 are.
  #
  # One-way since 2026-10-09 (D47, #3867): fails only when the count goes UP.
  # A drop prints a ::notice:: naming the new number and passes; the earning
  # PR (or 07-G4's scheduled job) lowers the baseline. Until then a drop
  # also failed, which turned main red on an improvement.
  #
  # This job reports and does not block -- and that is the design, not a gap.
  # main has NO required status checks (verified 2026-08-20, after classic branch
  # protection was removed to match .github/branch-protection.json, which has
  # declared "required_status_checks": null since 2026-01-31). Nothing here gates
  # a merge. The gate runs after the merge instead: auto-revert.yml watches this
  # workflow on main and restores the last green commit when it fails.
  # So do NOT "fix" this by adding the job to a required-checks list. Pre-merge
  # gating was deliberately given up -- it forces a rebase and a second full CI
  # cycle every time an unrelated commit lands first, and it deadlocked the TODO
  # collector for ten days by requiring checks its `[skip ci]` commits can never
  # produce.
  interface-width:
    name: Interface Width Ratchet
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      # Before the cache restore, in every job that restores it:
      # scripts/ci/free_runner_disk.sh says why.
      - name: Free runner disk
        run: scripts/ci/free_runner_disk.sh

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      - name: Install system packages
        run: scripts/ci/apt_install.sh libtag1-dev

      # Installed with `go install` rather than golangci-lint-action, matching
      # the mockery pin in the job below: the action wraps `golangci-lint run`
      # and this job needs the binary on PATH for the ratchet script to invoke,
      # not another runner of it. Pinned to the version the baseline was measured
      # with -- a version bump can change the finding count on its own, which
      # would trip the ratchet and look like a code change.
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check interface width against baseline
        run: bash scripts/check-interface-width.sh

  # Project-specific: the errcheck ratchet, Wave 0 of the silent-failure sweep
  # closing its own gap.
  #
  # Same shape as interface-width above, for the same reason: .golangci.yml has
  # enabled errcheck (with the bucket-(f) exclude list) since Wave 0 landed in
  # bed1db5a2, but nothing ever ran it as a gate. The `ci` job above deliberately
  # passes `--enable-only nolintlint` -- its own comment says errcheck currently
  # has ~927 open findings held as Wave 0's backlog and a bare
  # `golangci-lint run ./...` would be red on day one -- and that comment ends
  # "When Wave 0 closes, add errcheck here rather than removing the selector."
  # Wave 0's helper package and lint config landed; the backlog itself (838
  # findings on this ubuntu-latest runner, see .errcheck-baseline for why that
  # differs from a local darwin count) is paid down file by file across waves
  # 4-13, exactly like interfacebloat's 28-finding backlog was paid down to 0
  # before it could be a hard gate. Until it reaches 0 the
  # question this job can answer is "did the count go UP", not "are there any
  # findings" -- so it ratchets instead of gating outright, and reports rather
  # than blocks pre-merge for the same reason interface-width does: main has no
  # required status checks, and auto-revert.yml is what makes a red run here
  # consequential.
  errcheck-ratchet:
    name: Errcheck Ratchet
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      # Before the cache restore, in every job that restores it:
      # scripts/ci/free_runner_disk.sh says why.
      - name: Free runner disk
        run: scripts/ci/free_runner_disk.sh

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      - name: Install system packages
        run: scripts/ci/apt_install.sh libtag1-dev

      # Pinned to the version the baseline was measured with, matching
      # interface-width's own reasoning: a version bump can change the finding
      # count on its own and trip the ratchet as if code had changed.
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check errcheck findings against baseline
        run: bash scripts/check-errcheck-ratchet.sh

  # The property tests of internal/applygate and internal/seqnum at full size,
  # without the race detector. Under -race (the sharded short suite below, on
  # every pull request and push; the merge queue runs it without -race, at full
  # size) their random draws are divided by five and their exhaustive walks
  # are one length shorter (`scaled` and `exhaustiveLen`, written after the
  # package's tests timed the 25m `go test` out), so those tests cover a fifth
  # of the texts there. This job runs the same two packages at full size, in
  # about half a minute, so a regression the smaller draw would miss (a title the gate wrongly agrees on, a guard that
  # hides a match) shows red on a PR. Fixed seeds, so the two runs draw the same
  # first texts and a failure here reproduces with
  # `go test ./internal/applygate ./internal/seqnum` on a laptop.
  full-size-parsers:
    name: Full-Size Tests (applygate, seqnum)
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      # Before the cache restore, in every job that restores it:
      # scripts/ci/free_runner_disk.sh says why.
      - name: Free runner disk
        run: scripts/ci/free_runner_disk.sh

      # Restore only, never save: this job builds two packages' worth of
      # objects, and actions/cache's post step would save that small set under
      # the shared go.sum key if it finished first on a key miss, leaving every
      # later job a thinner cache. The shards save theirs on main.
      - name: Restore Go cache (restore only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      # No -short and no -race: that is the point. -count=1 so a cached result
      # from an earlier run of the same sources is not reported as this one.
      - name: Run applygate and seqnum tests at full size
        run: go test -count=1 -timeout 8m ./internal/applygate ./internal/seqnum

  # Ratchet on production functions unreachable from every main (01-P9, D18).
  # One-way like errcheck-ratchet (D47): only a NEW unreachable identifier
  # fails. The tool is pinned in tools/deadcode/go.mod and built from it (as
  # staticcheck and mockery are); scripts/deadcode-ratchet.py's header says why
  # GOOS/GOARCH/CGO_ENABLED are pinned and how the bot prunes the baseline.
  # No cgo, so no libtag1-dev; no submodule is read.
  deadcode-ratchet:
    name: Deadcode Ratchet
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      # Before the cache restore, in every job that restores it:
      # scripts/ci/free_runner_disk.sh says why.
      - name: Free runner disk
        run: scripts/ci/free_runner_disk.sh

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      - name: Install deadcode (pinned, tools/deadcode/go.mod)
        run: |
          go -C tools/deadcode install tool
          echo "DEADCODE_BIN=$(go env GOPATH)/bin/deadcode" >> "$GITHUB_ENV"

      - name: Check unreachable functions against baseline
        run: make --no-print-directory lint-deadcode-ratchet

  # Gate list: ci/gates.txt is the single manifest (07-G4). The golangci-lint and
  # deadcode ratchets run in the jobs above (their display names are the required
  # check names; .github/branch-protection.json is untouched); the Go-test gates
  # run in the sharded short-race suite below. scripts/tests/test_run_gates.py
  # fails if a manifest gate is executed by neither.

  # The frontend half of reusable-ci-minimal.yml (its `run-frontend`), moved here
  # so the install goes through scripts/ci/build_web.sh like every other build
  # site (R1-05; platform-core 07 §7.3.2). Same checks as before: lint, build
  # (whose script runs tsc --noEmit first, so it is also the type check) and the
  # vitest suite. No setup-go on these runners, so they run the script directly:
  # the Makefile's go-env lines would otherwise fetch the pinned Go toolchain
  # just to install npm packages.
  frontend-lint-build:
    name: Frontend Lint & Build
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Restore npm cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-26-${{ hashFiles('web/package-lock.json', 'core/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-26-
            ${{ runner.os }}-npm-

      - name: Install web dependencies
        run: sh scripts/ci/build_web.sh deps

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build

  frontend-test:
    name: Frontend Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Restore npm cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-26-${{ hashFiles('web/package-lock.json', 'core/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-26-
            ${{ runner.os }}-npm-

      - name: Install web dependencies
        run: sh scripts/ci/build_web.sh deps

      - name: Unit tests
        working-directory: web
        run: npm test -- --run

  # Non-blocking report of unused frontend files and exports (01-P9). It never
  # fails the run: continue-on-error is set on the job and on the step.
  knip-report:
    name: Knip Report (non-blocking)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install web dependencies
        run: sh scripts/ci/build_web.sh deps

      - name: Knip (production, files and exports)
        continue-on-error: true
        working-directory: web
        run: npx --no-install knip --production --include files,exports

  # Project-specific: the checks that nothing was running.
  #
  # Renamed from "SDK Deps & Bench Build" on 2026-08-20 when gofmt joined it. The
  # name is not yet load-bearing anywhere — the job had not been added to the
  # required-checks list, so nothing referenced it by name.
  #
  # Both gates below existed only in the local Makefile (`make sdkguard`, and
  # `sdkguard` as a prerequisite of `make ci`). Neither appeared in any workflow
  # — before this job, `grep -rn 'sdkguard' .github/workflows/` matched only
  # prose inside comments. The result was a gate that had been failing for 33
  # days on a green main: internal/audioutil leaked into the SDK dep tree on
  # 2026-07-18, internal/syncapi/progress on 07-30, internal/cache on 08-11, and
  # every "Continuous Integration ✅" in between was reporting on a run that
  # never executed the check.
  #
  # The bench build is the same failure with a different mechanism: nine
  # cmd/dedup_bench_*.go files plus internal/server/bench.go sit behind
  # `//go:build bench`, so `go build ./...` and `make ci` both skip them. On
  # 2026-04-18, b6fe7c5a "refactor: extract internal/dedup package from server"
  # moved AuthorDedupGroup/FindDuplicateAuthors out of internal/server, updated
  # internal/server/bench.go, and missed all four cmd/ call sites. Nothing
  # compiled them, so the tree did not build under -tags bench for the next four
  # months and no run ever said so.
  #
  # gofmt is the third instance of the same oversight, found while fixing the
  # first two: `grep -rn 'gofmt' .github/workflows/ Makefile` returned ZERO hits,
  # and 43 files across 24 packages had drifted out of shape as a result. The
  # sweep that fixed them landed in the same change that added this step — a
  # format gate cannot precede its own sweep without being red on 43 pre-existing
  # files, which is the trap the --enable-only comment above describes.
  #
  # Reports without blocking, for the same reason as interface-width above: main
  # has no required status checks, and auto-revert.yml is what makes a red gate
  # consequential. A PR that re-breaks sdkguard, the bench build or gofmt merges
  # anyway -- and then this job fails on main, and the merge gets reverted.
  repo-guards:
    name: Repo Guards
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      # Before the cache restore, in every job that restores it:
      # scripts/ci/free_runner_disk.sh says why.
      - name: Free runner disk
        run: scripts/ci/free_runner_disk.sh

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      # libtag1-dev (cgo) for the Go guards and ffmpeg for the Whisper worker
      # tests below, in ONE cached install. No live mirror on a warm cache: the
      # .deb files (the packages and the libraries the image lacks) are cached,
      # keyed on the runner image version plus the package list, verified against
      # a sha256 manifest and installed with dpkg. Only a miss (new image, new
      # package list) goes to the mirror, through the same retrying apt_install.sh
      # as before. Tuning that script's timeouts alone did not stop the flake:
      # PRs 4708, 4709 and 4711 each lost this step to a slow mirror.
      # The package list lives in the aptkey step only; the cache key and the
      # install both read it from there.
      # A cache hit removes the mirror dependency; a miss still needs it. Caches
      # saved on a PR ref are visible only to that PR, so a new PR hits only
      # entries saved from main (or its own earlier runs).
      - name: Compute apt cache key (repo-guards)
        id: aptkey
        run: |
          if [ -n "${ImageVersion:-}" ]; then
            echo "image=${ImageOS:-unknown}-${ImageVersion}" >> "$GITHUB_OUTPUT"
          fi
          pkgs="libtag1-dev ffmpeg"
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
          echo "suffix=${pkgs// /_}" >> "$GITHUB_OUTPUT"

      # No ImageVersion (a non-hosted runner): no key, no cache; the install
      # below then behaves as a plain miss.
      # Restore and save are separate steps so the save runs right after the
      # install, not at the end of the job (actions/cache's post step). The
      # post step never ran for a run that was cancelled or failed later, and
      # pushes to main cancel each other (concurrency, per ref), so main kept
      # losing the cache save and PRs and merge-queue runs, which can read only
      # main's caches, never had a warm cache. restore-keys falls back to a
      # set saved on another runner image: its manifest still has to verify and
      # dpkg has to accept it, otherwise the script goes to the mirror, and a
      # successful install is saved under this image's exact key.
      - name: Restore apt packages cache (repo-guards)
        id: aptcache
        if: steps.aptkey.outputs.image != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs-repo-guards
          key: apt-debs-repo-guards-${{ hashFiles('scripts/ci/apt_cached_install.sh', 'scripts/ci/apt_install.sh', 'scripts/ci/apt_watchdog.py') }}-${{ steps.aptkey.outputs.suffix }}-${{ steps.aptkey.outputs.image }}
          restore-keys: |
            apt-debs-repo-guards-${{ hashFiles('scripts/ci/apt_cached_install.sh', 'scripts/ci/apt_install.sh', 'scripts/ci/apt_watchdog.py') }}-${{ steps.aptkey.outputs.suffix }}-

      - name: Install system packages (libtag1-dev, ffmpeg)
        # Miss path: apt_install.sh rotates mirrors and kills a trickling
        # download on a throughput floor, so a slow mirror costs tens of
        # seconds, not a full cap. The theoretical worst case (every call to its
        # 120 s cap) is longer than the 15-minute JOB cap above, so the job cap
        # fires first and the last attempt may never start.
        timeout-minutes: 15
        env:
          APT_INSTALL_CALL_TIMEOUT: "120"
          APT_PKGS: ${{ steps.aptkey.outputs.pkgs }}
        run: |
          read -ra pkgs <<<"$APT_PKGS"
          scripts/ci/apt_cached_install.sh "$HOME/apt-debs-repo-guards" "${pkgs[@]}"

      - name: Save apt packages cache (repo-guards)
        if: steps.aptkey.outputs.image != '' && steps.aptcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs-repo-guards
          key: apt-debs-repo-guards-${{ hashFiles('scripts/ci/apt_cached_install.sh', 'scripts/ci/apt_install.sh', 'scripts/ci/apt_watchdog.py') }}-${{ steps.aptkey.outputs.suffix }}-${{ steps.aptkey.outputs.image }}

      # Fails in BOTH directions against tools/cmd/sdkguard/internal-deps.txt: a
      # new internal package in the SDK's dep tree, or a stale entry that is no
      # longer a dependency. The fix for legitimate growth is
      # `go run ./tools/cmd/sdkguard/main.go -update`, which rewrites that
      # tracked file so the change is reviewable in the PR diff.
      - name: SDK internal-dependency ratchet
        run: make sdkguard

      # Both steps invoke the same make targets a contributor runs locally,
      # rather than restating the commands here. That is the point of the whole
      # change: `make ci` gained bench-check alongside sdkguard, so local and CI
      # enforce one contract and neither can drift into checking less than the
      # other. See the Makefile for why bench-check is not `build-bench`.
      - name: Typecheck bench-tagged code
        run: make bench-check

      - name: Check Go formatting
        run: make fmt-check

      # Vets and runs the pprof-tagged tests, which no other job compiles. Was
      # run only by Woodpecker's checks-build until 2026-11-07, when that
      # workflow was removed as a duplicate of the jobs here; core's own
      # pprof-check runs in core-ci.yml's `make -C core ci`. Static, Go only.
      - name: Vet and test the pprof build tag
        run: make pprof-check

      # web/src/generated/ops.ts is generated from internal/operations/state
      # (tools/cmd/opsgen). A status added on the Go side without regenerating
      # leaves the web pollers classifying it as live, which spins them forever.
      # Same make target `make ci` runs.
      - name: Generated run-status table is fresh
        run: make ops-check

      # web/src/types/generated is generated from Go structs by tygo (tygo.yaml).
      # A renamed json tag without regenerating leaves the SPA compiling against
      # the old shape. Same make target `make ci` runs.
      - name: Generated TypeScript types are fresh
        run: make types-check

      # Every //go:embed input of both modules is inside the Docker build context
      # or a listed in-image output (03 §3.2 item 4; R1-04). A path filter cannot
      # catch it: the change that breaks it touches only a *.go file. The docker-image
      # job is the backstop that builds the image; this one needs no Docker.
      # Registered in ci/gates.txt as embed-context.
      - name: Embed inputs are inside the Docker build context
        run: make embed-check

      # The auto-revert selector decides which commits get reverted off main, so
      # it gets tested somewhere that actually runs. Stdlib unittest, no pip step
      # -- scripts/test_check_memory_leaks.py is wired in below alongside it,
      # since check-memory-leaks.py itself is actively used (Makefile
      # check-memory-leaks target, memory-leak-scan.yml) and its regression
      # test should not sit dead.
      - name: Test the auto-revert span selector and repo scripts
        run: |
          python3 -m unittest discover -s .github/workflows/scripts -p 'test_*.py' -v
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # The Metal Whisper worker's contract tests need fastapi+httpx to drive a
      # real HTTP surface, so the stdlib unittest discovery above SKIPS them.
      # Run them for real here: they are the only thing standing between a
      # protocol change in internal/transcribe/remote.go and a Mac worker that
      # answers 200 with keys nobody reads -- a failure that surfaces as
      # "transcripts silently never land", not as an error. Deps are installed
      # directly rather than via a new action so nothing new needs SHA-pinning.
      #
      # The same step runs the other Whisper worker (scripts/whisper_server.py,
      # CPU or CUDA) and the path pipeline both workers share. test_whisper_mlx_pins
      # is the characterization suite that proves the Mac worker answers what it
      # answered before that pipeline moved out of it; test_whisper_path_pipeline
      # holds the path-safety tests (traversal, symlink and UNC escape, Windows
      # device names, request limits), whose Windows rules run here on Linux
      # through ntpath. No model is loaded and no GPU is needed.
      # test_whisper_decode_child spawns real child processes around a fake
      # backend that hangs, crashes and exits. test_manage_whisper_server parses the
      # PowerShell that manage-whisper-server.py sends (with pwsh where the runner has
      # it; the Windows trial parses it with powershell.exe, the 5.1 WinRM uses).
      # test_whisper_supervisor and test_manage_whisper_server are standard-library
      # unittest, so the unittest discovery above loads them (a pytest import there made
      # the guard fail to load them). The supervisor test is skipped here: it is
      # about a minute of real restarts of a Windows PowerShell 5.1 script, and it runs
      # only on Windows, in the trial workflow (whisper-windows.yml), against
      # powershell.exe. test_whisper_wire_text_guard is stdlib too and runs here.
      #
      # The real-ffmpeg tests must RUN here, not skip: the job's cached install
      # step (above) installs ffmpeg, this step sets WHISPER_TESTS_REQUIRE_FFMPEG=1
      # (a guard test in test_whisper_server_cpu fails when ffmpeg is missing
      # under it) and passes -rs so any remaining skip is listed in the log. Green with the ffmpeg tests skipped proves
      # nothing about the clip cutter.

      - name: Whisper worker contract tests
        env:
          WHISPER_TESTS_REQUIRE_FFMPEG: "1"
        run: |
          python3 -m pip install --quiet fastapi httpx pytest python-multipart
          python3 -m pytest -v -rs \
            scripts/tests/test_whisper_mlx_server.py \
            scripts/tests/test_whisper_mlx_pins.py \
            scripts/tests/test_whisper_path_pipeline.py \
            scripts/tests/test_whisper_server_cpu.py \
            scripts/tests/test_whisper_decode_child.py \
            scripts/tests/test_manage_whisper_server.py

  # Required checks of 09 §9.2.1 (R1-02): go vet over BOTH modules (root and
  # core/; ./... from the root never reaches the nested core/ module) for every
  # (GOOS, tag set) a PR could break that no other job compiles. The job `name:`
  # is the check name the ruleset requires, so it must not be renamed. Each runs
  # the make target `make ci` runs, and is registered in ci/gates.txt.
  #
  # GOOS=darwin CGO_ENABLED=0 is goreleaser's darwin target, vetted WITHOUT the
  # embed_frontend tag: web_embed.go's `//go:embed web/dist` fails on a tree with
  # no built frontend and go vet has no -e, so no placeholder web/dist is ever
  # created. cgo is off, so it needs no system packages.
  vet-darwin:
    name: vet-darwin
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Free runner disk
        run: scripts/ci/free_runner_disk.sh

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      - name: go vet (darwin, no cgo, no embed_frontend)
        run: make vet-darwin

  # -tags integration compiles the integration tests no other gate builds. It
  # keeps cgo on (the Linux default), so the TagLib headers must be installed.
  vet-integration:
    name: vet-integration
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Free runner disk
        run: scripts/ci/free_runner_disk.sh

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      - name: Install system packages
        run: scripts/ci/apt_install.sh libtag1-dev

      - name: go vet -tags integration
        run: make vet-integration

  # Project-specific: verify mockery mocks are not stale
  mocks-check:
    name: Mock Freshness
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # setup-go keeps the floating '1.27' like every other job (the toolchain
      # drift check in scripts/check_toolchain_versions.py requires it).
      # mockery is built from tools/mockery/go.mod, not `go install ...@v3.8.0`:
      # the v3.8.0 release requires an x/tools that reads export data only up
      # to format version 4, and go1.27.2 writes version 5 ("could not import
      # fmt ... export data version 5 is greater than maximum supported version
      # 4", ci.yml run 37886715226). The tools module raises x/tools to v0.51.0.
      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      # Before the cache restore, in every job that restores it:
      # scripts/ci/free_runner_disk.sh says why.
      - name: Free runner disk
        run: scripts/ci/free_runner_disk.sh

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      - name: Install system packages
        run: scripts/ci/apt_install.sh libtag1-dev

      # Pinned mockery version: v3.8.0 (module github.com/vektra/mockery/v3),
      # built from tools/mockery/go.mod like `make mockery-install`. The committed mocks (including
      # the merged internal/books/store/mocks/mock_store.go) were generated
      # with mockery v3, which supports package-based config and merging
      # multiple interfaces into one output file — mockery v2.53.6 does NOT
      # support merging into a shared filename (each interface's generation
      # overwrites the previous one), so v2 cannot regenerate this repo's
      # mocks at all. Do not downgrade this pin to v2.
      - name: Install mockery
        run: go -C tools/mockery install tool

      # `git diff` compares the working tree against the INDEX, so it is blind
      # to files that are not tracked yet. That is precisely the case this job
      # most needs to catch: adding an interface and forgetting to commit its
      # generated mock leaves a brand-new UNTRACKED file, which `git diff`
      # reports as no change and the check passes green. `git status
      # --porcelain` lists untracked entries (as `??`) alongside modified ones,
      # so it sees both halves of "stale".
      - name: Check mockery mocks are fresh
        run: |
          set -e
          "$(go env GOPATH)/bin/mockery"
          MOCK_PATHS=(':(glob)internal/**/mocks/**' 'internal/ai/mock_*_test.go' 'internal/metadata/mock_*_test.go')
          CHANGED=$(git status --porcelain --untracked-files=all -- "${MOCK_PATHS[@]}")
          if [ -n "$CHANGED" ]; then
            echo "❌ Committed mocks are stale. Run 'make mocks' and commit."
            echo "$CHANGED"
            exit 1
          fi
          echo "✅ Mocks are up to date"

      - name: Check go generate mocks (database)
        run: |
          set -e
          go generate ./internal/books/store/...
          CHANGED=$(git status --porcelain --untracked-files=all -- internal/books/store/mocks/)
          if [ -n "$CHANGED" ]; then
            echo "❌ MockStore is stale. Run 'make mocks' and commit."
            echo "$CHANGED"
            exit 1
          fi
          echo "✅ Database mocks are fresh"

  # Project-specific: TODO.md must not contain leaked todo.d fragment headers.
  #
  # Fragment bodies are folded into TODO.md verbatim, so a fragment carrying the
  # org-mandated file/version/guid header puts four lines of comment noise into
  # the assembled task list. todo.d/README.md has always said not to add one,
  # but a rule that lives only in prose loses to the global CLAUDE.md rule that
  # says every Markdown file needs a header — 74 blocks leaked in before anyone
  # looked. assemble_todo.py now strips them on collect; this job is the second
  # layer, catching a leak that arrives some other way (a hand edit, a different
  # assembler, a revert). Seconds to run, and it needs no toolchain.
  # Deliberately NOT gated on `changes`: TODO.md is a docs path, and this is
  # the one job a docs-only change must still run.
  todo-header-lint:
    name: TODO Fragment Headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Lint TODO.md for leaked fragment headers
        run: python3 scripts/assemble_todo.py --lint

  # Project-specific: the short Go suite, in four shards (07-C3, 2026-10-09).
  #
  # Before this, the same `go test -short -race ./...` ran twice on every PR:
  # Minimal CI's `Go Tests (short, race)` (~19 min) and this file's
  # `coverage-gate` job (`make test-short`, ~23 min), and the PR waited for the
  # slower one. Now Minimal CI's copy is off (run-go-tests: false on the `ci`
  # job above) and this matrix runs the suite once, in four parallel shards.
  #
  # How the split works: scripts/ci/short_test_shards.py (via
  # `make test-short-shard SHARD=k/4`) takes every package `go list ./...`
  # reports. A package heavier than 150 s (scripts/ci/short_test_weights.json)
  # is split into groups of top-level test names, balanced by the per-test
  # seconds in scripts/ci/go_test_timings.json, each run as its own
  # `go test -run '^(...)$'`; every other package runs whole. Units are dealt
  # longest-first into four bins, deterministically, so every shard computes
  # the same plan. Before running, each shard checks that every package and
  # every split test name is assigned exactly once and that no shard is empty;
  # a compile error in a split package fails `go test -list` and the shard.
  # `short_test_shards.py --check` runs the same check over every test name.
  # Each shard uploads its merged profile as coverage-k.out; the `coverage`
  # job below merges the four and applies the floor.
  #
  # The fifth leg, `core/4`, is the one core shard (09 §9.4 R1's CI
  # classification): every package of the nested core module, which `./...`
  # from the root never reaches, runs there under `go -C core test` in one
  # `go test` call. It writes no coverage profile (core has no floor until
  # R1-23, and the root floor must keep comparing the same four-profile
  # total), so it uploads no artifact and the coverage job below merges legs
  # 1-4 only. `core-ci` runs core's short tests as well, from an export of
  # core/ alone (12 SC4); this leg is the one that runs them in the root's
  # sharded suite next to the plan check that every package is assigned.
  #
  # In the merge queue (changes.outputs.race == 'false') the shards run
  # WITHOUT -race; see the `race` step of the changes job. The job name keeps
  # "(short, race)" on purpose: renaming a check breaks every reference to it
  # (dashboards, docs, the ruleset if it is ever added), and the step name and
  # log say which flavour ran.
  go-test-short-shards:
    name: Go Tests (short, race) shard ${{ matrix.shard }}
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4', 'core/4']
    # 35, not 20. `make test-short-shard` runs go test with `-timeout 25m`, so
    # a cap of 20 would let the runner kill this job BEFORE Go's own timeout
    # could fire — and Go's timeout is the only thing that prints a goroutine
    # dump naming the stuck test.
    #
    # INVARIANT: the job cap must stay strictly greater than the longest
    # `-timeout` passed to any go test invocation in the steps below, plus
    # setup. If you raise the test timeout, raise this too.
    #
    # CORRECTION (2026-08-12): an earlier version of this comment credited the
    # #2311/#2315 `conclusion=cancelled` failures to this job's predecessor
    # (`coverage-gate`). That was wrong. Those cancellations were on
    # `Minimal CI / Go Tests (short, race)`, which is NOT defined in this file
    # — the `Minimal CI /` prefix means it comes from the reusable workflow
    # referenced by the `ci` job above
    # (falkcorp/github-common/.github/workflows/reusable-ci-minimal.yml), where
    # the cap was 20 against its own `go test -timeout 30m`. coverage-gate was
    # a different job that was never the one cancelled; it completed in
    # 13m21s on the run where Go Tests was killed at 20m16s. Fixed upstream in
    # falkcorp/github-common#346; that workflow exposes no timeout input, so it
    # could not have been fixed from this repo.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # internal/books' TestTasklintExemptions_ShrinkOnly (F2-17, 05-tasks
      # §5T.8.4) diffs the tasklint exemption list against a base commit and
      # fails under CI=true without one. The default checkout stays depth 1;
      # this fetches only the base, at depth 1, and names it in
      # TASKLINT_SHRINK_BASE: merge_group.base_sha in the merge queue, and on a
      # pull request the first parent of the merge ref, read from the raw
      # commit because the shallow boundary hides it from rev-parse. A push has
      # neither, so the test falls back to origin/main, which is HEAD there.
      # A workflow_dispatch run (the race=false rehearsal of the merge queue)
      # on a branch that is behind main has no base of its own either; it
      # takes the branch's merge base with main from the compare API, so an
      # exemption main removed after the branch point does not read as one
      # the branch added (rehearsal run 44793448411 failed exactly that way).
      - name: Fetch the tasklint shrink-only base
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin main
          git rev-parse --verify origin/main
          base="$MERGE_GROUP_BASE"
          if [ -z "$base" ] && [ "$EVENT_NAME" = pull_request ]; then
            base=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          fi
          if [ -z "$base" ] && [ "$EVENT_NAME" = workflow_dispatch ]; then
            base=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .merge_base_commit.sha)
          fi
          if [ -n "$base" ]; then
            git fetch --no-tags --depth=1 origin "$base"
            git rev-parse --verify "$base^{commit}"
            echo "TASKLINT_SHRINK_BASE=$base" >> "$GITHUB_ENV"
          fi

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      # Not the shared `Restore Go cache (manual)` step the other jobs use.
      # That cache is keyed on go.sum alone, so once any job has saved it for
      # a go.sum, every later job hits the exact key and actions/cache never
      # saves again: it holds only the first saver's build objects, which were
      # not built with -race -covermode=atomic, so each shard recompiled the
      # whole module graph race-instrumented from scratch. On PR #3882
      # (2026-10-09) the split-package `go test -list` alone took 9 min 18 s per
      # shard before the first test ran, against ~6 min of tests.
      #
      # So the shards keep their own race-flavoured cache, keyed by a six-hour
      # slot so it refreshes: a shard restores the current slot's entry, else
      # the newest earlier one (then the shared cache, for the module download
      # at least), and a shard on main saves it after its run when the slot's
      # key is new. The four shards race for that one save; the first to
      # finish wins and the others find the key reserved and skip, so it is at
      # most four saves a day of one shard's objects plus the shared dependency
      # graph. PR runs read main's entries (a PR can read its base branch's
      # caches) and never save, so PR branches add no cache churn against the
      # 10 GB repo cap. Why not a day: main merges ten-plus PRs a day, and a
      # refactor that touches a package most of the tree imports (three of
      # them landed within three hours of the first save on 2026-10-09) makes
      # a day-old entry mostly cold; measured, a shard went from 4.5 to 8.5
      # minutes against the same entry.
      # Before the cache restore: scripts/ci/free_runner_disk.sh says why.
      - name: Free runner disk
        run: scripts/ci/free_runner_disk.sh

      - name: Slot stamp for the race build cache
        id: stamp
        run: echo "slot=$(date -u +%F)-$(( $(date -u +%-H) / 6 ))" >> "$GITHUB_OUTPUT"

      - name: Restore Go race build cache
        id: race-cache
        if: ${{ needs.changes.outputs.race == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-race-short-${{ hashFiles('**/go.sum') }}-${{ steps.stamp.outputs.slot }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-race-short-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-1.27-race-short-
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      # Without -race (the merge queue) the race-instrumented objects above are
      # useless: restore the shared go.sum cache instead, whose dependency
      # objects a plain -covermode=atomic build reuses. Restore only; the race
      # flavour is the one that saves, on main.
      - name: Restore Go build cache (no race)
        if: ${{ needs.changes.outputs.race != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      - name: Install system dependencies
        run: scripts/ci/apt_install.sh libtag1-dev bc

      # SHARD_RACE empty = no race detector (the merge queue). `'-race' || ''`
      # and not `'' || '-race'`: an empty string is falsy in an expression, so
      # the second form would always yield -race.
      - name: Run short tests, one shard, with coverage profile (race=${{ needs.changes.outputs.race }})
        id: shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_RACE: ${{ needs.changes.outputs.race == 'true' && '-race' || '' }}
        run: |
          echo "n=${SHARD%%/*}" >> "$GITHUB_OUTPUT"
          make test-short-shard SHARD="$SHARD" SHARD_RACE="$SHARD_RACE"

      # !cancelled(), not the default success(): a red run's compiled objects
      # are as reusable as a green run's, and the next run is what pays.
      # Race flavour only: a no-race run (workflow_dispatch race=false on main)
      # must not save plain objects under the race key.
      - name: Save Go race build cache (main, first run of the slot)
        if: ${{ !cancelled() && needs.changes.outputs.race == 'true' && github.ref == 'refs/heads/main' && steps.race-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.race-cache.outputs.cache-primary-key }}

      - name: Upload shard coverage profile
        if: ${{ matrix.shard != 'core/4' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ steps.shard.outputs.n }}
          path: coverage-${{ steps.shard.outputs.n }}.out
          if-no-files-found: error
          retention-days: 3

  # Project-specific: coverage floor gate on every PR (T12 follow-up).
  # Previously this gate (`make ci`'s coverage-check-short, floor read from
  # .ci/coverage-floor.txt) only ran nightly via reusable-ci.yml's separate
  # go-test-coverage/.testcoverage.yml mechanism — never on PRs. It still
  # applies `make ci`'s local gate exactly (coverage-check-short, unchanged),
  # but to the four shard profiles merged block by block
  # (`short_test_shards.py --merge`, which fails if any shard's profile is
  # missing) instead of a profile from a run of its own. The display name is
  # the one the `coverage-gate` job had, so the check name stays the same.
  #
  # This is also the ONLY required check (ruleset 26660812) that the test
  # shards reach: the shards themselves are not required. So it must FAIL when
  # a shard fails, not be skipped. With a plain `needs:` a failed shard made
  # GitHub skip this job, and a skipped required check counts as passing, so
  # the queue could merge a commit whose short tests failed (merge_group run
  # 44717492360: shard 1/4 failure, this check skipped). `!cancelled()` makes
  # it run anyway and the first step fails it unless every shard succeeded
  # (extraction-gates.yml's terminal job does the same with always()).
  # `!cancelled()`, not `always()`: cancelled() is about the RUN, so a failed or
  # timed-out shard still fails this job, while a push run on main superseded
  # by the next merge (cancel-in-progress) skips it instead of adding a failed
  # job to a run auto-revert.yml reads. Without -race in the merge queue the
  # shards are the queue's whole Go test gate.
  coverage:
    name: Coverage Floor (PR gate)
    needs: [changes, go-test-short-shards]
    if: ${{ !cancelled() && needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Every short-test shard passed
        env:
          SHARDS: ${{ needs.go-test-short-shards.result }}
        run: |
          echo "go-test-short-shards: ${SHARDS}"
          if [ "$SHARDS" != success ]; then
            echo "::error::Go Tests (short) shards ended '${SHARDS}'; the coverage floor gate fails with them"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # `go tool cover -func` resolves the profile's packages to source files,
      # so the toolchain and module cache are needed even though nothing runs.
      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      # Before the cache restore, in every job that restores it:
      # scripts/ci/free_runner_disk.sh says why.
      - name: Free runner disk
        run: scripts/ci/free_runner_disk.sh

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      - name: Install system dependencies
        run: scripts/ci/apt_install.sh libtag1-dev bc

      - name: Download shard coverage profiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: shard-coverage
          merge-multiple: true

      - name: Merge shard profiles into coverage.out
        run: >-
          python3 scripts/ci/short_test_shards.py --merge coverage.out
          shard-coverage/coverage-1.out shard-coverage/coverage-2.out
          shard-coverage/coverage-3.out shard-coverage/coverage-4.out

      - name: Check coverage floor (.ci/coverage-floor.txt)
        run: make coverage-check-short

  # Project-specific: the tests that -short skips, run WITHOUT -short.
  #
  # Every other Go test run that gates a PR passes -short: the
  # go-test-short-shards matrix above (`make test-short-shard`), and all three
  # Woodpecker test workflows. Tests built on the real-store fixture
  # internal/versionprimary/vptest (its New skips under -short) and every other
  # testing.Short() skip -- the merge, undo and redirect state-machine tests in
  # internal/merge, internal/dedup, internal/reconcile and
  # internal/server/handlers/duplicates among them -- therefore gated nothing.
  # Only Nightly Full CI ran them (reusable-ci's go-test helper runs
  # `go test -v -race ./...`), after the merge.
  #
  # `make test-fixtures` discovers the packages at run time
  # (scripts/ci/fixture_test_packages.py), so a new short-skipped test is
  # covered without editing this job. Three shards, balanced by measured
  # per-package time. A package too heavy for one process (internal/server and
  # internal/plugins/maintenance took about 1300 s each in Woodpecker, against
  # the 25m = 1500 s go test timeout) is split by test name into several
  # `go test -run` processes that land in different shards, so no single
  # process comes near the timeout; see scripts/ci/fixture_test_packages.py.
  #
  # Gate: this job's result feeds the "Continuous Integration" workflow
  # conclusion, which is what auto-revert.yml watches on main (see the note on
  # interface-width above: there are no required status checks).
  #
  # Skipped in the merge queue (changes.outputs.race == 'false', owner
  # 2026-11-20). This job runs whole packages without -short; their tests that
  # do not skip under -short also run in the short shards, so the queue loses
  # only the short-skipped tests, whose -race run moves to the nightly
  # Woodpecker pipeline (.woodpecker/race-nightly.yaml). It still runs on pull
  # requests and on pushes to main. Not a required check, so a skipped job
  # does not hold the queue.
  fixture-tests:
    name: Fixture Tests (no -short, race) ${{ matrix.shard }}
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' && needs.changes.outputs.race == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    # INVARIANT (same as go-test-short-shards): the job cap must stay strictly greater
    # than the 25m `-timeout` (FIXTURE_TIMEOUT's default) that `make test-fixtures` passes to go test, plus
    # setup, or the runner kills the job before Go prints the goroutine dump.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # internal/books' TestTasklintExemptions_ShrinkOnly (F2-17, 05-tasks
      # §5T.8.4) diffs the tasklint exemption list against a base commit and
      # fails under CI=true without one. The default checkout stays depth 1;
      # this fetches only the base, at depth 1, and names it in
      # TASKLINT_SHRINK_BASE: merge_group.base_sha in the merge queue, and on a
      # pull request the first parent of the merge ref, read from the raw
      # commit because the shallow boundary hides it from rev-parse. A push has
      # neither, so the test falls back to origin/main, which is HEAD there.
      # A workflow_dispatch run (the race=false rehearsal of the merge queue)
      # on a branch that is behind main has no base of its own either; it
      # takes the branch's merge base with main from the compare API, so an
      # exemption main removed after the branch point does not read as one
      # the branch added (rehearsal run 44793448411 failed exactly that way).
      - name: Fetch the tasklint shrink-only base
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin main
          git rev-parse --verify origin/main
          base="$MERGE_GROUP_BASE"
          if [ -z "$base" ] && [ "$EVENT_NAME" = pull_request ]; then
            base=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          fi
          if [ -z "$base" ] && [ "$EVENT_NAME" = workflow_dispatch ]; then
            base=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .merge_base_commit.sha)
          fi
          if [ -n "$base" ]; then
            git fetch --no-tags --depth=1 origin "$base"
            git rev-parse --verify "$base^{commit}"
            echo "TASKLINT_SHRINK_BASE=$base" >> "$GITHUB_ENV"
          fi

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      # Before the cache restore, in every job that restores it:
      # scripts/ci/free_runner_disk.sh says why.
      - name: Free runner disk
        run: scripts/ci/free_runner_disk.sh

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      # ffmpeg (ffmpeg + ffprobe) and libchromaprint-tools (fpcalc): the
      # selected packages include internal/audiobooks, internal/organizer,
      # internal/scanner and internal/server, whose real-audio-file tests
      # skip when exec.LookPath cannot find these tools. Without them this job
      # would report those tests as passing while running none of them.
      # Cached .deb install, see the Repo Guards install step: a warm cache needs no
      # apt mirror, and the script finishes an interrupted dpkg first.
      # The package list lives in the aptkey step only (cache key and install).
      - name: Compute apt cache key (fixture-system-deps)
        id: aptkey
        run: |
          if [ -n "${ImageVersion:-}" ]; then
            echo "image=${ImageOS:-unknown}-${ImageVersion}" >> "$GITHUB_OUTPUT"
          fi
          pkgs="libtag1-dev ffmpeg libchromaprint-tools"
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
          echo "suffix=${pkgs// /_}" >> "$GITHUB_OUTPUT"

      # Separate restore and save steps, restore-keys fallback across runner
      # images: see the Repo Guards cache steps for why.
      - name: Restore apt packages cache (fixture-system-deps)
        id: aptcache
        if: steps.aptkey.outputs.image != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs-fixture-system-deps
          key: apt-debs-fixture-system-deps-${{ hashFiles('scripts/ci/apt_cached_install.sh', 'scripts/ci/apt_install.sh', 'scripts/ci/apt_watchdog.py') }}-${{ steps.aptkey.outputs.suffix }}-${{ steps.aptkey.outputs.image }}
          restore-keys: |
            apt-debs-fixture-system-deps-${{ hashFiles('scripts/ci/apt_cached_install.sh', 'scripts/ci/apt_install.sh', 'scripts/ci/apt_watchdog.py') }}-${{ steps.aptkey.outputs.suffix }}-

      - name: Install system dependencies
        # Miss path: apt_install.sh rotates mirrors and kills a trickling
        # download on a throughput floor (see its header); the 180 s cap is
        # only the last attempt's bound. Theoretical worst case 3 x 3 x
        # (180 s + 10 s) + backoff is longer than this step cap, which then
        # fires first.
        timeout-minutes: 20
        env:
          APT_INSTALL_CALL_TIMEOUT: "180"
          APT_PKGS: ${{ steps.aptkey.outputs.pkgs }}
        run: |
          read -ra pkgs <<<"$APT_PKGS"
          scripts/ci/apt_cached_install.sh "$HOME/apt-debs-fixture-system-deps" "${pkgs[@]}"

      - name: Save apt packages cache (fixture-system-deps)
        if: steps.aptkey.outputs.image != '' && steps.aptcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs-fixture-system-deps
          key: apt-debs-fixture-system-deps-${{ hashFiles('scripts/ci/apt_cached_install.sh', 'scripts/ci/apt_install.sh', 'scripts/ci/apt_watchdog.py') }}-${{ steps.aptkey.outputs.suffix }}-${{ steps.aptkey.outputs.image }}

      # internal/books' TestR0OpensR1Store runs the R0 release binary. Restore
      # its archive from cache and fetch it here (gh, retrying, checksum
      # pinned) so the test never downloads in CI: a runner proxy 504 failed it
      # on every in-test retry. Keep the key in step with r0store_test.go.
      - name: Restore the R0 release archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/audiobook-organizer-tests/r0
          key: r0-release-v0.223.0-acbe9e096b04d80bd1a49d8e0ecc1bf7dc8171e004ea26cf795513e881ba1e6d

      - name: Fetch the R0 binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R0_TAG: v0.223.0
        # Exit 3 = the download failed on every attempt: carry on, and the
        # test's own retrying download is the fallback. Any other failure
        # (a checksum mismatch) fails the job.
        run: |
          rc=0
          scripts/ci/fetch_r0.sh || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::warning::R0 prefetch failed; the test will try its own download"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      # FIXTURE_TIMES_FILE makes the run write per-package wall times as JSON;
      # the artifact below feeds scripts/ci/fixture_shard_weights.py, which
      # recalibrates scripts/ci/fixture_weights.json (shard weights). Woodpecker
      # prints the same numbers as `::timing::` lines in its step log instead.
      - name: Run fixture tests without -short (shard ${{ matrix.shard }})
        env:
          FIXTURE_TIMES_FILE: ${{ runner.temp }}/fixture-times-${{ strategy.job-index }}.json
        run: make test-fixtures FIXTURE_SHARD=${{ matrix.shard }}

      - name: Upload fixture timings (shard ${{ matrix.shard }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-times-${{ strategy.job-index }}
          path: ${{ runner.temp }}/fixture-times-${{ strategy.job-index }}.json
          if-no-files-found: ignore
          retention-days: 30
