# file: .github/workflows/ci.yml
# version: 3.23.1
# guid: f1a2b3c4-d5e6-f7a8-b9c0-d1e2f3a4b5c6
# last-edited: 2026-10-10

# Fast parallel CI for PRs and pushes.
# Runs go vet/build, short tests, frontend lint/build, and frontend unit tests
# in parallel — all with manual actions/cache (no setup-go built-in cache).
# Full suite (property tests, coverage, E2E) runs via nightly.yml.
name: Continuous Integration

# No `paths-ignore` here, on purpose (07-C2, 2026-10-09). The `changes` job
# below decides which jobs run; a docs-only event still produces a run in
# which everything but `changes` is skipped. That run concludes `success`,
# which matters on main: auto-revert.yml's span selector
# (.github/workflows/scripts/auto_revert.py, select_span) walks back from a
# red commit to the newest commit whose gate run is GREEN, and a commit with
# NO run is "unverified" -- it stays inside the revert span and cannot
# anchor it. A trigger-level filter would give every docs-only push no run,
# so each one would widen the next revert span, be reverted though
# innocent, and three in a row would exceed max_span and downgrade the
# revert to a report. auto-revert-backstop.yml's `--limit 1` lookup has the
# same blind spot. A ~15 s `changes` job per docs push buys a green anchor.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  # What changed, so the jobs below can skip what cannot be affected.
  #   go=true   any changed path outside web/ and outside the docs globs
  #             (docs/, *.md, changelog.d/, todo.d/, .claude/, agents/, skills/)
  #   web=true  any changed path under web/ or .github/workflows/
  # A workflow-file change sets both. Any error reading the diff fails OPEN
  # (both true): a missed skip costs minutes, a wrong skip hides a failure.
  # No Go test reads a file under a docs glob as an input (07-C2 Step 6,
  # verified 2026-10-09: the two grep hits only assert on literal path
  # strings), so docs-only really cannot change a Go verdict.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.classify.outputs.go }}
      web: ${{ steps.classify.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          go=true; web=true; range=''
          case "$EVENT" in
            pull_request) range="origin/${BASE_REF}...HEAD" ;;
            push) [[ "$BEFORE" =~ ^0+$ ]] || range="${BEFORE}...${AFTER}" ;;
          esac
          if [ -n "$range" ] && files=$(git diff --name-only "$range") && [ -n "$files" ]; then
            go=false; web=false
            while IFS= read -r f; do
              case "$f" in web/*|.github/workflows/*) web=true ;; esac
              case "$f" in
                # Generated from Go (tools/cmd/opsgen); the Go job's ops-check
                # must run when only the generated file changed.
                web/src/generated/*) go=true ;;
                web/*|docs/*|*.md|changelog.d/*|todo.d/*|.claude/*|agents/*|skills/*) ;;
                *) go=true ;;
              esac
            done <<<"$files"
          fi
          echo "go=$go web=$web (${range:-no range: fail open})"
          { echo "go=$go"; echo "web=$web"; } >> "$GITHUB_OUTPUT"

  # Parallel fast jobs via reusable minimal workflow
  ci:
    name: Minimal CI
    needs: changes
    # Its Go Tests job is off for good (run-go-tests below); its Go Vet & Build
    # and Go Lint jobs have no skip input, so a web-only change still runs
    # them. Only the frontend half is switchable per change from here.
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true' }}
    # Pin bumped 2026-08-12 to pick up falkcorp/github-common#346, which raises
    # the `Go Tests (short, race)` job cap from 20 to 35 minutes. That job runs
    # `go test -short -race -timeout 30m ./...`, so at a cap of 20 the runner
    # killed it ten minutes before Go's own timeout could print the goroutine
    # dump naming the stuck test — every slow run surfaced as a bare
    # `conclusion=cancelled` that reads on the PR as a test failure (#2311,
    # #2315, #2319 at exactly 20m16s). The cap is only settable upstream: this
    # workflow exposes no timeout input.
    #
    # Pin bumped again 2026-08-18 to pick up falkcorp/github-common#347, which
    # adds the `go-lint` and `super-linter` jobs enabled below. Before it,
    # golangci-lint ran in ZERO workflows in this repo -- .golangci.yml existed
    # and had never once executed in CI (`make ci` runs staticcheck, not
    # golangci-lint).
    #
    # Pin bumped again 2026-10-09 to pick up falkcorp/github-common#371, which
    # adds the `run-go-tests` input set to false below (07-C3). The same range
    # also moves that workflow's own action pins (checkout v7.0.1, setup-go
    # v7.0.0, cache v6.1.0, super-linter v8.7.0).
    uses: falkcorp/github-common/.github/workflows/reusable-ci-minimal.yml@8d94ff2c3a745b323088c98659851c82313e5fd0 # main 2026-10-09 (adds run-go-tests)
    with:
      go-version: '1.27'
      node-version: '26'
      system-packages: 'libtag1-dev'
      frontend-working-dir: 'web'
      run-frontend: ${{ needs.changes.outputs.web == 'true' }}
      # go-test-short-shards below runs the same suite in four shards and replaces the built-in Go Tests (short, race) job.
      run-go-tests: false
      go-lint: true
      # --enable-only OVERRIDES .golangci.yml's enable list, and it is load-bearing,
      # not a tidiness flag. That config also enables errcheck, which currently has
      # 838 open findings held as Wave 0's backlog (see the header in .golangci.yml,
      # .errcheck-baseline, and docs/audits/2026-08-11-silent-failure-error-discards.md).
      # A bare `golangci-lint run ./...` would exit non-zero on those 838 -- this
      # job would be red on day one and switched off by whoever saw it next.
      #
      # interfacebloat is deliberately NOT in this selector even though it is the
      # linter this whole effort is about. golangci-lint exits non-zero on ANY
      # finding, and the tree legitimately holds 0 accepted-with-//nolint cases
      # today (see .interface-width-baseline), so listing it here would still
      # reproduce the errcheck failure above the moment a new wide interface
      # needed a //nolint. It runs in the interface-width job below instead,
      # which compares against the baseline and is what actually enforces the
      # ratchet. Measured 2026-08-18 on this tree: nolintlint 0 issues (exit 0),
      # interfacebloat 5 (exit 1, pre-#2564 baseline); the current baseline is 0.
      #
      # errcheck is also NOT in this selector, for the identical reason: 838
      # open findings measured 2026-09-25 (see .errcheck-baseline). It now runs
      # in its own ratchet job below (Errcheck Ratchet), added alongside
      # Interface Width Ratchet rather than in this selector, for the same
      # reason interfacebloat isn't here even at a 0 baseline: a ratchet answers
      # "did the count change", a selector answers "are there any findings", and
      # only the first can gate while a backlog exists.
      #
      # When Wave 0's errcheck backlog closes, add errcheck here rather than
      # removing the selector -- that was the original plan for this line, and
      # closing the backlog to 0 doesn't retire the ratchet job on its own
      # (interfacebloat's is still live at a 0 baseline); it's a separate call.
      golangci-lint-args: '--enable-only nolintlint'
      # Advisory only: reports, never blocks. See super-linter-pr.env.
      super-linter: true
    secrets: inherit

  # Project-specific: the interface-width ratchet.
  #
  # This is a separate job rather than a golangci-lint selector because the two
  # answer different questions. golangci-lint asks "are there any findings"; the
  # ratchet asks "did the number change". The tree holds 5 accepted findings, so
  # only the second question can be a gate. See .interface-width-baseline for why
  # the baseline is a count rather than a per-file list, and
  # docs/audits/2026-08-18-interface-width-shapes.md for what the 5 are.
  #
  # One-way since 2026-10-09 (D47, #3867): fails only when the count goes UP.
  # A drop prints a ::notice:: naming the new number and passes; the earning
  # PR (or 07-G4's scheduled job) lowers the baseline. Until then a drop
  # also failed, which turned main red on an improvement.
  #
  # This job reports and does not block -- and that is the design, not a gap.
  # main has NO required status checks (verified 2026-08-20, after classic branch
  # protection was removed to match .github/branch-protection.json, which has
  # declared "required_status_checks": null since 2026-01-31). Nothing here gates
  # a merge. The gate runs after the merge instead: auto-revert.yml watches this
  # workflow on main and restores the last green commit when it fails.
  # So do NOT "fix" this by adding the job to a required-checks list. Pre-merge
  # gating was deliberately given up -- it forces a rebase and a second full CI
  # cycle every time an unrelated commit lands first, and it deadlocked the TODO
  # collector for ten days by requiring checks its `[skip ci]` commits can never
  # produce.
  interface-width:
    name: Interface Width Ratchet
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libtag1-dev

      # Installed with `go install` rather than golangci-lint-action, matching
      # the mockery pin in the job below: the action wraps `golangci-lint run`
      # and this job needs the binary on PATH for the ratchet script to invoke,
      # not another runner of it. Pinned to the version the baseline was measured
      # with -- a version bump can change the finding count on its own, which
      # would trip the ratchet and look like a code change.
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check interface width against baseline
        run: bash scripts/check-interface-width.sh

  # Project-specific: the errcheck ratchet, Wave 0 of the silent-failure sweep
  # closing its own gap.
  #
  # Same shape as interface-width above, for the same reason: .golangci.yml has
  # enabled errcheck (with the bucket-(f) exclude list) since Wave 0 landed in
  # bed1db5a2, but nothing ever ran it as a gate. The `ci` job above deliberately
  # passes `--enable-only nolintlint` -- its own comment says errcheck currently
  # has ~927 open findings held as Wave 0's backlog and a bare
  # `golangci-lint run ./...` would be red on day one -- and that comment ends
  # "When Wave 0 closes, add errcheck here rather than removing the selector."
  # Wave 0's helper package and lint config landed; the backlog itself (838
  # findings on this ubuntu-latest runner, see .errcheck-baseline for why that
  # differs from a local darwin count) is paid down file by file across waves
  # 4-13, exactly like interfacebloat's 28-finding backlog was paid down to 0
  # before it could be a hard gate. Until it reaches 0 the
  # question this job can answer is "did the count go UP", not "are there any
  # findings" -- so it ratchets instead of gating outright, and reports rather
  # than blocks pre-merge for the same reason interface-width does: main has no
  # required status checks, and auto-revert.yml is what makes a red run here
  # consequential.
  errcheck-ratchet:
    name: Errcheck Ratchet
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libtag1-dev

      # Pinned to the version the baseline was measured with, matching
      # interface-width's own reasoning: a version bump can change the finding
      # count on its own and trip the ratchet as if code had changed.
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check errcheck findings against baseline
        run: bash scripts/check-errcheck-ratchet.sh

  # Project-specific: the checks that nothing was running.
  #
  # Renamed from "SDK Deps & Bench Build" on 2026-08-20 when gofmt joined it. The
  # name is not yet load-bearing anywhere — the job had not been added to the
  # required-checks list, so nothing referenced it by name.
  #
  # Both gates below existed only in the local Makefile (`make sdkguard`, and
  # `sdkguard` as a prerequisite of `make ci`). Neither appeared in any workflow
  # — before this job, `grep -rn 'sdkguard' .github/workflows/` matched only
  # prose inside comments. The result was a gate that had been failing for 33
  # days on a green main: internal/audioutil leaked into the SDK dep tree on
  # 2026-07-18, internal/syncapi/progress on 07-30, internal/cache on 08-11, and
  # every "Continuous Integration ✅" in between was reporting on a run that
  # never executed the check.
  #
  # The bench build is the same failure with a different mechanism: nine
  # cmd/dedup_bench_*.go files plus internal/server/bench.go sit behind
  # `//go:build bench`, so `go build ./...` and `make ci` both skip them. On
  # 2026-04-18, b6fe7c5a "refactor: extract internal/dedup package from server"
  # moved AuthorDedupGroup/FindDuplicateAuthors out of internal/server, updated
  # internal/server/bench.go, and missed all four cmd/ call sites. Nothing
  # compiled them, so the tree did not build under -tags bench for the next four
  # months and no run ever said so.
  #
  # gofmt is the third instance of the same oversight, found while fixing the
  # first two: `grep -rn 'gofmt' .github/workflows/ Makefile` returned ZERO hits,
  # and 43 files across 24 packages had drifted out of shape as a result. The
  # sweep that fixed them landed in the same change that added this step — a
  # format gate cannot precede its own sweep without being red on 43 pre-existing
  # files, which is the trap the --enable-only comment above describes.
  #
  # Reports without blocking, for the same reason as interface-width above: main
  # has no required status checks, and auto-revert.yml is what makes a red gate
  # consequential. A PR that re-breaks sdkguard, the bench build or gofmt merges
  # anyway -- and then this job fails on main, and the merge gets reverted.
  repo-guards:
    name: Repo Guards
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libtag1-dev

      # Fails in BOTH directions against tools/cmd/sdkguard/internal-deps.txt: a
      # new internal package in the SDK's dep tree, or a stale entry that is no
      # longer a dependency. The fix for legitimate growth is
      # `go run ./tools/cmd/sdkguard/main.go -update`, which rewrites that
      # tracked file so the change is reviewable in the PR diff.
      - name: SDK internal-dependency ratchet
        run: make sdkguard

      # Both steps invoke the same make targets a contributor runs locally,
      # rather than restating the commands here. That is the point of the whole
      # change: `make ci` gained bench-check alongside sdkguard, so local and CI
      # enforce one contract and neither can drift into checking less than the
      # other. See the Makefile for why bench-check is not `build-bench`.
      - name: Typecheck bench-tagged code
        run: make bench-check

      - name: Check Go formatting
        run: make fmt-check

      # web/src/generated/ops.ts is generated from internal/operations/state
      # (tools/cmd/opsgen). A status added on the Go side without regenerating
      # leaves the web pollers classifying it as live, which spins them forever.
      # Same make target `make ci` runs.
      - name: Generated run-status table is fresh
        run: make ops-check

      # The auto-revert selector decides which commits get reverted off main, so
      # it gets tested somewhere that actually runs. Stdlib unittest, no pip step
      # -- scripts/test_check_memory_leaks.py is wired in below alongside it,
      # since check-memory-leaks.py itself is actively used (Makefile
      # check-memory-leaks target, memory-leak-scan.yml) and its regression
      # test should not sit dead.
      - name: Test the auto-revert span selector and repo scripts
        run: |
          python3 -m unittest discover -s .github/workflows/scripts -p 'test_*.py' -v
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # The Metal Whisper worker's contract tests need fastapi+httpx to drive a
      # real HTTP surface, so the stdlib unittest discovery above SKIPS them.
      # Run them for real here: they are the only thing standing between a
      # protocol change in internal/transcribe/remote.go and a Mac worker that
      # answers 200 with keys nobody reads -- a failure that surfaces as
      # "transcripts silently never land", not as an error. Deps are installed
      # directly rather than via a new action so nothing new needs SHA-pinning.
      - name: Whisper MLX worker contract tests
        run: |
          python3 -m pip install --quiet fastapi httpx pytest python-multipart
          python3 -m pytest scripts/tests/test_whisper_mlx_server.py -v

  # Project-specific: verify mockery mocks are not stale
  mocks-check:
    name: Mock Freshness
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # setup-go keeps the floating '1.27' like every other job (the toolchain
      # drift check in scripts/check_toolchain_versions.py requires it), but the
      # two mockery steps below run under GOTOOLCHAIN=go1.27.1, the Makefile pin:
      # mockery v3.8.0 (the newest release on 2026-10-09) vendors an x/tools
      # that reads export data up to format version 4, and go1.27.2 writes
      # version 5, so under 1.27.2 it fails every package with "could not
      # import fmt ... export data version 5 is greater than maximum supported
      # version 4" (ci.yml run 37886715226, the first after setup-go started
      # resolving '1.27' to 1.27.2). Drop the two env lines when a mockery
      # release reads version 5; the golangci-lint jobs moved to v2.14.0 for
      # the same reason and need no pin.
      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libtag1-dev

      # Pinned mockery version: v3.8.0 (module github.com/vektra/mockery/v3).
      # Must match scripts/setup-mockery.sh. The committed mocks (including
      # the merged internal/database/mocks/mock_store.go) were generated
      # with mockery v3, which supports package-based config and merging
      # multiple interfaces into one output file — mockery v2.53.6 does NOT
      # support merging into a shared filename (each interface's generation
      # overwrites the previous one), so v2 cannot regenerate this repo's
      # mocks at all. Do not downgrade this pin to v2.
      - name: Install mockery
        env:
          GOTOOLCHAIN: go1.27.1
        run: go install github.com/vektra/mockery/v3@v3.8.0

      # `git diff` compares the working tree against the INDEX, so it is blind
      # to files that are not tracked yet. That is precisely the case this job
      # most needs to catch: adding an interface and forgetting to commit its
      # generated mock leaves a brand-new UNTRACKED file, which `git diff`
      # reports as no change and the check passes green. `git status
      # --porcelain` lists untracked entries (as `??`) alongside modified ones,
      # so it sees both halves of "stale".
      - name: Check mockery mocks are fresh
        env:
          GOTOOLCHAIN: go1.27.1
        run: |
          set -e
          mockery
          MOCK_PATHS=(':(glob)internal/**/mocks/**' 'internal/ai/mock_*_test.go' 'internal/metadata/mock_*_test.go')
          CHANGED=$(git status --porcelain --untracked-files=all -- "${MOCK_PATHS[@]}")
          if [ -n "$CHANGED" ]; then
            echo "❌ Committed mocks are stale. Run 'make mocks' and commit."
            echo "$CHANGED"
            exit 1
          fi
          echo "✅ Mocks are up to date"

      - name: Check go generate mocks (database)
        run: |
          set -e
          go generate ./internal/database/...
          CHANGED=$(git status --porcelain --untracked-files=all -- internal/database/mocks/)
          if [ -n "$CHANGED" ]; then
            echo "❌ MockStore is stale. Run 'make mocks' and commit."
            echo "$CHANGED"
            exit 1
          fi
          echo "✅ Database mocks are fresh"

  # Project-specific: TODO.md must not contain leaked todo.d fragment headers.
  #
  # Fragment bodies are folded into TODO.md verbatim, so a fragment carrying the
  # org-mandated file/version/guid header puts four lines of comment noise into
  # the assembled task list. todo.d/README.md has always said not to add one,
  # but a rule that lives only in prose loses to the global CLAUDE.md rule that
  # says every Markdown file needs a header — 74 blocks leaked in before anyone
  # looked. assemble_todo.py now strips them on collect; this job is the second
  # layer, catching a leak that arrives some other way (a hand edit, a different
  # assembler, a revert). Seconds to run, and it needs no toolchain.
  # Deliberately NOT gated on `changes`: TODO.md is a docs path, and this is
  # the one job a docs-only change must still run.
  todo-header-lint:
    name: TODO Fragment Headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Lint TODO.md for leaked fragment headers
        run: python3 scripts/assemble_todo.py --lint

  # Project-specific: the short Go suite, in four shards (07-C3, 2026-10-09).
  #
  # Before this, the same `go test -short -race ./...` ran twice on every PR:
  # Minimal CI's `Go Tests (short, race)` (~19 min) and this file's
  # `coverage-gate` job (`make test-short`, ~23 min), and the PR waited for the
  # slower one. Now Minimal CI's copy is off (run-go-tests: false on the `ci`
  # job above) and this matrix runs the suite once, in four parallel shards.
  #
  # How the split works: scripts/ci/short_test_shards.py (via
  # `make test-short-shard SHARD=k/4`) takes every package `go list ./...`
  # reports. A package heavier than 150 s (scripts/ci/short_test_weights.json)
  # is split into groups of top-level test names, balanced by the per-test
  # seconds in scripts/ci/go_test_timings.json, each run as its own
  # `go test -run '^(...)$'`; every other package runs whole. Units are dealt
  # longest-first into four bins, deterministically, so every shard computes
  # the same plan. Before running, each shard checks that every package and
  # every split test name is assigned exactly once and that no shard is empty;
  # a compile error in a split package fails `go test -list` and the shard.
  # `short_test_shards.py --check` runs the same check over every test name.
  # Each shard uploads its merged profile as coverage-k.out; the `coverage`
  # job below merges the four and applies the floor.
  go-test-short-shards:
    name: Go Tests (short, race) shard ${{ matrix.shard }}
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    # 35, not 20. `make test-short-shard` runs go test with `-timeout 25m`, so
    # a cap of 20 would let the runner kill this job BEFORE Go's own timeout
    # could fire — and Go's timeout is the only thing that prints a goroutine
    # dump naming the stuck test.
    #
    # INVARIANT: the job cap must stay strictly greater than the longest
    # `-timeout` passed to any go test invocation in the steps below, plus
    # setup. If you raise the test timeout, raise this too.
    #
    # CORRECTION (2026-08-12): an earlier version of this comment credited the
    # #2311/#2315 `conclusion=cancelled` failures to this job's predecessor
    # (`coverage-gate`). That was wrong. Those cancellations were on
    # `Minimal CI / Go Tests (short, race)`, which is NOT defined in this file
    # — the `Minimal CI /` prefix means it comes from the reusable workflow
    # referenced by the `ci` job above
    # (falkcorp/github-common/.github/workflows/reusable-ci-minimal.yml), where
    # the cap was 20 against its own `go test -timeout 30m`. coverage-gate was
    # a different job that was never the one cancelled; it completed in
    # 13m21s on the run where Go Tests was killed at 20m16s. Fixed upstream in
    # falkcorp/github-common#346; that workflow exposes no timeout input, so it
    # could not have been fixed from this repo.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      # Not the shared `Restore Go cache (manual)` step the other jobs use.
      # That cache is keyed on go.sum alone, so once any job has saved it for
      # a go.sum, every later job hits the exact key and actions/cache never
      # saves again: it holds only the first saver's build objects, which were
      # not built with -race -covermode=atomic, so each shard recompiled the
      # whole module graph race-instrumented from scratch. On PR #3882
      # (2026-10-09) the split-package `go test -list` alone took 9 min 18 s per
      # shard before the first test ran, against ~6 min of tests.
      #
      # So the shards keep their own race-flavoured cache, keyed by a six-hour
      # slot so it refreshes: a shard restores the current slot's entry, else
      # the newest earlier one (then the shared cache, for the module download
      # at least), and a shard on main saves it after its run when the slot's
      # key is new. The four shards race for that one save; the first to
      # finish wins and the others find the key reserved and skip, so it is at
      # most four saves a day of one shard's objects plus the shared dependency
      # graph. PR runs read main's entries (a PR can read its base branch's
      # caches) and never save, so PR branches add no cache churn against the
      # 10 GB repo cap. Why not a day: main merges ten-plus PRs a day, and a
      # refactor that touches a package most of the tree imports (three of
      # them landed within three hours of the first save on 2026-10-09) makes
      # a day-old entry mostly cold; measured, a shard went from 4.5 to 8.5
      # minutes against the same entry.
      - name: Slot stamp for the race build cache
        id: stamp
        run: echo "slot=$(date -u +%F)-$(( $(date -u +%-H) / 6 ))" >> "$GITHUB_OUTPUT"

      - name: Restore Go race build cache
        id: race-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-race-short-${{ hashFiles('**/go.sum') }}-${{ steps.stamp.outputs.slot }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-race-short-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-1.27-race-short-
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libtag1-dev bc

      - name: Run short tests, one shard, with coverage profile
        id: shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          echo "n=${SHARD%%/*}" >> "$GITHUB_OUTPUT"
          make test-short-shard SHARD="$SHARD"

      # !cancelled(), not the default success(): a red run's compiled objects
      # are as reusable as a green run's, and the next run is what pays.
      - name: Save Go race build cache (main, first run of the slot)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.race-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.race-cache.outputs.cache-primary-key }}

      - name: Upload shard coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ steps.shard.outputs.n }}
          path: coverage-${{ steps.shard.outputs.n }}.out
          if-no-files-found: error
          retention-days: 3

  # Project-specific: coverage floor gate on every PR (T12 follow-up).
  # Previously this gate (`make ci`'s coverage-check-short, floor read from
  # .ci/coverage-floor.txt) only ran nightly via reusable-ci.yml's separate
  # go-test-coverage/.testcoverage.yml mechanism — never on PRs. It still
  # applies `make ci`'s local gate exactly (coverage-check-short, unchanged),
  # but to the four shard profiles merged block by block
  # (`short_test_shards.py --merge`, which fails if any shard's profile is
  # missing) instead of a profile from a run of its own. The display name is
  # the one the `coverage-gate` job had, so the check name stays the same.
  coverage:
    name: Coverage Floor (PR gate)
    needs: [changes, go-test-short-shards]
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # `go tool cover -func` resolves the profile's packages to source files,
      # so the toolchain and module cache are needed even though nothing runs.
      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libtag1-dev bc

      - name: Download shard coverage profiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: shard-coverage
          merge-multiple: true

      - name: Merge shard profiles into coverage.out
        run: >-
          python3 scripts/ci/short_test_shards.py --merge coverage.out
          shard-coverage/coverage-1.out shard-coverage/coverage-2.out
          shard-coverage/coverage-3.out shard-coverage/coverage-4.out

      - name: Check coverage floor (.ci/coverage-floor.txt)
        run: make coverage-check-short

  # Project-specific: the tests that -short skips, run WITHOUT -short.
  #
  # Every other Go test run that gates a PR passes -short: the
  # go-test-short-shards matrix above (`make test-short-shard`), and all three
  # Woodpecker test workflows. Tests built on the real-store fixture
  # internal/versionprimary/vptest (its New skips under -short) and every other
  # testing.Short() skip -- the merge, undo and redirect state-machine tests in
  # internal/merge, internal/dedup, internal/reconcile and
  # internal/server/handlers/duplicates among them -- therefore gated nothing.
  # Only Nightly Full CI ran them (reusable-ci's go-test helper runs
  # `go test -v -race ./...`), after the merge.
  #
  # `make test-fixtures` discovers the packages at run time
  # (scripts/ci/fixture_test_packages.py), so a new short-skipped test is
  # covered without editing this job. Three shards, balanced by measured
  # per-package time; internal/plugins/maintenance (215 s here since #3781
  # parallelized its fragment-fixer tests; 383 s before) sets the floor for
  # its shard.
  #
  # Gate: this job's result feeds the "Continuous Integration" workflow
  # conclusion, which is what auto-revert.yml watches on main (see the note on
  # interface-width above: there are no required status checks).
  fixture-tests:
    name: Fixture Tests (no -short, race) ${{ matrix.shard }}
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    # INVARIANT (same as go-test-short-shards): the job cap must stay strictly greater
    # than the 25m `-timeout` that `make test-fixtures` passes to go test, plus
    # setup, or the runner kills the job before Go prints the goroutine dump.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      # ffmpeg (ffmpeg + ffprobe) and libchromaprint-tools (fpcalc): the
      # selected packages include internal/audiobooks, internal/organizer,
      # internal/scanner and internal/server, whose real-audio-file tests
      # skip when exec.LookPath cannot find these tools. Without them this job
      # would report those tests as passing while running none of them.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libtag1-dev ffmpeg libchromaprint-tools

      - name: Run fixture tests without -short (shard ${{ matrix.shard }})
        run: make test-fixtures FIXTURE_SHARD=${{ matrix.shard }}
