# file: .github/workflows/ratchet-lower.yml
# version: 1.5.0
# guid: 2f6a9c13-8d47-4e0b-a5c2-91b7d3e4f068
# last-edited: 2026-11-06

# Weekly: measure every file-backed ratchet baseline listed in ci/gates.txt and,
# when a measured count is now LOWER, open a PR that lowers the file (07-G4,
# owner decision D47: ratchets fail only on a rise; a bot lowers the baseline).
#
# This workflow only ever opens a PR. It never pushes to main, never edits Go
# source (Go-constant baselines are only listed in the PR body), and
# scripts/ci/run_gates.py --lower cannot write a higher number or add an
# identifier to the deadcode set. Merge the PR with --rebase like any other.
#
# The branch push and the PR are made by the CI bot GitHub App, not by
# GITHUB_TOKEN: pull requests opened with GITHUB_TOKEN start no workflows, so the
# merge queue's required checks would never report and the PR could never merge.
name: Lower Ratchet Baselines

on:
  schedule:
    # Mondays 06:43 UTC, off the top of the hour.
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ratchet-lower-${{ github.repository }}
  cancel-in-progress: false

jobs:
  lower:
    name: Lower baselines
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Holds the CI bot app key as an environment secret (limited to the default
    # branch), so a workflow on any other branch cannot mint the app token, which
    # bypasses the main-branch ruleset. Declared on the job because environment
    # secrets reach only jobs that name the environment.
    environment: ci-bot
    # contents: read (the workflow default). The branch push and the PR are made
    # with the CI bot app token minted before the "Open PR" step.
    steps:
      # First, so a missing credential fails in seconds, not after the gates.
      - name: Require CI bot app credentials
        env:
          CLIENT_ID: ${{ vars.CI_BOT_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.CI_BOT_APP_PRIVATE_KEY != '' }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Mistake guard, not the security boundary (the environment is): fail
          # clearly when run from a branch other than the default.
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::This workflow mints the CI bot app token and must run from ${DEFAULT_BRANCH}, not ${REF_NAME}."
            exit 1
          fi
          # No fallback to GITHUB_TOKEN or a personal token: a PR opened with
          # GITHUB_TOKEN runs no CI and could never pass the merge queue.
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::Organization variable CI_BOT_APP_CLIENT_ID and organization secret CI_BOT_APP_PRIVATE_KEY must both be visible to this repository; one or both are empty."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Before the cache restore: scripts/ci/free_runner_disk.sh says why.
      - name: Free runner disk
        run: scripts/ci/free_runner_disk.sh

      - name: Restore Go cache (manual)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
            ${{ runner.os }}-go-

      - name: Install system packages
        run: scripts/ci/apt_install.sh libtag1-dev

      # Same pins as ci.yml: a version bump changes the count on its own.
      - name: Install golangci-lint and deadcode
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go -C tools/deadcode install tool
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "DEADCODE_BIN=$(go env GOPATH)/bin/deadcode" >> "$GITHUB_ENV"

      # continue-on-error so a gate that could not be measured does not discard
      # the lowerings that did succeed: the PR step below still runs, and the
      # last step turns the job red so the failure stays visible.
      - name: Lower baselines
        id: lower
        continue-on-error: true
        run: python3 scripts/ci/run_gates.py --lower --report "$RUNNER_TEMP/ratchet-report.md"

      # Minted here, not at the top: an installation token lives one hour and the
      # gates above can run for most of the job's 45 minutes.
      - name: Mint CI bot app token
        if: ${{ !cancelled() }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # permission-workflows is deliberately absent. Force-pushing the bot
          # branch from last week's base can in principle include workflow-file
          # changes that landed on main since; if a run is ever refused with
          # "refusing to allow a GitHub App to create or update workflow", add
          # `permission-workflows: write` here (and to the app) at that point.

      - name: Open PR if a baseline changed
        if: ${{ !cancelled() }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # The app token authenticates both `git push` (via the URL below) and
          # `gh`. Checkout used persist-credentials: false, so nothing persisted
          # can override the URL's token.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPORT: ${{ runner.temp }}/ratchet-report.md
        run: |
          set -euo pipefail
          BRANCH=bot/lower-ratchet-baselines

          if git diff --quiet; then
            echo "::notice::No baseline is higher than its measured value; no PR."
            cat "$REPORT"
            exit 0
          fi

          # Only baseline files may change; anything else is a bug in the bot.
          bad=$(git diff --name-only | grep -vxE '\.errcheck-baseline|\.interface-width-baseline|scripts/deadcode-baseline\.txt' || true)
          if [ -n "$bad" ]; then
            echo "::error::unexpected files changed by --lower: $bad"
            exit 1
          fi

          bash scripts/ci/set_bot_git_identity.sh "$APP_SLUG"
          git checkout -b "$BRANCH"
          git add .errcheck-baseline .interface-width-baseline scripts/deadcode-baseline.txt
          git commit -m "chore(ci): lower ratchet baselines"

          {
            echo "Lowers ratchet baselines whose measured count has fallen (ci/gates.txt, scripts/ci/run_gates.py --lower)."
            echo "The bot only writes smaller numbers and never adds an identifier to the deadcode set."
            echo
            cat "$REPORT"
            echo
            echo "Merge with rebase (this repo does not squash)."
          } > "$RUNNER_TEMP/pr-body.md"

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Lease against the branch's CURRENT remote sha (empty when absent): a
          # bare --force-with-lease against a URL has no remote-tracking ref and
          # is rejected as stale when last week's bot branch still exists.
          bash scripts/ci/push_bot_branch.sh "$REMOTE" "$BRANCH"

          # The bot PR only lowers numbers, so it carries no changelog fragment;
          # the skip-changelog label tells changelog-check.yml so.
          if gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pr-body.md" \
              --add-label skip-changelog
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$DEFAULT_BRANCH" \
              --title "chore(ci): lower ratchet baselines" --body-file "$RUNNER_TEMP/pr-body.md" \
              --label skip-changelog
          fi

      - name: Fail the job if a gate could not be measured
        if: ${{ !cancelled() && steps.lower.outcome == 'failure' }}
        run: |
          echo "::error::run_gates.py --lower could not measure at least one gate; see the 'Lower baselines' step and the PR body."
          exit 1
