# file: .github/dependabot.yml
# version: 1.4.5
# guid: 9f416cf7-2df6-4a47-93b9-630339256aec
# last-edited: 2026-11-07

version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: tuesday
      time: "10:00"
      timezone: America/New_York
    labels:
      - dependencies
      - dependabot
    commit-message:
      prefix: deps
      include: scope

updates:
  # Docker
  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    labels:
      - containers

  # Github Actions
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    labels:
      - github-actions
      - ci-cd

  # Git submodules — .standards is the org-wide coding standards submodule
  # (falkcorp/.github). It is a pinned commit, not a live link: without this
  # entry the pin only moves when someone remembers to bump it by hand, and
  # nobody did between 2026-08-10 and 2026-08-30 while instructions/go.md
  # gained 266 lines. CLAUDE.md points contributors at .standards/ as
  # authoritative, so a stale pin silently serves outdated rules.
  - package-ecosystem: gitsubmodule
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    labels:
      - documentation

  # Gomod — the root module and the nested core module (03 §3.2 item 6). One
  # entry with both directories under the one multi-ecosystem group, so a
  # version update arrives as one PR spanning / and /core and the root build
  # never ships a version core CI did not run (check_module_skew.py backs it).
  - package-ecosystem: gomod
    directories: ["/", "/core"]
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    labels:
      - tech:go
    ignore:
      # Pinned (13 §13.5.2, "Dependencies that must not float"): jsonschema-go
      # is pre-1.0, so a minor bump can change the schemas core serves. An
      # upgrade is a deliberate PR gated by TestSchema_Golden; check_module_skew.py
      # --pin (make module-skew) fails when a transitive requirement lifts it.
      - dependency-name: github.com/google/jsonschema-go
      # Pinned (13 §13.5.2): the OTel Prometheus exporter is pre-1.0 and turns
      # OTel instrument names into the served family names every dashboard and
      # recording rule reads, so a minor bump can rename a series. An upgrade
      # is a deliberate PR gated by the series contract and
      # TestDeployReferencedSeriesServed; check_module_skew.py --pin fails
      # when a transitive requirement lifts it.
      - dependency-name: go.opentelemetry.io/otel/exporters/prometheus

  # Npm — the manifest lives in /web (root manifests were removed in the
  # "consolidate root npm deps into web" cleanup), so this MUST target /web or
  # none of the ignore rules below apply to the real package.json.
  # /core/web holds the shared web packages (platform-core 07 §7.3.2; R1-30
  # creates it). Both trees install through scripts/ci/build_web.sh.
  - package-ecosystem: npm
    directories: ["/web", "/core/web"]
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    labels:
      - tech:nodejs
    ignore:
      # Block all major version updates (scheduled version updates only).
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # Hard-pin jsdom. 30.1.0 broke MUI's FocusTrap unmount path: restoring
      # focus throws `nodeToRestore.current.focus is not a function`, which
      # fails every test that opens and closes a Dialog. It turned main red at
      # dcb03006c (Minimal CI / Frontend Unit Tests), across test files that
      # share nothing but a dialog.
      #
      # Measured on one tree, changing only this package:
      #   jsdom 30.1.0 -> 5 failed | 7 passed
      #   jsdom 30.0.1 -> 12 passed
      # (web/src/components/system/ChapterConsolidationCard.test.tsx)
      #
      # package.json pins the exact version; this rule stops a re-bump,
      # including a security update jumping the minor. To revisit: unpin both,
      # run that file, and only keep the bump if it is 12/12.
      - dependency-name: "jsdom"
        versions: [">=30.1.0"]
