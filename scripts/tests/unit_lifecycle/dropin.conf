#
# The drop-in scripts/tests/test_unit_lifecycle.py installs beside the
# committed unit (deploy/audiobook-organizer.service) as
# /etc/systemd/system/audiobook-organizer.service.d/unit-lifecycle.conf
# (09 §9.2.1, the unit-lifecycle row). It overrides ONLY what a CI runner
# forces: the binary (the one the job built with -tags unitlifecycle), the
# database path, and PrivateNetwork=yes so the fixture store has no network.
# Everything the job exists to test (Type=notify, TimeoutStartSec,
# Restart=on-failure, RestartPreventExitStatus, KillMode, the hardening) is
# the committed unit's own. The test fails if this file sets anything else.
#
# The fake migration's duration is not here: the test sets
# MEDIACORE_FAKE_MIGRATION on the service manager (systemctl set-environment)
# for the cell that needs it.

[Service]
ExecStart=
ExecStart=/usr/local/bin/abo-unit-lifecycle serve --host 0.0.0.0 --port 8484
Environment="DATABASE_PATH=/var/lib/audiobook-organizer/unit-lifecycle.pebble"
PrivateNetwork=yes
