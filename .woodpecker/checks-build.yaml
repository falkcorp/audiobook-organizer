# file: .woodpecker/checks-build.yaml
# version: 1.6.0
# guid: 544e8a0d-e5d0-4952-8fb5-c05cde1dd245
# last-edited: 2026-10-11
#
# The non-linter gates of `make ci`: vet (test-short's prerequisite),
# fmt-check, sdkguard, bench-check, and the web tests, each step running the
# same make target `make ci` runs. The linter gates (staticcheck, the errcheck
# ratchet, mocks-check) are in checks-lint.yaml on U0; the two were one
# `checks` workflow on U0 until 2026-09-29 and are split so they run on both
# hosts at once. None of these steps needs the installed linters.
#
# Runs on any heavy local-backend agent (`heavy=true`): U1 (Linux amd64, 48
# cores) or llm1 (macOS arm64); the server picks whichever has a free slot,
# effectively at random, since both score the same. `image` names the
# shell that runs the commands. The caches are host directories shared with
# the test workflows; scripts/ci/cache_env.sh picks /tank/ci/cache on U1 and
# /Users/jdfalk/ci/cache on llm1. Node on U1 is the official v26 tarball under
# /tank/ci/tools/node (checksum-verified; see docs/ci/woodpecker.md); llm1 uses
# the node on the agent's PATH (Homebrew). PATH puts the pinned Go toolchain's
# own bin first so fmt-check runs gofmt 1.27.2, not whatever gofmt the host's
# own Go ships (Ubuntu's older /usr/bin/gofmt on U1).

labels:
  # Any agent labelled heavy=true: U1 or llm1 (see docs/ci/woodpecker.md).
  heavy: "true"

when:
  # Manual only (owner 2026-10-02). Automatic push and pull_request runs let
  # several pipelines start at once whenever agents pushed to several PRs,
  # loading U1 and U0 (prod) together; the server has also crashed under
  # parallel pipelines. CI is queued one pipeline at a time via the API
  # (`make ci-woodpecker` / scripts/ci_woodpecker.py). The repo's allow_pr
  # setting is off as well.
  - event: manual

clone:
  - name: clone
    image: woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    settings:
      lfs: false  # GitHub's LFS budget is exhausted; no check reads LFS content
      depth: 50

variables:
  - &go_env
    GOTOOLCHAIN: go1.27.2
    # -trimpath: every run clones into a new woodpecker-local-<n> workdir, and
    # without it Go keys each package's cache entry on that directory, so the
    # shared cache would never hit (see test-server-scanner.yaml).
    GOFLAGS: -buildvcs=false -trimpath
    # GOCACHE and GOMODCACHE are not set here: they differ per host, so each
    # step's first command sources scripts/ci/cache_env.sh.

steps:
  - name: vet
    image: bash
    environment: *go_env
    commands:
      - . scripts/ci/cache_env.sh || exit 1
      - make --no-print-directory vet

  - name: fmt-sdkguard-bench
    image: bash
    environment: *go_env
    commands:
      - . scripts/ci/cache_env.sh || exit 1
      - export PATH="$$(go env GOROOT)/bin:$$PATH"
      - command -v gofmt && go version
      - make --no-print-directory fmt-check
      - make --no-print-directory sdkguard
      - make --no-print-directory ops-check
      - make --no-print-directory bench-check

  - name: web-test
    image: bash
    commands:
      # Sets npm_config_cache (the shared npm cache) for this host.
      - . scripts/ci/cache_env.sh || exit 1
      # U1 pins node to the checksum-verified tarball; other hosts (llm1) use
      # the node already on the agent's PATH.
      - if [ -d /tank/ci/tools/node/bin ]; then export PATH="/tank/ci/tools/node/bin:$$PATH"; fi
      - node --version
      - npm ci --prefix web --no-audit --no-fund
      # vitest defaults to availableParallelism()-1 workers (47 on U1). Beside
      # vet and fmt that starves the box: workers stall for tens of seconds and
      # tests hit the 30s timeout. Eight workers keep the suite fast without it.
      - cd web && npm run test -- --run --maxWorkers=8

  - name: cleanup
    # Same cleanup as test-rest.yaml: cap the shared GOCACHE, clear this clone
    # and the per-run HOME, and sweep workdirs left by a crashed agent.
    image: bash
    depends_on: [vet, fmt-sdkguard-bench, web-test]
    when:
      - status: [success, failure]
    commands:
      # Sets GOCACHE for this host; see the other steps.
      - . scripts/ci/cache_env.sh || true
      - '[ -n "$${GOCACHE}" ] && python3 scripts/ci/trim_go_cache.py "$${GOCACHE}" --max-gb 40 --target-gb 30 || true'
      - '[ -n "$${CI_WORKSPACE}" ] && [ "$${CI_WORKSPACE}" != / ] && find "$${CI_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true'
      - '[ -n "$${HOME}" ] && [ -d "$${HOME}/go" ] && chmod -R u+w "$${HOME}/go" && rm -rf "$${HOME}/go" || true'
      - 'find "$${TMPDIR:-/tmp}" -maxdepth 1 -name "go-build*" -type d -mmin +60 -exec rm -rf {} + 2>/dev/null || true'
      - '[ -n "$${HOME}" ] && W=$$(dirname "$${HOME}") && R=$$(dirname "$$W") && case "$$(basename "$$W")" in woodpecker-local-*) find "$$R" -mindepth 1 -maxdepth 1 -name "woodpecker-local-*" -type d ! -path "$$W" -mmin +180 -exec sh -c "chmod -R u+w \"\$$@\" && rm -rf \"\$$@\"" _ {} + ;; esac || true'
