# file: .woodpecker/checks-lint.yaml
# version: 2.3.2
# guid: e5b7c2a9-4d18-4a3e-9f60-8b2c1d7e3a55
# last-edited: 2026-10-09
#
# The linter gates of `make ci`: staticcheck, the errcheck ratchet and
# mocks-check, each as its own step so one failure does not hide the others.
# Each step runs the same make target `make ci` runs. The other gates (vet,
# fmt-check, sdkguard, bench-check, web tests) are in checks-build.yaml on U1;
# the two were one `checks` workflow on U0 until 2026-09-29 and are split so
# they run on both hosts at once.
#
# These three stay on the prod host's docker agent (2 workflows at a time,
# 8 CPU / 16 GiB per step container) because they share the installed
# linters. Tool versions match scripts/setup-mockery.sh.
#
# Caches: /ci-cache is a host directory the U0 agent mounts into every step
# container (WOODPECKER_BACKEND_DOCKER_VOLUMES; see docs/ci/woodpecker.md), an
# NVMe ZFS dataset with its own quota. Until 2026-09-29 the caches lived under
# /woodpecker/cache, but the docker backend creates /woodpecker as a volume
# per workflow and deletes it at the end, so every run re-downloaded and
# rebuilt the linters (89-131 s) and built the repo cold: 566 s, the slowest
# workflow. The mount is set on the agent, not here, so the repo does not need
# Woodpecker's Trusted flag (which would let any pipeline file mount any host
# path on the prod host). /ci-cache lies outside the source tree.

labels:
  host: u0

when:
  # Manual only (owner 2026-10-02). Automatic push and pull_request runs let
  # several pipelines start at once whenever agents pushed to several PRs,
  # loading U1 and U0 (prod) together; the server has also crashed under
  # parallel pipelines. CI is queued one pipeline at a time via the API
  # (`make ci-woodpecker` / scripts/ci_woodpecker.py). The repo's allow_pr
  # setting is off as well.
  - event: manual

clone:
  - name: clone
    image: woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    settings:
      lfs: false  # GitHub's LFS budget is exhausted; no check reads LFS content
      depth: 50

variables:
  - &go_image golang:1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61
  - &go_env
    GOTOOLCHAIN: go1.27.2
    GOFLAGS: -buildvcs=false
    GOCACHE: /ci-cache/go-build
    GOMODCACHE: /ci-cache/gomod
    GOBIN: /ci-cache/bin
    XDG_CACHE_HOME: /ci-cache/xdg

steps:
  - name: tools
    image: *go_image
    environment: *go_env
    commands:
      # Fails fast unless /ci-cache is the real cache dataset. A bind mount
      # alone is not proof: if the dataset is not mounted on the host, docker
      # creates an empty host directory in its place, on the root filesystem
      # and outside the quota. The marker file lives only on the dataset.
      - 'test -f /ci-cache/.woodpecker-cache-dataset || { echo "::error::/ci-cache is not the nvmecache/woodpecker-cache dataset; see docs/ci/woodpecker.md"; exit 1; }'
      # A few seconds once the caches are warm: go install skips the copy when
      # the installed binary is already current, so only a version bump
      # rewrites a file in GOBIN.
      - go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - go install github.com/vektra/mockery/v3@v3.8.0

  - name: staticcheck
    image: *go_image
    environment: *go_env
    depends_on: [tools]
    commands:
      - export PATH="$$GOBIN:$$PATH"
      - make --no-print-directory staticcheck

  - name: errcheck-ratchet
    image: *go_image
    environment: *go_env
    depends_on: [tools]
    commands:
      - export PATH="$$GOBIN:$$PATH"
      - make --no-print-directory lint-errcheck-ratchet

  - name: mocks-check
    # After the linters, not beside them: mockery rewrites the committed mock
    # files, and a linter parsing one mid-write reports a spurious error.
    image: *go_image
    environment: *go_env
    depends_on: [staticcheck, errcheck-ratchet]
    commands:
      - export PATH="$$GOBIN:$$PATH"
      - make --no-print-directory mocks-check

  - name: cache-trim
    # Keeps the shared build cache under its budget, least recently used
    # first. The dataset behind /ci-cache also has a hard ZFS quota; this step
    # keeps the cache well below it so builds never fail on a full cache.
    image: *go_image
    environment: *go_env
    depends_on: [staticcheck, errcheck-ratchet, mocks-check]
    when:
      - status: [success, failure]
    commands:
      - python3 scripts/ci/trim_go_cache.py "$${GOCACHE}" --max-gb 40 --target-gb 30 || true
