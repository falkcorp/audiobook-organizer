# file: .woodpecker/checks.yaml
# version: 1.1.0
# guid: e5b7c2a9-4d18-4a3e-9f60-8b2c1d7e3a55
# last-edited: 2026-09-29
#
# The non-test gates of `make ci`, each as its own step so one failure does not
# hide the others: vet (test-short's prerequisite), staticcheck, the errcheck
# ratchet, mocks-check, fmt-check, sdkguard, bench-check, and the web tests.
# Each step runs the same make target `make ci` runs.
#
# Runs on the prod host's agent (docker backend, 2 workflows at a time, 8 CPU /
# 16 GiB per step container), alongside test-database. Measured on Linux: vet about 20 s,
# staticcheck about 105 s, errcheck ratchet about 90 s, bench-check about 60 s,
# web tests about 50 s, plus about 2 min to install the pinned tools. The
# workflow finishes in roughly the time the Mac test workflows take.
#
# Tool versions match the runner nodes and scripts/setup-mockery.sh. Binaries,
# the Go build cache and the module cache live under /ci-cache, which lies
# outside the source tree (fmt-check runs `gofmt -l .` on the tree).
#
# /ci-cache is a host directory the U0 agent mounts into every step container
# (WOODPECKER_BACKEND_DOCKER_VOLUMES; see docs/ci/woodpecker.md). Until
# 2026-09-29 the caches lived under /woodpecker/cache, but the docker backend
# creates /woodpecker as a volume per workflow and deletes it at the end, so
# every run re-downloaded and rebuilt the linters (89-131 s) and built the repo
# cold: 566 s, the slowest workflow. The mount is set on the agent, not in this
# file, so the repo does not need Woodpecker's Trusted flag (which would let
# any pipeline file mount any host path on the prod host).

labels:
  host: u0

when:
  - event: [push, pull_request, manual]

clone:
  - name: clone
    image: woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    settings:
      lfs: false  # GitHub's LFS budget is exhausted; no check reads LFS content
      depth: 50

variables:
  - &go_image golang:1.27.1-bookworm@sha256:69a7b9788769bec032d238959b61854e9ae87f57be9029ec04e9885fabf99195
  - &go_env
    GOTOOLCHAIN: go1.27.1
    GOFLAGS: -buildvcs=false
    GOCACHE: /ci-cache/go-build
    GOMODCACHE: /ci-cache/gomod
    GOBIN: /ci-cache/bin
    GOLANGCI_LINT_CACHE: /ci-cache/golangci-lint
    XDG_CACHE_HOME: /ci-cache/xdg

steps:
  - name: tools
    image: *go_image
    environment: *go_env
    commands:
      # Fails fast if the agent's cache mount is missing: without it these
      # paths would sit in the step container and vanish with it.
      - 'mountpoint -q /ci-cache || { echo "::error::/ci-cache is not mounted; see docs/ci/woodpecker.md"; exit 1; }'
      # A few seconds once the caches are warm; go install renames the binary
      # into GOBIN, so a concurrent workflow still running the old one is
      # unaffected.
      - go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - go install github.com/vektra/mockery/v3@v3.7.4

  - name: vet
    image: *go_image
    environment: *go_env
    depends_on: [tools]
    commands:
      - make --no-print-directory vet

  - name: staticcheck
    image: *go_image
    environment: *go_env
    depends_on: [tools]
    commands:
      - export PATH="$$GOBIN:$$PATH"
      - make --no-print-directory staticcheck

  - name: errcheck-ratchet
    image: *go_image
    environment: *go_env
    depends_on: [tools]
    commands:
      - export PATH="$$GOBIN:$$PATH"
      - make --no-print-directory lint-errcheck-ratchet

  - name: mocks-check
    image: *go_image
    environment: *go_env
    depends_on: [tools]
    commands:
      - export PATH="$$GOBIN:$$PATH"
      - make --no-print-directory mocks-check

  - name: fmt-sdkguard-bench
    image: *go_image
    environment: *go_env
    depends_on: [tools]
    commands:
      - make --no-print-directory fmt-check
      - make --no-print-directory sdkguard
      - make --no-print-directory bench-check

  - name: web-test
    image: node:26-alpine@sha256:dbaa92e5758cbbcf85d65d5403fdb530fe3442cbe8c6dbfb7ef23365450d5070
    depends_on: []
    environment:
      npm_config_cache: /ci-cache/npm
    commands:
      - npm ci --prefix web --no-audit --no-fund
      - cd web && npm run test -- --run

  - name: cache-trim
    # Keeps the shared build cache under its budget, least recently used
    # first. The dataset behind /ci-cache also has a hard ZFS quota; this step
    # keeps the cache well below it so builds never fail on a full cache.
    image: *go_image
    environment: *go_env
    depends_on: [vet, staticcheck, errcheck-ratchet, mocks-check, fmt-sdkguard-bench]
    when:
      - status: [success, failure]
    commands:
      - python3 scripts/ci/trim_go_cache.py "$${GOCACHE}" --max-gb 40 --target-gb 30
