# file: .woodpecker/checks.yaml
# version: 2.0.0
# guid: e5b7c2a9-4d18-4a3e-9f60-8b2c1d7e3a55
# last-edited: 2026-09-29
#
# The non-test gates of `make ci`, each as its own step so one failure does not
# hide the others: vet (test-short's prerequisite), staticcheck, the errcheck
# ratchet, mocks-check, fmt-check, sdkguard, bench-check, and the web tests.
# Each step runs the same make target `make ci` runs.
#
# Runs on the U1 agent (local backend, Linux amd64, 48 cores). It ran on the
# prod host's docker agent until 2026-09-29, where it took 566 s and set the
# CI wall time: the docker backend mounts /woodpecker as a volume created for
# each workflow and deleted at its end, so every run re-downloaded and rebuilt
# staticcheck, golangci-lint and mockery (89-131 s) and then built the whole
# repo cold in five steps at once. A host directory as the cache needs the
# repo to be Trusted. On the local backend the caches below are ordinary host
# directories on U1's tank/ci dataset and persist between runs.
#
# Tool versions match the runner nodes and scripts/setup-mockery.sh. Node is
# the official v26 tarball under /tank/ci/tools/node (checksum-verified; see
# docs/ci/woodpecker.md). PATH puts the pinned Go toolchain's own bin first so
# fmt-check runs gofmt 1.27.1, not the older /usr/bin/gofmt from Ubuntu's Go.

labels:
  host: u1

when:
  - event: [push, pull_request, manual]

clone:
  - name: clone
    image: woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    settings:
      lfs: false  # GitHub's LFS budget is exhausted; no check reads LFS content
      depth: 50

variables:
  - &go_env
    GOTOOLCHAIN: go1.27.1
    # -trimpath: every run clones into a new woodpecker-local-<n> workdir, and
    # without it Go keys each package's cache entry on that directory, so the
    # shared cache would never hit (see test-server-scanner.yaml).
    GOFLAGS: -buildvcs=false -trimpath
    GOCACHE: /tank/ci/cache/go-build
    GOMODCACHE: /tank/ci/cache/gomod
    GOBIN: /tank/ci/cache/bin
    GOLANGCI_LINT_CACHE: /tank/ci/cache/golangci-lint
    XDG_CACHE_HOME: /tank/ci/cache/xdg
  - &path_setup 'export PATH="$$GOBIN:$$(go env GOROOT)/bin:$$PATH"'

steps:
  - name: tools
    # Local backend: `image` names the SHELL that runs the commands.
    image: bash
    environment: *go_env
    commands:
      # A few seconds once the caches are warm. go install renames the binary
      # into GOBIN, so a concurrent pipeline still running the old file is
      # unaffected.
      - go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - go install github.com/vektra/mockery/v3@v3.7.4

  - name: vet
    image: bash
    environment: *go_env
    depends_on: [tools]
    commands:
      - make --no-print-directory vet

  - name: staticcheck
    image: bash
    environment: *go_env
    depends_on: [tools]
    commands:
      - *path_setup
      - make --no-print-directory staticcheck

  - name: errcheck-ratchet
    image: bash
    environment: *go_env
    depends_on: [tools]
    commands:
      - *path_setup
      - make --no-print-directory lint-errcheck-ratchet

  - name: mocks-check
    image: bash
    environment: *go_env
    depends_on: [tools]
    commands:
      - *path_setup
      - make --no-print-directory mocks-check

  - name: fmt-sdkguard-bench
    image: bash
    environment: *go_env
    depends_on: [tools]
    commands:
      - *path_setup
      - command -v gofmt && go version
      - make --no-print-directory fmt-check
      - make --no-print-directory sdkguard
      - make --no-print-directory bench-check

  - name: web-test
    image: bash
    depends_on: []
    environment:
      npm_config_cache: /tank/ci/cache/npm
    commands:
      - export PATH="/tank/ci/tools/node/bin:$$PATH"
      - node --version
      - npm ci --prefix web --no-audit --no-fund
      - cd web && npm run test -- --run

  - name: cleanup
    # Same cleanup as test-rest.yaml: cap the shared GOCACHE, clear this clone
    # and the per-run HOME, and sweep workdirs left by a crashed agent.
    image: bash
    depends_on: [vet, staticcheck, errcheck-ratchet, mocks-check, fmt-sdkguard-bench, web-test]
    when:
      - status: [success, failure]
    environment:
      GOCACHE: /tank/ci/cache/go-build
    commands:
      - '[ -n "$${GOCACHE}" ] && python3 scripts/ci/trim_go_cache.py "$${GOCACHE}" --max-gb 40 --target-gb 30 || true'
      - '[ -n "$${CI_WORKSPACE}" ] && [ "$${CI_WORKSPACE}" != / ] && find "$${CI_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true'
      - '[ -n "$${HOME}" ] && [ -d "$${HOME}/go" ] && chmod -R u+w "$${HOME}/go" && rm -rf "$${HOME}/go" || true'
      - 'find "$${TMPDIR:-/tmp}" -maxdepth 1 -name "go-build*" -type d -mmin +60 -exec rm -rf {} + 2>/dev/null || true'
      - '[ -n "$${HOME}" ] && W=$$(dirname "$${HOME}") && R=$$(dirname "$$W") && case "$$(basename "$$W")" in woodpecker-local-*) find "$$R" -mindepth 1 -maxdepth 1 -name "woodpecker-local-*" -type d ! -path "$$W" -mmin +180 -exec sh -c "chmod -R u+w \"\$$@\" && rm -rf \"\$$@\"" _ {} + ;; esac || true'
