# file: .woodpecker/test-rest.yaml
# version: 1.2.0
# guid: c84e1b3d-2f9a-4c57-8d06-e3a1b7f5d942
# last-edited: 2026-09-29
#
# `make ci` test-short, part 3 of 3: every other package in `go list ./...`.
# That includes internal/plugins/maintenance (65-110 s), internal/operations/
# registry (about 95 s), internal/applygate (about 450 s on Linux) and the
# remaining decode packages: audiobooks, audioutil, fingerprint, mediainfo,
# metadata, metafetch, organizer, plugins/acoustid, remux, transcode and
# server/handlers/audiobooks.
#
# The exclusion list below must stay the exact complement of the other two test
# workflows, so each package runs exactly once and the coverage sum counts it
# once. `go list` runs on a fresh clone, where web/node_modules does not exist.
# That keeps the third-party Go package vendored inside it out of the list.
#
# The decode packages need ffmpeg, ffprobe and fpcalc, so this runs on the Mac
# agent (local backend), never on the prod host.

labels:
  host: mac

when:
  - event: [push, pull_request, manual]

clone:
  - name: clone
    image: woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    settings:
      lfs: false  # GitHub's LFS budget is exhausted; no test reads LFS content
      depth: 50

steps:
  - name: test
    # Local backend: `image` names the SHELL that runs the commands, not a
    # container image; the step runs on the host with the agent's PATH.
    image: bash
    environment:
      GOTOOLCHAIN: go1.27.1
      # The local backend gives every pipeline a fresh HOME, so Go's default
      # caches ($HOME/go/pkg/mod, which also holds the downloaded toolchain, and
      # $HOME/Library/Caches/go-build) were re-created per run and never removed:
      # 107 leftover workdirs held 117 GB on 2026-09-28 and filled the disk.
      # One host-wide cache is shared instead; Go locks both, so concurrent
      # pipelines are safe.
      GOMODCACHE: /Users/jdfalk/ci/cache/gomod
      GOCACHE: /Users/jdfalk/ci/cache/go-build
    commands:
      - command -v ffmpeg && command -v ffprobe && command -v fpcalc
      - >-
        PKGS=$$(go list ./... | grep -v /node_modules/ |
        grep -vxE 'github.com/falkcorp/audiobook-organizer/internal/(database|server|scanner|server/handlers/abs)')
        && go test $$PKGS -short -race -covermode=atomic -coverprofile=cover.out -timeout 25m
      - awk -v wf=test-rest 'NR>1{t+=$$2; if($$3>0)c+=$$2} END{printf "CI-COVERAGE workflow=%s covered=%d total=%d\n", wf, c, t}' cover.out

  - name: cleanup
    # Runs on success and failure: the local backend never deletes a pipeline's
    # workdir, so clear this clone and anything left in the per-run HOME.
    image: bash
    when:
      - status: [success, failure]
    environment:
      GOCACHE: /Users/jdfalk/ci/cache/go-build
    commands:
      - '[ -n "$${CI_WORKSPACE}" ] && [ "$${CI_WORKSPACE}" != / ] && find "$${CI_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true'
      - '[ -n "$${HOME}" ] && [ -d "$${HOME}/go" ] && chmod -R u+w "$${HOME}/go" && rm -rf "$${HOME}/go" || true'
      # The shared GOCACHE has no size cap and race+cover builds grow it fast
      # (94 GB on 2026-09-29, filling the disk). Drop entries unused for a day (go refreshes mtime on use).
      - '[ -n "$${GOCACHE}" ] && find "$${GOCACHE}" -type f -mtime +1 -delete 2>/dev/null || true'
      # A killed build leaves its go-build temp dir behind; clear any over an hour old.
      - 'find "$${TMPDIR:-/tmp}" -maxdepth 1 -name "go-build*" -type d -mmin +60 -exec rm -rf {} + 2>/dev/null || true'
